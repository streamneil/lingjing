<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用量计费 · 灵镜</title>
<link rel="icon" type="image/svg+xml" href="/brand/lingjing-favicon.svg">
<link rel="stylesheet" href="app.css">
<style>
  /* ───────── 用量计费 · 「燃尽决策台」局部样式 ─────────
     页面只服务一个问题:我们还剩多少,够撑多久,钱花在哪。
     延续设计系统「静默精密器械」语言:纯黑哑光、白底强调、Space Mono 数字。 */

  /* 决策区:左 余额+燃尽预测,右 30 天消耗趋势脊线 */
  .bl-deck{
    display:grid; grid-template-columns:1.15fr 1fr; gap:18px; margin-bottom:18px;
  }
  @media (max-width:900px){ .bl-deck{ grid-template-columns:1fr; } }

  .bl-bal{
    position:relative; overflow:hidden;
    background:
      radial-gradient(120% 140% at 0% 0%, rgba(77,141,255,.08), transparent 55%),
      var(--card);
    border:1px solid var(--line); border-radius:var(--r-lg); padding:26px 28px;
    animation:blRise .5s var(--ease-out) both;
  }
  .bl-bal::after{ /* 细网格氛围 */
    content:""; position:absolute; inset:0; pointer-events:none; opacity:.5;
    background-image:linear-gradient(var(--hairline) 1px,transparent 1px),linear-gradient(90deg,var(--hairline) 1px,transparent 1px);
    background-size:34px 34px; mask-image:radial-gradient(70% 80% at 90% 10%,#000,transparent 75%);
  }
  .bl-bal .cap{ font-size:11px; font-family:var(--f-mono); letter-spacing:1.5px; text-transform:uppercase; color:var(--t3); display:flex; align-items:center; gap:8px; position:relative; }
  .bl-bal .cap .led{ width:6px; height:6px; border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green); }
  .bl-bal .cap .led.low{ background:var(--amber); box-shadow:0 0 8px var(--amber); }
  .bl-bal .big{ font-family:var(--f-en); font-size:54px; font-weight:800; letter-spacing:-.03em; line-height:1.05; margin:14px 0 2px; position:relative; }
  .bl-bal .big .u{ font-size:18px; color:var(--t3); font-weight:600; margin-left:6px; }
  .bl-bal .runway{ position:relative; display:inline-flex; align-items:center; gap:9px; margin-top:14px; padding:8px 14px; border-radius:var(--r-pill); background:var(--field); border:1px solid var(--line-soft); font-size:13px; color:var(--t2); }
  .bl-bal .runway b{ color:var(--t1); font-family:var(--f-en); font-weight:700; }
  .bl-bal .runway.warn{ background:rgba(255,178,62,.1); border-color:rgba(255,178,62,.25); color:var(--amber); }
  .bl-bal .runway.warn b{ color:var(--amber); }
  .bl-bal .rate{ position:relative; margin-top:13px; font-size:11.5px; color:var(--t4); font-family:var(--f-mono); }

  /* 30 天趋势脊线卡 */
  .bl-trend{
    background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); padding:22px 24px 16px;
    display:flex; flex-direction:column; animation:blRise .5s var(--ease-out) .06s both;
  }
  .bl-trend .th{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px; }
  .bl-trend .th .t{ font-size:13px; color:var(--t2); font-weight:600; }
  .bl-trend .th .s{ font-size:11px; font-family:var(--f-mono); color:var(--t4); letter-spacing:.5px; }
  .bl-trend .spark{ flex:1; min-height:96px; margin-top:auto; position:relative; }
  .bl-trend svg{ width:100%; height:100%; display:block; overflow:visible; }
  .bl-trend .axis{ display:flex; justify-content:space-between; font-size:10px; font-family:var(--f-mono); color:var(--t5); margin-top:6px; }
  .bl-spark-path{ stroke-dasharray:1200; stroke-dashoffset:1200; animation:blDraw 1.1s var(--ease-out) .2s forwards; }
  @keyframes blDraw{ to{ stroke-dashoffset:0; } }
  @keyframes blRise{ from{ opacity:0; transform:translateY(12px); } to{ opacity:1; transform:none; } }

  /* 明细工具条:筛选 + 导出 */
  .bl-tools{ display:flex; align-items:center; gap:10px; margin-left:auto; }
  .bl-seg{ display:inline-flex; background:var(--field); border:1px solid var(--line); border-radius:var(--r-pill); padding:3px; }
  .bl-seg button{ border:none; background:none; color:var(--t3); font-family:var(--f); font-size:12px; padding:6px 13px; border-radius:var(--r-pill); cursor:pointer; transition:.15s; white-space:nowrap; }
  .bl-seg button.on{ background:var(--t1); color:#0A0A0B; font-weight:600; }
  .bl-seg button:hover:not(.on){ color:var(--t1); }
  /* 消费人 / 工具 筛选下拉(document 外部点击关闭,复用 tts/assets 修复) */
  .bl-pop-anchor{ position:relative; }
  .bl-pill{ display:flex; align-items:center; gap:7px; padding:8px 12px; background:var(--field); border:1px solid var(--line); border-radius:var(--r); font-size:12.5px; color:var(--t2); cursor:pointer; white-space:nowrap; transition:border-color .15s; }
  .bl-pill:hover{ border-color:var(--line-hi); }
  .bl-pill.open{ border-color:var(--blue); color:var(--t1); }
  .bl-pill svg{ width:13px; height:13px; color:var(--t4); transition:transform .2s; }
  .bl-pill.open svg{ transform:rotate(180deg); }
  .bl-pop{ position:absolute; top:calc(100% + 6px); right:0; min-width:170px; max-height:280px; overflow-y:auto; background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:0 12px 32px rgba(0,0,0,.5); padding:6px; display:none; z-index:30; }
  .bl-pop.show{ display:block; }
  .bl-pop .opt{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 11px; border-radius:8px; font-size:12.5px; color:var(--t2); cursor:pointer; }
  .bl-pop .opt:hover{ background:var(--field); color:var(--t1); }
  .bl-pop .opt.on{ color:var(--blue); }
  .bl-pop .opt .ck{ width:14px; height:14px; opacity:0; }
  .bl-pop .opt.on .ck{ opacity:1; }

  .bl-csv{ display:inline-flex; align-items:center; gap:7px; text-decoration:none; }
  .bl-csv svg{ width:14px; height:14px; }

  /* 续费 / 扩容:克制的对公引导,非自助下单 */
  .bl-renew{ margin-top:26px; display:flex; align-items:center; gap:18px; background:linear-gradient(100deg, var(--card), var(--bg-soft)); border:1px solid var(--line); border-radius:var(--r-lg); padding:22px 26px; animation:blRise .5s var(--ease-out) .12s both; }
  .bl-renew .ic{ width:42px; height:42px; flex:none; border-radius:12px; background:var(--field); border:1px solid var(--line); display:grid; place-items:center; }
  .bl-renew .ic svg{ width:20px; height:20px; color:var(--t2); }
  .bl-renew .tx{ flex:1; }
  .bl-renew .tx b{ font-size:14px; color:var(--t1); font-weight:600; }
  .bl-renew .tx p{ font-size:12.5px; color:var(--t3); margin-top:4px; line-height:1.6; }

  /* 表格里数值与徽标的细节 */
  .bl-amt{ font-family:var(--f-en); font-weight:700; text-align:right; }
  .bl-amt.pos{ color:var(--green); }
  .bl-amt.neg{ color:var(--t1); }
  /* 「作品」可点链接:文案摘要,hover 下划线提示可预览 */
  .bl-work{ color:var(--blue); text-decoration:none; cursor:pointer; border-radius:4px; }
  .bl-work:hover{ text-decoration:underline; }
  .bl-work:focus-visible{ outline:2px solid var(--blue); outline-offset:2px; }
  .bl-empty{ text-align:center; color:var(--t4); padding:54px 20px; }
  .bl-empty svg{ width:34px; height:34px; color:var(--t5); margin-bottom:12px; }
</style>
</head>
<body data-page="billing" data-crumb="财务中心 > 用量计费">
<div class="shell" id="shell-mount">
  <div class="main-col">
    <main class="page">
      <div class="ph">
        <div><h1 class="t-h1">用量与计费</h1><p class="desc">按量计费,每次生成消耗点数。底层算力成本由平台统一调度,您只需关注余额、消耗与对账。充值请联系平台运营。</p></div>
      </div>

      <!-- ── 决策区:余额 + 燃尽预测 + 30天趋势 ── -->
      <div class="bl-deck">
        <div class="bl-bal">
          <div class="cap"><span class="led" id="balLed"></span>当前点数余额</div>
          <div class="big"><span id="balBig">—</span><span class="u">点</span></div>
          <div class="runway" id="runway"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="runwayTxt">按消耗速度估算可用时长…</span></div>
          <div class="rate" id="rateTxt"></div>
        </div>

        <div class="bl-trend">
          <div class="th"><span class="t">近 30 天消耗趋势</span><span class="s" id="trendSum">— 点</span></div>
          <div class="spark">
            <svg id="sparkSvg" viewBox="0 0 300 96" preserveAspectRatio="none">
              <defs>
                <linearGradient id="sparkFill" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="rgba(77,141,255,.28)"/>
                  <stop offset="100%" stop-color="rgba(77,141,255,0)"/>
                </linearGradient>
              </defs>
              <path id="sparkArea" fill="url(#sparkFill)" stroke="none"></path>
              <path id="sparkLine" class="bl-spark-path" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </div>
          <div class="axis"><span id="axL">30 天前</span><span>今天</span></div>
        </div>
      </div>

      <!-- ── 四统计卡(真实 ledger 计算)── -->
      <div class="stat-row">
        <div class="stat" style="animation-delay:.04s"><div class="lbl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m22 8-6 4 6 4V8Z"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>累计生成</div><div class="val" id="statGen">—</div><div class="sub">消耗 <b id="statGenPts">—</b> 点</div></div>
        <div class="stat" style="animation-delay:.08s"><div class="lbl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 14 3-4 3 3 4-6"/></svg>本月消耗</div><div class="val" id="statMonth">—</div><div class="sub">本自然月净扣点</div></div>
        <div class="stat" style="animation-delay:.12s"><div class="lbl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 3h12l4 6-10 12L2 9l4-6Z"/></svg>累计发放</div><div class="val" id="statGrant">—</div><div class="sub">后台 / 充值入账</div></div>
        <div class="stat" style="animation-delay:.16s"><div class="lbl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.3M21 4v4h-4"/></svg>失败释放</div><div class="val" id="statRelease">—</div><div class="sub">失败任务退还(不计费)</div></div>
      </div>

      <!-- ── 消费明细 ── -->
      <div class="sec-head" style="margin-top:30px">
        <span class="sec-title">消费明细</span>
        <div class="bl-tools">
          <div class="bl-seg" id="filterSeg">
            <button data-k="all" class="on">全部</button>
            <button data-k="spend">消耗</button>
            <button data-k="grant">入账</button>
            <button data-k="release">释放</button>
          </div>
          <div class="bl-pop-anchor"><div class="bl-pill" id="userPill" onclick="togglePop('user')"><span id="userV">消费人:全部</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></div><div class="bl-pop" id="userPop"></div></div>
          <div class="bl-pop-anchor"><div class="bl-pill" id="toolPill" onclick="togglePop('tool')"><span id="toolV">工具:全部</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></div><div class="bl-pop" id="toolPop"></div></div>
          <a href="/api/credits/ledger.csv" class="btn btn-dark bl-csv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>导出对账 CSV</a>
        </div>
      </div>
      <table class="tbl">
        <thead><tr><th>时间</th><th>类型</th><th>消费人</th><th>工具·场景</th><th>作品</th><th>说明</th><th style="text-align:right">点数</th></tr></thead>
        <tbody id="ledgerBody">
          <tr><td colspan="7" style="color:var(--t4);padding:32px;text-align:center">加载中…</td></tr>
        </tbody>
      </table>

      <!-- ── 续费 / 扩容:对公引导,非自助下单 ── -->
      <div class="bl-renew">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-6 0v4"/><rect x="2" y="9" width="20" height="11" rx="2"/><path d="M12 13v3"/></svg></div>
        <div class="tx">
          <b>需要扩容或续费?</b>
          <p id="renewHint">机构点数采用对公采购,由平台对接人开通。点数不足时,联系您的客户成功对接人或机构管理员申请扩容。</p>
        </div>
        <button class="btn btn-dark" id="renewBtn" onclick="requestTopup()">申请扩容</button>
      </div>
    </main>
  </div>
</div>

<!-- 发放点数弹窗已删除:充值收归平台超管(/admin),租户侧不再自助充值。 -->

<script src="shell.js"></script>
<script src="api.js"></script>
<script>
  // ── 类型 → 人话 ──
  const KIND_BDG = {
    grant:'<span class="bdg bdg-ok">入账</span>',
    reserve:'<span class="bdg bdg-dim">生成扣点</span>',
    settle:'<span class="bdg bdg-dim">结算</span>',
    release:'<span class="bdg" style="background:rgba(255,178,62,.14);color:var(--amber)">失败释放</span>',
  };
  // 筛选分组:消耗(reserve)、入账(grant)、释放(release);settle 多为 0 差额,并入"消耗"组
  const FILTER = { all:()=>true, spend:l=>l.kind==='reserve'||l.kind==='settle', grant:l=>l.kind==='grant', release:l=>l.kind==='release' };
  // 工具类型 → 中文场景名(与后端 ledger.csv TOOL_CN 同口径)
  const TOOL_CN = { video:'数字人视频', video_t2v:'文字转影片', video_i2v:'图片转影片', video_edit:'影片编辑', ai_image:'AI 图片', tts:'文字转语音', ai_music:'AI 音乐' };
  const toolLabel = t => t ? (TOOL_CN[t]||t) : '—';
  let LEDGER = [], curFilter = 'all', selUser = 'all', selTool = 'all', isAdmin = false;

  const esc = s => (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmtTime = ts => { const d=new Date(ts),p=n=>String(n).padStart(2,'0'); return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
  const fmtN = n => Math.round(n).toLocaleString('en-US');
  const DAY = 86400000;

  // ── 余额 + 燃尽预测 ──
  function renderDeck(bal, warn){
    document.getElementById('balBig').textContent = fmtN(bal);
    const led = document.getElementById('balLed');
    if(warn && warn.low) led.classList.add('low');

    // 近 30 天净消耗速度 → 可用天数
    const cut = Date.now() - 30*DAY;
    const spend30 = LEDGER.filter(l=>l.created_at>=cut && (l.kind==='reserve'||l.kind==='settle'))
                          .reduce((s,l)=>s + Math.min(0,l.amount), 0); // 负数
    const burnPerDay = Math.abs(spend30) / 30; // 点/天
    const rwEl = document.getElementById('runway'), rwTxt = document.getElementById('runwayTxt'), rate = document.getElementById('rateTxt');

    if(burnPerDay < 0.01){
      rwTxt.textContent = '近 30 天暂无消耗,余额充足';
      rate.textContent = '';
    } else {
      const days = Math.floor(bal / burnPerDay);
      rate.textContent = `日均消耗 ≈ ${fmtN(burnPerDay)} 点 · 基于近 30 天`;
      if(days <= 14){
        rwEl.classList.add('warn');
        rwTxt.innerHTML = `按当前速度,余额约可用 <b>${days}</b> 天,建议尽快续费`;
      } else if (days > 999){
        rwTxt.innerHTML = `按当前速度,余额可用 <b>999+</b> 天`;
      } else {
        rwTxt.innerHTML = `按当前速度,余额约可用 <b>${days}</b> 天`;
      }
    }
  }

  // ── 30 天趋势脊线(按天聚合净消耗)──
  function renderSpark(){
    const days = 30, buckets = new Array(days).fill(0);
    const today0 = (()=>{ const d=new Date(); d.setHours(0,0,0,0); return d.getTime(); })();
    LEDGER.forEach(l=>{
      if(l.kind!=='reserve' && l.kind!=='settle') return;
      const idx = days-1 - Math.floor((today0 - new Date(l.created_at).setHours(0,0,0,0))/DAY);
      if(idx>=0 && idx<days) buckets[idx] += Math.abs(Math.min(0,l.amount));
    });
    const total = buckets.reduce((a,b)=>a+b,0);
    document.getElementById('trendSum').textContent = fmtN(total) + ' 点';
    const max = Math.max(1, ...buckets);
    const W=300, H=96, pad=4;
    const pts = buckets.map((v,i)=>{
      const x = (i/(days-1))*W;
      const y = H - pad - (v/max)*(H-pad*2);
      return [x, y];
    });
    const line = pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
    document.getElementById('sparkLine').setAttribute('d', line);
    document.getElementById('sparkArea').setAttribute('d', `${line} L${W} ${H} L0 ${H} Z`);
  }

  // ── 统计卡 ──
  function renderStats(){
    const sum = k => LEDGER.filter(l=>l.kind===k).reduce((s,l)=>s+l.amount,0);
    const settleCnt = LEDGER.filter(l=>l.kind==='settle').length;
    const reserveCnt = LEDGER.filter(l=>l.kind==='reserve').length;
    const genCnt = Math.max(settleCnt, reserveCnt); // 生成任务数
    const netSpend = Math.abs(sum('reserve')) - sum('release');

    const monStart = (()=>{ const d=new Date(); return new Date(d.getFullYear(),d.getMonth(),1).getTime(); })();
    const monthSpend = LEDGER.filter(l=>l.created_at>=monStart && (l.kind==='reserve'))
                             .reduce((s,l)=>s+Math.abs(l.amount),0);

    document.getElementById('statGen').innerHTML = genCnt + ' <small>次</small>';
    document.getElementById('statGenPts').textContent = fmtN(Math.max(0,netSpend));
    document.getElementById('statMonth').innerHTML = fmtN(monthSpend) + ' <small>点</small>';
    document.getElementById('statGrant').textContent = fmtN(sum('grant'));
    document.getElementById('statRelease').innerHTML = fmtN(sum('release')) + ' <small>点</small>';
  }

  // ── 「作品」列:UUID 死信息 → 看得懂的文案摘要 + 可点预览 ──
  // 有产物(有 output_kind=有成品)→ 蓝色可点链接(点开预览浮层);
  // grant 发放 / 生成中 / 失败 / 老 job 无产物 → 纯文本(文案摘要或工具名),无文案显「—」。
  function workCell(l){
    const title = l.taskTitle || (l.toolType ? toolLabel(l.toolType) : '');
    if(l.job_id && l.outputKind && title){
      // 可点:job_id + outputKind 双备齐(成品已生成)。aria/键盘可达。
      return `<td class="strong"><a href="#" class="bl-work" role="button"
        title="${esc(title)} · 点击预览"
        onclick="openWork('${esc(l.job_id)}','${esc(l.outputKind)}',event)">${esc(title)}</a></td>`;
    }
    // 不可点:有文案显文案,无则「—」。
    return `<td class="strong">${title?esc(title):'<span style="color:var(--t4)">—</span>'}</td>`;
  }

  // 点开作品预览浮层(复用 assets.html openAsset:懒签名 → video/image/audio 浮层,点遮罩关闭)。
  window.openWork = async (id, kind, ev)=>{
    if(ev){ ev.preventDefault(); ev.stopPropagation(); }
    if(window.LJAudioPreview) LJAudioPreview.stop();
    let url;
    try{ const j = await LJ.getJob(id); url = (j.outputUrls||[])[0] || j.videoUrl; }catch(e){}
    if(!url){ window.LJToast && window.LJToast('成品已失效或暂不可用','err'); return; }
    const ov = document.createElement('div');
    ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.86);display:grid;place-items:center;z-index:999;padding:20px';
    ov.onclick=()=>{ ov.remove(); document.removeEventListener('keydown', onEsc); };
    const onEsc = e=>{ if(e.key==='Escape'){ ov.remove(); document.removeEventListener('keydown', onEsc); } };
    document.addEventListener('keydown', onEsc);
    let inner;
    if(kind==='video') inner = `<video src="${url}" controls autoplay style="max-width:90vw;max-height:85vh;border-radius:14px"></video>`;
    else if(kind==='image') inner = `<img src="${url}" style="max-width:90vw;max-height:85vh;border-radius:14px;object-fit:contain">`;
    else inner = `<div style="background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;min-width:320px" onclick="event.stopPropagation()"><audio src="${url}" controls autoplay style="width:100%;color-scheme:dark"></audio></div>`;
    ov.innerHTML = inner;
    document.body.appendChild(ov);
  };

  // ── 明细表(可筛选:类型 + 消费人 + 工具)──
  function renderTable(){
    const body = document.getElementById('ledgerBody');
    const rows = LEDGER.filter(FILTER[curFilter])
      .filter(l => selUser==='all' || (l.userName||'—')===selUser)
      .filter(l => selTool==='all' || (l.toolType||'')===selTool);
    if(!rows.length){
      const filtered = curFilter!=='all' || selUser!=='all' || selTool!=='all';
      body.innerHTML = `<tr><td colspan="7"><div class="bl-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M8 4v16"/></svg>
        <div>${filtered?'当前筛选下暂无记录':'暂无消费记录,发起第一次生成后这里会出现明细'}</div></div></td></tr>`;
      return;
    }
    body.innerHTML = rows.map(l=>{
      const pos = l.amount>=0;
      return `<tr>
        <td class="num">${fmtTime(l.created_at)}</td>
        <td>${KIND_BDG[l.kind]||esc(l.kind)}</td>
        <td>${l.userName?esc(l.userName):'<span style="color:var(--t4)">—</span>'}</td>
        <td>${l.toolType?esc(toolLabel(l.toolType)):'<span style="color:var(--t4)">—</span>'}</td>
        ${workCell(l)}
        <td style="color:var(--t3)">${esc(l.note||'')}</td>
        <td class="bl-amt ${pos?'pos':'neg'}">${pos?'+':''}${fmtN(l.amount)}</td>
      </tr>`;
    }).join('');
  }

  // ── 消费人 / 工具 下拉(document 外部点击关闭,复用 tts/assets 修复;不用遮罩)──
  let popHandler = null;
  function buildPops(){
    const users = [...new Set(LEDGER.map(l=>l.userName).filter(Boolean))];
    const tools = [...new Set(LEDGER.map(l=>l.toolType).filter(Boolean))];
    const opt = (v,label,sel)=>`<div class="opt${v===sel?' on':''}" data-v="${esc(v)}"><span>${esc(label)}</span><svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg></div>`;
    const uPop=document.getElementById('userPop'); uPop.innerHTML=[opt('all','全部',selUser)].concat(users.map(u=>opt(u,u,selUser))).join('');
    uPop.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{ selUser=el.dataset.v; document.getElementById('userV').textContent='消费人:'+(selUser==='all'?'全部':selUser); closePops(); buildPops(); renderTable(); });
    const tPop=document.getElementById('toolPop'); tPop.innerHTML=[opt('all','全部',selTool)].concat(tools.map(t=>opt(t,toolLabel(t),selTool))).join('');
    tPop.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{ selTool=el.dataset.v; document.getElementById('toolV').textContent='工具:'+(selTool==='all'?'全部':toolLabel(selTool)); closePops(); buildPops(); renderTable(); });
  }
  window.togglePop=(which)=>{
    const pop=document.getElementById(which+'Pop'), pill=document.getElementById(which+'Pill');
    if(pop.classList.contains('show')){ closePops(); return; }
    closePops(); pop.classList.add('show'); pill.classList.add('open');
    setTimeout(()=>{ popHandler=(e)=>{ if(!e.target.closest('.bl-pop')&&!e.target.closest('.bl-pill')) closePops(); }; document.addEventListener('mousedown', popHandler, true); },0);
  };
  function closePops(){ document.querySelectorAll('.bl-pop.show').forEach(p=>p.classList.remove('show')); document.querySelectorAll('.bl-pill.open').forEach(p=>p.classList.remove('open')); if(popHandler){ document.removeEventListener('mousedown', popHandler, true); popHandler=null; } }

  // ── 发放点数弹窗 ──
  // 租户自助充值已删除:充值收归平台超管(/admin)。billing 仅展示余额/消费/对账。

  function requestTopup(){
    window.LJToast('已记录扩容意向,平台对接人将与机构管理员联系');
  }

  // ── 筛选切换 ──
  document.querySelectorAll('#filterSeg button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#filterSeg button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); curFilter=b.dataset.k; renderTable();
  });

  async function load(){
    try{
      const me = await LJ.me();
      isAdmin = me.role==='admin';
      if(!isAdmin){
        const r=document.getElementById('renewBtn'); if(r) r.style.display='none';
        document.getElementById('renewHint').textContent='点数不足时,请联系您的机构管理员申请扩容。';
      }
      const [bal, warn, led] = await Promise.all([
        LJ.get('/credits/balance'),
        LJ.get('/credits/warning').catch(()=>null),
        LJ.get('/credits/ledger').catch(()=>[]),
      ]);
      LEDGER = Array.isArray(led) ? led : [];
      renderDeck(bal.balance ?? 0, warn);
      renderSpark();
      renderStats();
      buildPops();
      renderTable();
    }catch(e){ /* 401 已由 api.js 跳转 */ }
  }
  load();
</script>
</body>
</html>

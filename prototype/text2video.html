<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文字转影片 · 灵镜</title>
<link rel="icon" type="image/svg+xml" href="/brand/lingjing-favicon.svg">
<link rel="stylesheet" href="app.css">
<style>
  /* 记录卡(复用 AI 图片样式:元信息 chips + 动作 + 长词收展)*/
  .card-meta { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 2px; }
  .card-meta .chip { font-size:11px; color:var(--t3); background:var(--field); border:1px solid var(--line); border-radius:7px; padding:2px 8px; }
  .card-acts { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .card-acts button { display:inline-flex; align-items:center; gap:5px; font-size:12.5px; color:var(--t2); background:var(--field); border:1px solid var(--line); border-radius:9px; padding:7px 13px; cursor:pointer; transition:.15s; }
  .card-acts button:hover { border-color:var(--line-hi); color:var(--t1); }
  .card-acts button svg { width:14px; height:14px; }
  .tx.clamp { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .tx-toggle { font-size:12px; color:var(--blue); cursor:pointer; margin-top:4px; display:inline-block; }
  /* 成品视频 */
  .fvid { width:100%; border-radius:12px; display:block; background:#000; }

  /* 段选(解析度 / mode / 时长)+ 比例 —— 复用 AI 图片 seg/ratio 样式 */
  .seg-row { display:flex; gap:8px; }
  .seg-row .seg { flex:1; display:flex; align-items:center; justify-content:center; text-align:center; min-height:42px; padding:10px; border-radius:10px; background:var(--field); border:1px solid var(--line); color:var(--t3); font-size:13px; cursor:pointer; transition:.15s; }
  .seg-row .seg:hover { color:var(--t1); }
  .seg-row .seg.on { background:var(--card-hi); color:var(--t1); border-color:var(--line-hi); }
  .ratio-row { display:flex; gap:5px; flex-wrap:wrap; align-items:stretch; }
  .ratio-cell { flex:1; min-width:54px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:4px; padding:8px 2px; border:1px solid var(--line); border-radius:9px; background:var(--field); color:var(--t3); cursor:pointer; transition:.15s; }
  .ratio-cell:hover { color:var(--t1); border-color:var(--line-hi); }
  .ratio-cell.on { background:var(--card-hi); color:var(--t1); border-color:var(--line-hi); }
  .ratio-cell .glyph { width:18px; height:18px; border:1.6px solid currentColor; border-radius:3px; }
  .ratio-cell .lbl { font-size:10.5px; font-family:var(--f-mono); }
  .cfg-label { font-size:12px; color:var(--t3); margin:14px 0 7px; }
  /* 模型特有开关(audio / 反向提示词 / 智能改写)固定在参数区底部,切模型只增减这里 */
  .opt-toggle { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 13px; border:1px solid var(--line); border-radius:10px; background:var(--field); margin-top:8px; }
  .opt-toggle .ol { font-size:13px; color:var(--t2); }
  .opt-toggle input[type=checkbox] { width:auto; }
  .neg-input { width:100%; padding:9px 11px; background:var(--field); border:1px solid var(--line); border-radius:9px; color:var(--t1); font-size:13px; margin-top:8px; }
</style>
</head>
<body data-page="text2video" data-crumb="创作工具 > 文字转影片">
<div class="shell" id="shell-mount">
 <div class="main-col">
  <div class="studio">
  <!-- 左:配置 -->
  <div class="cfg">
    <div class="cfg-h"><span class="dot"></span>文字转影片 AI</div>

    <!-- 提示词 -->
    <div class="cfg-label">提示</div>
    <div class="script">
      <textarea id="prompt" maxlength="5000" placeholder="请描述影片内容。大师模型支援音讯生成,您可以在提示中加入音效或对白。"></textarea>
      <div class="f"><span class="h" id="estLabel">预估 — 点</span><span class="c"><b id="cnt">0</b> / <span id="maxChars">5000</span></span></div>
    </div>

    <div class="cfg-sp"></div>

    <!-- 紧凑配置栏:模型 pill + 设置 pill(解析度/比例/时长/模型特有 收进 popover)+ seed(贴 AI 图片 DeeVid 参考)-->
    <div class="cfgbar">
      <div class="pop-anchor" style="flex:1">
        <div class="cpill" id="modelPill" onclick="togglePop('model')"><span class="v" id="modelPillV">模型</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></div>
        <div class="pop" id="pop-model"><div class="pop-label">模型</div><div id="modelOpts"></div></div>
      </div>
      <div class="pop-anchor" style="flex:1.2">
        <div class="cpill" id="setPill" onclick="togglePop('set')"><span class="v" id="setPillV">720P · 5秒 · 16:9</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></div>
        <div class="pop" id="pop-set">
          <div class="pop-label" id="resLabel">解析度</div>
          <div class="seg-row" id="resSeg"></div>
          <div class="pop-label">比例</div>
          <div class="ratio-row" id="ratioRow"></div>
          <div class="pop-label">长度</div>
          <div class="seg-row" id="durSeg"></div>
          <!-- 模型特有控件(显隐于 popover 底部,切模型上方不跳)-->
          <div id="modelOpts2"></div>
        </div>
      </div>
      <div class="pop-anchor">
        <div class="cpill fixed" id="seedPill" onclick="togglePop('seed')" title="随机种子 Seed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
        <div class="pop" id="pop-seed" style="left:auto;right:0;width:200px">
          <div class="pop-label">Seed(随机种子)</div>
          <input id="seedInput" type="text" inputmode="numeric" placeholder="随机" style="width:100%;padding:9px 11px;background:var(--field);border:1px solid var(--line);border-radius:9px;color:var(--t1);font-size:13px;font-family:var(--f-mono)">
        </div>
      </div>
    </div>
    <div class="pop-ov" id="popOv" onclick="closePops()"></div>

    <div class="cbtn-wrap">
      <button class="cbtn" id="createBtn">
        <span id="cbtnLabel">创建</span> <span class="gem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M6 3h12l4 6-10 12L2 9l4-6Z"/></svg> <b id="estGem">—</b></span>
      </button>
    </div>
  </div>

  <!-- 右:生成记录 -->
  <div class="feed">
    <div class="feed-tabs">
      <button class="ftab active" data-st="all">全部</button>
      <button class="ftab" data-st="running">生成中</button>
      <button class="ftab" data-st="done">已完成</button>
      <button class="ftab" data-st="failed">失败</button>
    </div>
    <div class="feed-list">
      <div class="fitem" id="emptyHint" style="animation-delay:.02s">
        <div class="fmeta">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m12 3 2.4 5.6L20 9l-4.3 3.8L17 18l-5-2.7L7 18l1.3-5.2L4 9l5.6-.4Z"/></svg>
          <b>暂无记录</b><span class="ts">输入描述,生成你的第一条影片</span>
        </div>
      </div>
    </div>
  </div>
 </div>
</div>

<script src="shell.js"></script>
<script src="tools.js"></script>
<script src="api.js"></script>
<script>
  const ta=document.getElementById('prompt'), cnt=document.getElementById('cnt'), btn=document.getElementById('createBtn');
  const feedList=document.querySelector('.feed-list');
  let model='', allModels=[], ratio='16:9', resolution='720P', klingMode='std', duration=5, audio=false, negativePrompt='', promptExtend=true, seed='';

  function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function curModel(){ return allModels.find(m=>m.key===model); }
  const RATIO_GLYPH={'16:9':[20,11],'9:16':[11,20],'1:1':[18,18],'3:4':[14,18],'4:3':[18,14],'4:5':[14,18],'5:4':[18,14],'9:21':[9,20],'21:9':[20,9]};

  // ── 模型下拉(GET /video-models,自绘深色 popover,贴 ai-image togglePop)──
  const modelOpts=document.getElementById('modelOpts');
  async function loadModels(){
    try{ const r=await LJ.get('/video-models'); allModels=r.models||[]; if(r.default) model=r.default; renderModels(); }
    catch(e){ modelOpts.innerHTML='<div class="pop-opt"><span class="nm">模型加载失败</span></div>'; }
  }
  function renderModels(){
    if(allModels.length && !curModel()) model=allModels[0].key;
    modelOpts.innerHTML=allModels.map(m=>`<div class="pop-opt${m.key===model?' on':''}" data-k="${m.key}">
      <span class="nm">${esc(m.label)}</span>
      <svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg></div>`).join('')
      || '<div class="pop-opt"><span class="nm">暂无可用模型</span></div>';
    modelOpts.querySelectorAll('.pop-opt[data-k]').forEach(el=>el.onclick=()=>{ model=el.dataset.k; onModelChange(); closePops(); });
    onModelChange();
  }
  // 切模型:重渲解析度(可灵显 std/pro)、比例、时长、模型特有控件 + 字数上限 + pill
  function onModelChange(){
    const m=curModel(); if(!m) return;
    document.getElementById('maxChars').textContent=m.maxPromptChars;
    ta.maxLength=m.maxPromptChars;
    renderRes(); renderRatios(); renderDur(); renderModelOpts(); syncPills(); scheduleEstimate(); refreshBtn();
  }
  // 解析度:V_DASH 显 720P/1080P;V_KLING 显 std/pro(代替,design D4)
  function renderRes(){
    const m=curModel(); const seg=document.getElementById('resSeg'); const lbl=document.getElementById('resLabel');
    if(m.shape==='V_KLING'){
      lbl.textContent='模式';
      const opts=[['std','标准 std'],['pro','高清 pro']];
      if(klingMode!=='std'&&klingMode!=='pro') klingMode='std';
      seg.innerHTML=opts.map(([v,t])=>`<div class="seg${v===klingMode?' on':''}" data-v="${v}">${t}</div>`).join('');
      seg.querySelectorAll('.seg').forEach(s=>s.onclick=()=>{ seg.querySelectorAll('.seg').forEach(x=>x.classList.remove('on')); s.classList.add('on'); klingMode=s.dataset.v; syncPills(); scheduleEstimate(); });
    } else {
      lbl.textContent='解析度';
      const opts=m.resolutions; if(!opts.includes(resolution)) resolution=opts[0];
      seg.innerHTML=opts.map(r=>`<div class="seg${r===resolution?' on':''}" data-v="${r}">${r}</div>`).join('');
      seg.querySelectorAll('.seg').forEach(s=>s.onclick=()=>{ seg.querySelectorAll('.seg').forEach(x=>x.classList.remove('on')); s.classList.add('on'); resolution=s.dataset.v; syncPills(); scheduleEstimate(); });
    }
  }
  // 比例
  function renderRatios(){
    const m=curModel(); const row=document.getElementById('ratioRow');
    if(!m.ratios.includes(ratio)) ratio=m.ratios[0];
    row.innerHTML=m.ratios.map(r=>{ const g=RATIO_GLYPH[r]||[18,18];
      return `<div class="ratio-cell${r===ratio?' on':''}" data-ratio="${r}"><span class="glyph" style="width:${g[0]}px;height:${g[1]}px"></span><span class="lbl">${r}</span></div>`; }).join('');
    row.querySelectorAll('.ratio-cell').forEach(c=>c.onclick=()=>{ row.querySelectorAll('.ratio-cell').forEach(x=>x.classList.remove('on')); c.classList.add('on'); ratio=c.dataset.ratio; syncPills(); scheduleEstimate(); });
  }
  // 时长:模型 durationRange 内,给几个常用档(min/5/10/max 去重)
  function renderDur(){
    const m=curModel(); const seg=document.getElementById('durSeg'); const [lo,hi]=m.durationRange;
    const opts=[...new Set([lo,5,10,hi].filter(d=>d>=lo&&d<=hi))].sort((a,b)=>a-b);
    if(!opts.includes(duration)) duration=m.defaultDuration;
    seg.innerHTML=opts.map(d=>`<div class="seg${d===duration?' on':''}" data-d="${d}">${d}秒</div>`).join('');
    seg.querySelectorAll('.seg').forEach(s=>s.onclick=()=>{ seg.querySelectorAll('.seg').forEach(x=>x.classList.remove('on')); s.classList.add('on'); duration=parseInt(s.dataset.d,10); syncPills(); scheduleEstimate(); });
  }
  // 模型特有控件(audio 仅可灵;反向提示词/智能改写仅 wan2.7)。显隐于参数区底部。
  function renderModelOpts(){
    const m=curModel(); const box=document.getElementById('modelOpts2'); let h='';
    if(m.supportsAudio) h+=`<div class="opt-toggle"><span class="ol">有声视频(自动配音 / 音效)</span><input type="checkbox" id="audioChk"${audio?' checked':''}></div>`;
    if(m.supportsPromptExtend) h+=`<div class="opt-toggle"><span class="ol">智能改写提示词</span><input type="checkbox" id="extendChk"${promptExtend?' checked':''}></div>`;
    if(m.supportsNegative) h+=`<input class="neg-input" id="negInput" placeholder="反向提示词(不希望出现的元素,可选)" value="${esc(negativePrompt)}">`;
    box.innerHTML=h;
    const a=document.getElementById('audioChk'); if(a) a.onchange=()=>{ audio=a.checked; syncPills(); scheduleEstimate(); };
    const e=document.getElementById('extendChk'); if(e) e.onchange=()=>{ promptExtend=e.checked; };
    const n=document.getElementById('negInput'); if(n) n.oninput=()=>{ negativePrompt=n.value; };
  }
  function syncPills(){
    const m=curModel();
    document.getElementById('modelPillV').textContent=m?m.label:'模型';
    const resPart = m && m.shape==='V_KLING' ? (klingMode==='pro'?'高清':'标准') : resolution;
    const audioPart = (m && m.supportsAudio && audio) ? ' · 有声' : '';
    document.getElementById('setPillV').textContent=`${resPart} · ${duration}秒 · ${ratio}${audioPart}`;
  }

  // ── popover 开关(贴 ai-image)──
  function togglePop(which){
    const map={model:'pop-model',set:'pop-set',seed:'pop-seed'}; const pillMap={model:'modelPill',set:'setPill',seed:'seedPill'};
    const el=document.getElementById(map[which]); const isOpen=el.classList.contains('show'); closePops();
    if(!isOpen){ el.classList.add('show'); document.getElementById('popOv').classList.add('show'); document.getElementById(pillMap[which]).classList.add('open'); }
  }
  function closePops(){ document.querySelectorAll('.pop.show').forEach(p=>p.classList.remove('show')); document.querySelectorAll('.cpill.open').forEach(p=>p.classList.remove('open')); document.getElementById('popOv').classList.remove('show'); }
  window.togglePop=togglePop; window.closePops=closePops;
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closePops(); });
  document.getElementById('seedInput').addEventListener('input',e=>{ seed=e.target.value.replace(/[^0-9]/g,''); e.target.value=seed; });

  // 提交体(build 与 estimate 同参,reserve==settle)
  function jobBody(){
    const m=curModel(); const b={ type:'video_t2v', model, prompt:ta.value.trim(), ratio, duration };
    if(seed) b.seed=parseInt(seed,10);
    if(m.shape==='V_KLING'){ b.mode=klingMode; if(m.supportsAudio) b.audio=audio; }
    else { b.resolution=resolution; if(m.supportsNegative&&negativePrompt.trim()) b.negativePrompt=negativePrompt; if(m.supportsPromptExtend) b.promptExtend=promptExtend; }
    return b;
  }

  let estTimer=null;
  function scheduleEstimate(){
    clearTimeout(estTimer);
    estTimer=setTimeout(async()=>{
      if(!ta.value.trim()){ document.getElementById('estLabel').textContent='预估 — 点'; document.getElementById('estGem').textContent='—'; return; }
      try{ const r=await LJ.post('/jobs/estimate',jobBody());
        document.getElementById('estLabel').textContent='预估 '+r.cost+' 点';
        document.getElementById('estGem').textContent=r.cost;
      }catch(e){}
    },350);
  }
  function refreshBtn(){
    const ok=ta.value.trim().length>0;
    btn.classList.toggle('ready',ok); btn.disabled=!ok;
    document.getElementById('cbtnLabel').textContent=ok?'创建':'请输入描述';
  }
  ta.addEventListener('input',()=>{ cnt.textContent=ta.value.length; refreshBtn(); scheduleEstimate(); });

  document.querySelectorAll('.ftab').forEach(t=>t.onclick=function(){
    this.parentNode.querySelectorAll('.ftab').forEach(x=>x.classList.remove('active')); this.classList.add('active');
    const k=this.dataset.st;
    document.querySelectorAll('.feed-list .fitem[id^=job-]').forEach(it=>{ it.style.display=(k==='all'||(it.dataset.st||'')===k)?'':'none'; });
  });

  const jobInputs={};
  function findLabel(k){ const m=allModels.find(x=>x.key===k); return m?m.label:undefined; }

  function promptBubble(p){
    const t=esc(p||''); const long=(p||'').length>80;
    return `<div class="fbubble"><div class="tx${long?' clamp':''}">${t}</div>${long?'<span class="tx-toggle" onclick="this.previousElementSibling.classList.toggle(\'clamp\');this.textContent=this.previousElementSibling.classList.contains(\'clamp\')?\'展开\':\'收起\'">展开</span>':''}</div>`;
  }
  function metaChips(job){
    const c=[]; if(job.modelLabel) c.push(job.modelLabel);
    if(job.sizeLabel) c.push(job.sizeLabel); if(job.duration) c.push(job.duration+'秒'); if(job.ratio) c.push(job.ratio);
    return c.length?`<div class="card-meta">${c.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>`:'';
  }
  function cardActs(job,ok){
    const re=`<button data-act="regen" onclick="regenJob('${job.id}',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>重新生成</button>`;
    const rp=`<button onclick="repromptJob('${job.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19 7-7 3 3-7 7-3-3z"/><path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="m2 2 7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>重新提示</button>`;
    const dl=ok&&(job.outputUrls||[]).length?`<button onclick="downloadVid('${job.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14"/></svg>下载</button>`:'';
    const del=`<button onclick="delJob('${job.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>删除</button>`;
    return `<div class="card-acts">${re}${rp}${dl}${del}</div>`;
  }

  function renderCard(job){
    document.getElementById('emptyHint').style.display='none';
    if(job.input) jobInputs[job.id]=job.input;
    let card=document.getElementById('job-'+job.id); const existed=!!card;
    if(!card){ card=document.createElement('div'); card.className='fitem'; card.id='job-'+job.id; feedList.insertBefore(card, feedList.firstChild); }
    const head=(color,led,txt)=>`<div class="fmeta"><b>文字转影片</b><span class="ts">刚刚</span><span class="sp"></span><span class="st" style="color:${color}"><span class="led ${led}"></span>${txt}</span></div>`;
    // 生成中:卡已在 + 仍 running → 只更进度(不重建,防闪)
    if((job.status==='queued'||job.status==='running') && existed && card.dataset.st==='running'){
      const lbl=card.querySelector('.proc-in .lbl'); const bar=card.querySelector('.proc-bar i');
      if(lbl) lbl.textContent=job.progress?('进度 '+job.progress+'%'):'已进入生成队列';
      if(bar) bar.style.width=(job.progress||8)+'%';
      return;
    }
    if(job.status==='queued'||job.status==='running'){
      card.dataset.st='running';
      card.innerHTML=head('var(--amber)','led-run',job.status==='queued'?'排队中':'生成中')+promptBubble(job.prompt)+metaChips(job)+
        `<div class="fvideo proc"><div class="proc-in"><div class="spinner"></div><div class="lbl">${job.progress?('进度 '+job.progress+'%'):'已进入生成队列'}</div><div class="proc-bar"><i style="width:${job.progress||8}%"></i></div><div style="font-size:11px;color:var(--t4);margin-top:8px">视频生成约需 1-5 分钟,请耐心等待</div></div></div>`;
    } else if(job.status==='done'){
      card.dataset.st='done';
      const u=(job.outputUrls||[])[0];
      const vid=u?`<video class="fvid" src="${u}" controls preload="metadata"></video>`:'<div style="color:var(--t4);padding:20px">已生成</div>';
      card.innerHTML=head('var(--green)','led-ok','已完成')+promptBubble(job.prompt)+metaChips(job)+vid+cardActs(job,true);
    } else {
      card.dataset.st='failed';
      card.innerHTML=head('var(--red)','led-err','生成失败')+promptBubble(job.prompt)+metaChips(job)+
        `<div class="fvideo err"><div class="err-in"><div class="ei">!</div><div class="lbl">${esc(job.error||'生成失败,请重试')}</div></div></div>`+cardActs(job,false);
    }
  }

  // 重新生成(同 input 再提交)。防重复点击:in-flight 锁 + 按钮置灰。
  const regenInFlight=new Set();
  window.regenJob=async(id,b)=>{
    if(regenInFlight.has(id)) return;
    const inp=jobInputs[id]; if(!inp){ window.LJToast&&window.LJToast('原参数丢失,无法重新生成','err'); return; }
    regenInFlight.add(id);
    if(b){ b.disabled=true; b.dataset.t=b.textContent; b.textContent='提交中…'; }
    try{
      const body={ type:'video_t2v', model:inp.model, prompt:inp.prompt, ratio:inp.ratio, duration:inp.duration };
      if(inp.mode){ body.mode=inp.mode; if(inp.audio) body.audio=true; } else { body.resolution=inp.resolution; if(inp.negativePrompt) body.negativePrompt=inp.negativePrompt; if(typeof inp.promptExtend==='boolean') body.promptExtend=inp.promptExtend; }
      if(typeof inp.seed==='number') body.seed=inp.seed;
      const r=await LJ.createJob(body);
      renderCard({ id:r.id, status:'queued', progress:0, prompt:inp.prompt, modelLabel:findLabel(inp.model), ratio:inp.ratio, duration:inp.duration, sizeLabel:inp.resSnapshot||inp.resolution });
      track(r.id, inp.prompt);
      window.LJToast&&window.LJToast('✓ 已重新提交生成');
    }catch(e){ window.LJToast&&window.LJToast('重新生成失败:'+e.message,'err'); }
    finally{ regenInFlight.delete(id); if(b){ b.disabled=false; if(b.dataset.t){ b.textContent=b.dataset.t; delete b.dataset.t; } } }
  };
  // 重新提示:回填提示词 + 参数到左侧输入区,不自动提交
  window.repromptJob=(id)=>{
    const inp=jobInputs[id]; if(!inp){ window.LJToast&&window.LJToast('原参数丢失','err'); return; }
    if(inp.model && allModels.find(m=>m.key===inp.model)) model=inp.model;
    if(inp.ratio) ratio=inp.ratio;
    if(typeof inp.duration==='number') duration=inp.duration;
    if(inp.mode){ klingMode=inp.mode; audio=!!inp.audio; } else { if(inp.resolution) resolution=inp.resolution; if(typeof inp.promptExtend==='boolean') promptExtend=inp.promptExtend; negativePrompt=inp.negativePrompt||''; }
    seed = inp.seed!=null ? String(inp.seed) : '';
    const si=document.getElementById('seedInput'); if(si) si.value=seed;
    onModelChange();
    ta.value=inp.prompt||''; cnt.textContent=ta.value.length;
    refreshBtn(); scheduleEstimate(); ta.focus();
    window.LJToast&&window.LJToast('✓ 已回填提示词与参数,可改后创建');
  };
  window.delJob=async(id)=>{
    if(!(await window.LJConfirm({title:'删除作品',body:'确认删除这条生成记录吗?删除后不可恢复。',confirmText:'删除',danger:true}))) return;
    try{ await LJ.del('/jobs/'+id); const c=document.getElementById('job-'+id); if(c) c.remove(); delete jobInputs[id]; window.LJToast&&window.LJToast('✓ 已删除'); }
    catch(e){ window.LJToast&&window.LJToast('删除失败:'+(e.message||'生成中不可删'),'err'); }
  };
  window.downloadVid=async(id)=>{
    const card=document.getElementById('job-'+id); const v=card?card.querySelector('video'):null; if(!v) return;
    try{ const r=await fetch(v.src); const bl=await r.blob(); const u=URL.createObjectURL(bl); const a=document.createElement('a'); a.href=u; a.download=`lingjing-${id}.mp4`; a.click(); URL.revokeObjectURL(u); }
    catch(e){ window.open(v.src,'_blank'); }
  };

  async function track(id, prompt){ try{ await LJ.pollJob(id, (job)=>renderCard({...job, prompt, ...(jobInputs[id]?{modelLabel:findLabel(jobInputs[id].model),ratio:jobInputs[id].ratio,duration:jobInputs[id].duration}:{})})); }catch(e){} }

  async function loadHistory(){
    let jobs=[]; try{ jobs=await LJ.listJobs(); }catch(e){ return; }
    const mine=jobs.filter(j=>j.type==='video_t2v');
    if(!mine.length) return;
    document.getElementById('emptyHint').style.display='none';
    for(const j of [...mine].sort((a,b)=>(a.createdAt||0)-(b.createdAt||0))){
      jobInputs[j.id]={ model:j.model, prompt:j.script, ratio:j.ratio, resolution:j.resolution, duration:j.duration, mode:j.mode, audio:j.audio, negativePrompt:j.negativePrompt, promptExtend:j.promptExtend, seed:j.seed, resSnapshot:j.sizeLabel };
      renderCard({...j, prompt:j.script});
      if(j.status==='queued'||j.status==='running') track(j.id, j.script);
    }
  }

  btn.addEventListener('click', async ()=>{
    if(btn.disabled) return;
    const prompt=ta.value.trim(); if(!prompt) return;
    btn.disabled=true; const prev=btn.innerHTML; btn.textContent='提交中…';
    try{
      const body=jobBody();
      const r=await LJ.createJob(body);
      jobInputs[r.id]={ model:body.model, prompt, ratio:body.ratio, resolution:body.resolution, duration:body.duration, mode:body.mode, audio:body.audio, negativePrompt:body.negativePrompt, promptExtend:body.promptExtend, seed:body.seed };
      const m=curModel();
      const sizeLabel = m.shape==='V_KLING' ? (klingMode==='pro'?'1080P':'720P') : resolution;
      renderCard({ id:r.id, status:'queued', progress:0, prompt, modelLabel:findLabel(model), ratio, duration, sizeLabel });
      track(r.id, prompt);
      ta.value=''; cnt.textContent='0';
      scheduleEstimate();
      window.LJToast&&window.LJToast('✓ 已提交生成,可在右侧查看进度');
    }catch(e){ window.LJToast&&window.LJToast('提交失败:'+e.message,'err'); }
    finally{ btn.innerHTML=prev; refreshBtn(); }
  });

  LJ.me().then(()=>{ loadModels(); loadHistory(); }).catch(()=>{});
  refreshBtn();
</script>
</body>
</html>

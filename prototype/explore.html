<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>探索 · 灵镜</title>
<link rel="icon" type="image/svg+xml" href="/brand/lingjing-favicon.svg">
<link rel="stylesheet" href="app.css">
<style>
  .explore{ display:flex; flex-direction:column; gap:40px; padding:26px 32px 56px; position:relative; z-index:1;
    animation:rise .5s var(--ease-out) both; }
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* ===== 1. HERO ===== */
  .ex-hero{ display:grid; grid-template-columns:1.5fr .9fr; gap:22px; align-items:stretch; }
  @media(max-width:880px){ .ex-hero{ grid-template-columns:1fr } }
  .hero-main{ border-radius:var(--r-lg); border:1px solid var(--line); padding:34px 36px;
    background: radial-gradient(130% 140% at 0% 0%, rgba(77,141,255,.13) 0%, transparent 52%), var(--card);
    box-shadow:var(--sh-card); display:flex; flex-direction:column; justify-content:center; }
  .hero-main .hi{ font-family:var(--f-en); font-size:12px; color:var(--t3); letter-spacing:.22em; text-transform:uppercase }
  .hero-main h1{ font-size:32px; font-weight:800; letter-spacing:-.035em; line-height:1.14; margin:13px 0 11px }
  .hero-main p{ color:var(--t2); font-size:14.5px; max-width:48ch; line-height:1.7 }
  .hero-main .cta{ margin-top:24px; display:flex; gap:11px; flex-wrap:wrap }
  .hero-main .go{ display:inline-flex; align-items:center; gap:8px; background:var(--t1); color:#0A0A0B;
    border:none; border-radius:var(--r-pill); padding:13px 22px; font-size:14px; font-weight:700; font-family:var(--f);
    cursor:pointer; box-shadow:var(--sh-white-btn); transition:transform .12s var(--ease); text-decoration:none }
  .hero-main .go:hover{ transform:translateY(-1px) }
  .hero-main .go svg{ width:17px; height:17px }
  .hero-main .ghost{ display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line);
    border-radius:var(--r-pill); padding:13px 20px; font-size:14px; color:var(--t2); transition:.18s; text-decoration:none }
  .hero-main .ghost:hover{ border-color:var(--line-hi); color:var(--t1) }
  .hero-main .ghost svg{ width:16px; height:16px }

  .hero-side{ border-radius:var(--r-lg); border:1px solid var(--line); padding:24px 26px; background:var(--card);
    box-shadow:var(--sh-card); display:flex; flex-direction:column; gap:16px }
  .hero-side .lbl{ display:flex; align-items:center; gap:8px; color:var(--t3); font-size:12.5px }
  .hero-side .lbl svg{ width:15px; height:15px; color:var(--amber) }
  .hero-side .bal{ font-family:var(--f-mono); font-size:38px; font-weight:700; letter-spacing:-1px; line-height:1; margin:8px 0 2px }
  .hero-side .bal.low{ color:var(--amber) }
  .hero-side .meta{ color:var(--t4); font-size:11.5px; font-family:var(--f-mono) }
  .hero-side .warn{ color:var(--amber); font-size:12px; margin-top:5px; display:none }
  .hero-side .mini{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; border-top:1px solid var(--line-soft); padding-top:16px; margin-top:auto }
  .hero-side .mini a{ text-decoration:none; color:inherit }
  .hero-side .mini .mv{ font-family:var(--f-mono); font-size:20px; font-weight:700; color:var(--t1) }
  .hero-side .mini .mn{ color:var(--t3); font-size:11px; margin-top:2px }

  /* ===== 通用区块标题 ===== */
  .ex-sec-h{ display:flex; align-items:baseline; gap:10px; margin-bottom:14px }
  .ex-sec-h h3{ font-size:16px; font-weight:700; color:var(--t1) }
  .ex-sec-h .c{ font-family:var(--f-mono); font-size:11px; color:var(--t4) }
  .ex-sec-h .more{ margin-left:auto; color:var(--t3); font-size:12.5px; text-decoration:none; transition:.18s }
  .ex-sec-h .more:hover{ color:var(--t1) }

  /* ===== 2. 灵感库 ===== */
  .sc-filter{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px }
  .sc-chip{ font-size:12.5px; color:var(--t3); background:var(--card); border:1px solid var(--line-soft);
    border-radius:var(--r-pill); padding:6px 13px; cursor:pointer; transition:.16s; font-family:var(--f); white-space:nowrap }
  .sc-chip:hover{ border-color:var(--line-hi); color:var(--t1) }
  .sc-chip.on{ background:var(--t1); color:#0A0A0B; border-color:var(--t1); font-weight:600 }
  .sc-chip:focus-visible{ outline:2px solid var(--blue); outline-offset:2px }
  .demo .tag.prompt-tag{ background:rgba(77,141,255,.28); color:#cfe0ff }
  /* 模态徽章(右上角):影片/编辑/数字人;图片无 */
  .demo .mod-badge{ position:absolute; top:12px; right:12px; font-family:var(--f-mono); font-size:9.5px; font-weight:700;
    padding:4px 8px; border-radius:7px; background:rgba(8,8,10,.62); backdrop-filter:blur(10px); color:#fff; letter-spacing:.02em }
  /* (编辑前后对比 .cmp 样式见下方 .player 区块,避免重复) */
  /* 瀑布流(masonry 错落墙):CSS columns 铺满宽度,卡片高度随各自模态比例参差 → 大气丰盛 */
  .showcase{ columns:4; column-gap:16px; padding:6px 2px 12px; }
  @media(max-width:1280px){ .showcase{ columns:3 } }
  @media(max-width:880px){ .showcase{ columns:2 } }
  @media(max-width:560px){ .showcase{ columns:1 } }
  .showcase:focus-visible{ outline:2px solid var(--blue); outline-offset:4px; border-radius:14px }
  .demo{ width:100%; break-inside:avoid; margin:0 0 16px; border-radius:18px; overflow:hidden; position:relative;
    border:1px solid var(--line-soft); box-shadow:var(--sh-card); cursor:pointer; transition:transform .4s var(--ease-out), border-color .3s }
  /* 卡片高度按模态参差(错落感):影片宽、图片/数字人竖、编辑近方 */
  .demo{ aspect-ratio:3/4 } /* 默认竖图 */
  .demo.m-video{ aspect-ratio:16/10 }
  .demo.m-video-edit{ aspect-ratio:9/16 }
  .demo.m-image-edit{ aspect-ratio:1/1 }
  .demo.m-avatar{ aspect-ratio:3/4 }
  .demo:hover{ transform:translateY(-6px); border-color:var(--line-hi) }
  .demo:focus-visible{ outline:2px solid var(--blue); outline-offset:2px }
  .demo .img{ position:absolute; inset:0; background-size:cover; background-position:center top; transition:transform 1.1s var(--ease-out) }
  .demo:hover .img{ transform:scale(1.06) }
  .demo .veil{ position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.25),transparent 30%,transparent 50%,rgba(0,0,0,.86)) }
  .demo .play{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(.9); width:50px; height:50px; border-radius:50%;
    background:rgba(255,255,255,.94); display:grid; place-items:center; opacity:0; transition:opacity .28s, transform .28s var(--ease-out);
    border:none; cursor:pointer; padding:0 }
  .demo:hover .play, .demo:focus-within .play{ opacity:1; transform:translate(-50%,-50%) scale(1) }
  .demo .play svg{ width:18px; height:18px; color:#0A0A0B; margin-left:3px }
  /* 触屏无 hover → 播放按钮常驻 */
  @media (hover:none){ .demo .play{ opacity:1; transform:translate(-50%,-50%) scale(1) } }
  .demo .tag{ position:absolute; top:12px; left:12px; font-size:10px; font-weight:700; padding:4px 9px; border-radius:7px;
    background:rgba(8,8,10,.5); backdrop-filter:blur(10px); color:#fff; letter-spacing:.02em }
  .demo .cap-t{ position:absolute; left:15px; right:15px; bottom:15px }
  .demo .cap-t .ttl{ font-size:14px; font-weight:700; color:#fff; letter-spacing:-.01em }
  .demo .cap-t .sub{ font-size:10.5px; color:rgba(255,255,255,.7); margin-top:4px; font-family:var(--f-mono) }
  .demo.skel{ background:var(--card); animation:pulse 1.4s ease-in-out infinite }

  /* ===== 3. 一键开始 ===== */
  .starts{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px }
  @media(max-width:880px){ .starts{ grid-template-columns:repeat(2,1fr) } }
  .start{ border:1px solid var(--line-soft); border-radius:var(--r); background:var(--card); padding:18px;
    cursor:pointer; transition:.2s var(--ease-out); box-shadow:var(--sh-card); display:flex; flex-direction:column; gap:10px;
    text-align:left; font-family:var(--f); width:100%; min-height:44px }
  .start:hover{ transform:translateY(-3px); border-color:var(--blue) }
  .start:focus-visible{ outline:2px solid var(--blue); outline-offset:2px }
  .start .si{ width:34px; height:34px; border-radius:10px; background:var(--blue-bg); color:var(--blue); display:grid; place-items:center }
  .start .si svg{ width:18px; height:18px }
  .start h4{ font-size:14px; font-weight:600; color:var(--t1) }
  .start .sd{ font-size:12px; color:var(--t4); line-height:1.55 }
  .start .kind{ font-family:var(--f-mono); font-size:9.5px; color:var(--t3); letter-spacing:.04em; margin-top:2px }

  /* ===== 4. 创作工具 ===== */
  .tool-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:13px }
  .tool-card{ position:relative; border:1px solid var(--line-soft); border-radius:var(--r-lg); background:var(--card);
    padding:20px; cursor:pointer; transition:.25s var(--ease-out); box-shadow:var(--sh-card); display:flex; flex-direction:column; gap:11px }
  .tool-card:hover{ transform:translateY(-3px); border-color:var(--line-hi) }
  .tool-card:focus-visible{ outline:2px solid var(--blue); outline-offset:2px }
  .tool-card .ti{ width:40px; height:40px; border-radius:11px; background:var(--field); border:1px solid var(--line); display:grid; place-items:center }
  .tool-card .ti svg{ width:21px; height:21px; color:var(--t1) }
  .tool-card h4{ font-size:15px; font-weight:600; color:var(--t1); display:flex; align-items:center; gap:7px }
  .tool-card .tdesc{ font-size:12.5px; color:var(--t4); line-height:1.6 }
  .tool-card .nbadge{ font-family:var(--f-en); font-size:9.5px; font-weight:700; color:var(--blue); background:var(--blue-bg); padding:1px 6px; border-radius:5px }
  .tool-card .nano{ font-family:var(--f-en); font-size:9.5px; font-weight:700; color:var(--t3); border:1px solid var(--line); padding:1px 6px; border-radius:5px }
  .tool-card .soon-corner{ position:absolute; top:14px; right:14px; font-family:var(--f-mono); font-size:8px; color:var(--t4);
    border:1px solid var(--line); padding:2px 6px; border-radius:4px; letter-spacing:.04em }
  .tool-card.is-soon{ opacity:.72 }
  .tool-card.is-soon:hover{ opacity:.9 }

  /* ===== 5. 最近作品 ===== */
  .recent{ display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:12px }
  .rcard{ border-radius:var(--r); overflow:hidden; background:var(--card); border:1px solid var(--line-soft); box-shadow:var(--sh-card);
    text-decoration:none; color:inherit; transition:.2s var(--ease-out); display:block }
  .rcard:hover{ transform:translateY(-3px); border-color:var(--line-hi) }
  .rcard:focus-visible{ outline:2px solid var(--blue); outline-offset:2px }
  .rthumb{ aspect-ratio:4/3; background:#0A0A0B; position:relative; display:grid; place-items:center; overflow:hidden; background-size:cover; background-position:center }
  .rthumb video{ width:100%; height:100%; object-fit:contain; background:#000 }
  .rthumb .ph{ color:var(--t4); font-size:11px; display:flex; flex-direction:column; align-items:center; gap:6px }
  .rthumb .ph svg{ width:22px; height:22px }
  .rthumb .pb{ position:absolute; width:34px; height:34px; border-radius:50%; background:rgba(0,0,0,.45); display:grid; place-items:center; backdrop-filter:blur(4px) }
  .rthumb .pb svg{ width:14px; height:14px; color:#fff }
  .rbadge{ position:absolute; top:8px; left:8px; font-family:var(--f-mono); font-size:10px; padding:3px 7px; border-radius:6px }
  .rb-ok{ background:rgba(52,199,89,.16); color:var(--green) }
  .rb-run{ background:rgba(255,178,62,.16); color:var(--amber) }
  .rb-err{ background:rgba(255,82,71,.16); color:var(--red) }
  .rb-q{ background:rgba(255,255,255,.08); color:var(--t3) }
  .rcard .rb{ padding:11px 12px }
  .rcard .rt{ font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .rcard .rd{ color:var(--t4); font-size:11px; font-family:var(--f-mono); margin-top:3px }
  .rskel{ border-radius:var(--r); overflow:hidden; background:var(--card); border:1px solid var(--line-soft) }
  .rskel .rthumb{ animation:pulse 1.4s ease-in-out infinite }
  @keyframes pulse{ 0%,100%{opacity:.55} 50%{opacity:.85} }

  /* 暖空状态 / 错误状态 */
  .recent-empty, .recent-err{ grid-column:1/-1; border:1px dashed var(--line); border-radius:var(--r-lg);
    padding:38px 24px; text-align:center; background:radial-gradient(120% 130% at 50% 0%, rgba(77,141,255,.06), transparent 60%) }
  .recent-empty .ei{ width:46px; height:46px; margin:0 auto 14px; border-radius:13px; background:var(--field); border:1px solid var(--line); display:grid; place-items:center; color:var(--t3) }
  .recent-empty .ei svg{ width:23px; height:23px }
  .recent-empty .et{ font-size:14.5px; font-weight:600; color:var(--t2) }
  .recent-empty .ed{ font-size:12.5px; color:var(--t4); margin-top:6px; line-height:1.6 }
  .recent-empty .ea{ display:inline-flex; align-items:center; gap:7px; margin-top:16px; background:var(--t1); color:#0A0A0B;
    border-radius:var(--r-pill); padding:10px 18px; font-size:13px; font-weight:700; text-decoration:none; box-shadow:var(--sh-white-btn) }
  .recent-err{ color:var(--t3); font-size:13px }
  .recent-err button{ margin-top:12px; background:var(--card); border:1px solid var(--line); color:var(--t2);
    border-radius:var(--r-pill); padding:8px 16px; font-size:12.5px; font-family:var(--f); cursor:pointer; transition:.18s }
  .recent-err button:hover{ border-color:var(--line-hi); color:var(--t1) }

  /* ===== 弹窗播放器(复用 .ov/.modal) ===== */
  .ex-ov{ position:fixed; inset:0; background:rgba(4,4,5,.66); backdrop-filter:blur(8px); z-index:200;
    display:none; align-items:center; justify-content:center; padding:30px }
  .ex-ov.show{ display:flex }
  .player{ position:relative; width:min(440px,100%); max-height:90vh; overflow-y:auto; background:var(--modal); border-radius:var(--r-lg); border:1px solid var(--line);
    box-shadow:var(--sh-pop); animation:pop .35s var(--ease-out) }
  @keyframes pop{ from{transform:scale(.96) translateY(10px);opacity:0} to{transform:scale(1) translateY(0);opacity:1} }
  /* 媒体区:不再强制 9:16,内容按自身比例,封顶 64vh → 横视频不再有大黑边 */
  .player .pv{ background:#000; position:relative; display:flex; align-items:center; justify-content:center; max-height:64vh; overflow:hidden; border-radius:var(--r-lg) var(--r-lg) 0 0 }
  .player .pv video, .player .pv img{ display:block; width:100%; max-height:64vh; object-fit:contain; background:#000 }
  /* 编辑前后对比:给 .pv 实际高度(否则 height:100% 撑不起来,弹窗塌成空白) */
  .player .cmp{ display:grid; grid-template-columns:1fr 1fr; gap:2px; width:100%; aspect-ratio:1/1; max-height:64vh }
  .player .cmp figure{ position:relative; margin:0; overflow:hidden; background:#000 }
  .player .cmp figure .img{ position:absolute; inset:0; background-size:cover; background-position:center }
  .player .cmp figcaption{ position:absolute; left:8px; bottom:8px; z-index:1; font-size:11px; font-family:var(--f-mono);
    color:#fff; background:rgba(8,8,10,.6); padding:3px 8px; border-radius:6px; backdrop-filter:blur(8px) }
  .player .pv .pph{ color:var(--t4); font-size:12px; display:flex; flex-direction:column; gap:8px; align-items:center }
  .player .pv .pph svg{ width:30px; height:30px }
  .player .pbar{ padding:16px 18px; display:flex; align-items:center; gap:12px }
  .player .pbar .pt{ flex:1; min-width:0 }
  .player .pbar .pt .pn{ font-size:14.5px; font-weight:700 }
  .player .pbar .pt .ps{ font-size:11px; color:var(--t4); font-family:var(--f-mono); margin-top:4px; line-height:1.5;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }
  /* CTA:紧凑、不换行、不溢出弹窗 */
  .player .pbar .puse{ flex:none; max-width:46%; display:inline-flex; align-items:center; gap:6px; background:var(--t1); color:#0A0A0B;
    border:none; border-radius:var(--r-pill); padding:11px 16px; font-size:13px; font-weight:700; font-family:var(--f);
    white-space:nowrap; cursor:pointer; box-shadow:var(--sh-white-btn); text-decoration:none }
  .player .pbar .puse .use-label{ overflow:hidden; text-overflow:ellipsis }
  .player .pbar .puse svg{ width:15px; height:15px; flex:none }
  /* 关闭按钮:固定在弹窗右上角、最高层级,绝不被 video controls / 对比图盖住 */
  .player .pclose{ position:absolute; top:12px; right:12px; width:36px; height:36px; border-radius:50%; z-index:10;
    background:rgba(255,255,255,.92); border:none; color:#0A0A0B; cursor:pointer; display:grid; place-items:center;
    box-shadow:0 4px 16px rgba(0,0,0,.45); transition:transform .15s, background .15s }
  .player .pclose:hover{ transform:scale(1.08); background:#fff }
  .player .pclose:focus-visible{ outline:2px solid var(--blue); outline-offset:2px }
  .player .pclose svg{ width:18px; height:18px }

  @media (prefers-reduced-motion: reduce){
    .explore, .demo, .player{ animation:none !important }
    .demo, .tool-card, .start, .rcard{ transition:none !important }
    .demo:hover, .tool-card:hover, .start:hover, .rcard:hover{ transform:none !important }
    .rskel .rthumb, .demo.skel{ animation:none !important }
  }
</style>
<script defer src="shell.js"></script>

<script>
  // ============ 数据 ============
  // 同时转义单引号:展示墙 url('...') / 属性多用单引号,SHOWCASE 若将来改为 API 驱动可防 CSS/属性注入
  function esc(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function svg(inner){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`; }

  // 灵感库:平台自产的多模态真实产出(showcase-data.js / window.LJShowcase)。
  // 每项 = 一条可一键复用的真实样例;点动作 → 带 ?prompt= 进对应工具(eng-review:只文本,不带 ?img=)。
  // modality: image | video | image-edit | avatar。actionLabel/actionText 按模态由 build-showcase-data 生成。
  const MOD_BADGE = { video:'▶ 影片', 'video-edit':'▶ 影片编辑', 'image-edit':'✎ 图片编辑', avatar:'🧍 数字人' }; // image 无徽章
  // OSS 公网 URL → 存储 key(去 host + 去签名 query)。同桶 key 可直接当 reuse 输入 ref
  //(后端 worker publish(key) 重新签名喂厂商;浏览器跨域 fetch 不到 File,故走 reuse 不重传)。
  const OSS_HOST = 'lh-lingjing.oss-cn-hangzhou.aliyuncs.com/';
  function urlToKey(u){ if(!u) return ''; const i=u.indexOf(OSS_HOST); return i<0?'':u.slice(i+OSS_HOST.length).split('?')[0]; }
  // 数字人示范脸 → 预置 id(与 src/avatars/index.ts 的 preset-sage/grandma/girl 对应)。
  const AVATAR_PRESET = { 'portrait-sage.jpg':'preset-sage', 'portrait-grandma.jpg':'preset-grandma', 'girl-rainbow.jpg':'preset-girl' };
  // 参考图(refUrls,如换装的参考衣服图)→ &reuseRefImg=key1,key2(逗号分隔,带进编辑器「参考图」槽)。
  function refImgParam(s){ const ks=(s.refUrls||[]).map(urlToKey).filter(Boolean); return ks.length?'&reuseRefImg='+encodeURIComponent(ks.join(',')):''; }
  function buildPrefill(s){
    const prompt=encodeURIComponent(s.actionText||s.prompt||'');
    if(s.modality==='image-edit'){ const k=urlToKey(s.beforeUrl||s.poster); return `${s.page}?prompt=${prompt}${k?'&reuseImg='+encodeURIComponent(k):''}${refImgParam(s)}`; }
    if(s.modality==='video-edit'){ const k=urlToKey(s.videoUrl||s.sourceUrl); return `${s.page}?prompt=${prompt}${k?'&reuseVideo='+encodeURIComponent(k):''}${refImgParam(s)}`; }
    if(s.modality==='avatar'){ const pid=AVATAR_PRESET[(s.sourceUrl||s.poster||'').split('/').pop()]; return `create.html?prompt=${prompt}${pid?'&avatar='+encodeURIComponent(pid):''}`; }
    if(s.modality==='video'){ const k=urlToKey(s.poster); return `${s.page}?prompt=${prompt}${k?'&reuseImg='+encodeURIComponent(k):''}`; } // 图转影片:poster=开始图(首帧)
    return `${s.page}?prompt=${prompt}`; // image:只带提示词
  }
  const SC_ALL = (window.LJShowcase || []).map(s=>({
    id:s.id, title:s.title, sub:`${s.toolName} · ${s.theme}`, tag:s.theme, theme:s.theme,
    modality:s.modality, poster:s.poster, videoUrl:s.videoUrl, beforeUrl:s.beforeUrl, afterUrl:s.afterUrl, sourceUrl:s.sourceUrl,
    toolName:s.toolName, actionLabel:s.actionLabel||'用这个提示词', actionText:s.actionText||s.prompt||'',
    prefill:buildPrefill(s),
  }));
  let SHOWCASE = SC_ALL.slice(); // 当前筛选/抽样后的可见集
  let SC_THEME = '全部';
  let SC_OFFSET = 0; // 「换一批」轮转起点
  const SC_VISIBLE = 24; // 瀑布流墙一屏展示量(多行,比横滚露更多)
  // 模态权重:多模态(影片/编辑/数字人)是新内容,优先露出;图片垫后。
  const MOD_RANK = { video:0, 'video-edit':1, avatar:2, 'image-edit':3, image:4 };

  function scApplyFilter(reshuffle){
    if(reshuffle) SC_OFFSET += SC_VISIBLE;
    let pool = SC_THEME==='全部' ? SC_ALL.slice() : SC_ALL.filter(s=>s.theme===SC_THEME);
    // 排序:先按模态权重(多模态优先),同权重内按 id 稳定;轮转 offset 让「换一批」翻页。
    pool.sort((a,b)=>(MOD_RANK[a.modality]??9)-(MOD_RANK[b.modality]??9) || (a.id<b.id?-1:1));
    if(SC_OFFSET >= pool.length) SC_OFFSET = 0;
    const rot = pool.slice(SC_OFFSET).concat(pool.slice(0, SC_OFFSET));
    SHOWCASE = rot.slice(0, SC_VISIBLE);
    renderShowcase();
    document.getElementById('scCount').textContent = `${pool.length} 个产出`;
  }

  // ============ 渲染:灵感库筛选 chips ============
  function renderScFilter(){
    const themes = ['全部', ...[...new Set(SC_ALL.map(s=>s.theme))]];
    const box = document.getElementById('scFilter');
    box.innerHTML = themes.map(t=>`<button class="sc-chip${t===SC_THEME?' on':''}" role="tab" aria-selected="${t===SC_THEME}" data-theme="${esc(t)}">${esc(t)}</button>`).join('');
    box.querySelectorAll('.sc-chip').forEach(c=>{
      c.addEventListener('click', ()=>{ SC_THEME=c.dataset.theme; SC_OFFSET=0; renderScFilter(); scApplyFilter(); });
    });
  }

  // ============ 渲染:灵感库(多模态)============
  function renderShowcase(){
    const el = document.getElementById('showcase');
    el.innerHTML = SHOWCASE.map((s,i)=>{
      const modBadge = MOD_BADGE[s.modality] ? `<span class="mod-badge">${esc(MOD_BADGE[s.modality])}</span>` : '';
      // 影片/数字人=播放图标;编辑=对比图标;图片=提示词图标
      const ic = (s.modality==='video'||s.modality==='avatar'||s.modality==='video-edit')
        ? '<path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/>'
        : (s.modality==='image-edit')
          ? '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M12 5v14"/><path d="m7 13 2-2 2 2"/><path d="m15 11 2 2"/>'
          : '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>';
      const mClass = s.modality && s.modality!=='image' ? ` m-${s.modality}` : '';
      return `
      <div class="demo${mClass}" tabindex="0" role="button" aria-label="查看：${esc(s.title)}" data-i="${i}">
        <div class="img" style="background-image:url('${esc(s.poster||'')}')"></div>
        <div class="veil"></div>
        <span class="tag prompt-tag">${esc(s.tag)}</span>
        ${modBadge}
        <button class="play" tabindex="-1" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ic}</svg></button>
        <div class="cap-t"><div class="ttl">${esc(s.title)}</div><div class="sub">${esc(s.sub)}</div></div>
      </div>`;}).join('');
    el.querySelectorAll('.demo').forEach(card=>{
      const open=()=>openPlayer(SHOWCASE[+card.dataset.i]);
      card.addEventListener('click', open);
      card.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(); } });
    });
  }

  // ============ 弹窗播放器 ============
  let _lastFocus=null;
  function openPlayer(s){
    _lastFocus=document.activeElement;
    const view=document.getElementById('playerView');
    // 按模态渲染 modal:影片/数字人=<video controls>;编辑=前后对比;图片=纯净大图
    if((s.modality==='video'||s.modality==='avatar'||s.modality==='video-edit') && s.videoUrl){
      view.innerHTML = `<video src="${esc(s.videoUrl)}" controls autoplay playsinline poster="${esc(s.poster||'')}"></video>`;
    } else if(s.modality==='image-edit' && s.beforeUrl && s.afterUrl){
      view.innerHTML = `<div class="cmp">
        <figure><div class="img" style="background-image:url('${esc(s.beforeUrl)}')"></div><figcaption>原图</figcaption></figure>
        <figure><div class="img" style="background-image:url('${esc(s.afterUrl)}')"></div><figcaption>编辑后</figcaption></figure>
      </div>`;
    } else {
      // 图片(及编辑缺前后图回退):用 <img> 让 .pv 撑起高度,绝不用绝对定位(会塌成空白)
      view.innerHTML = `<img src="${esc(s.poster||'')}" alt="${esc(s.title)}">`;
    }
    document.getElementById('playerName').textContent=s.title;
    // 副行展示真实文本(截断);标签按模态:提示词/编辑指令/口播文案
    const noun = (s.modality==='image-edit'||s.modality==='video-edit')?'编辑指令':(s.modality==='avatar'?'口播文案':'提示词');
    const txt=(s.actionText||'').trim();
    document.getElementById('playerSub').textContent = txt ? `${noun}:${txt.slice(0,80)}${txt.length>80?'…':''}` : s.sub;
    const useBtn=document.getElementById('playerUse');
    useBtn.href=s.prefill;
    useBtn.querySelector('.use-label').textContent = s.actionLabel || '用这个提示词';
    // CTA 图标按动作语义:数字人=去做(箭头)、编辑=魔棒、图/影片=魔棒生成(非播放三角)
    const useIc = useBtn.querySelector('svg');
    useIc.innerHTML = s.modality==='avatar'
      ? '<path d="M5 12h14M13 6l6 6-6 6"/>'
      : '<path d="M15 4V2M15 10V8M9 6h2M19 6h2M12.5 8.5 4 17l3 3 8.5-8.5M14 7l3 3"/>';
    const ov=document.getElementById('player');
    ov.classList.add('show');
    document.getElementById('playerClose').focus();
  }
  function closePlayer(){
    const ov=document.getElementById('player');
    ov.classList.remove('show');
    const v=ov.querySelector('video'); if(v){ v.pause(); }
    if(_lastFocus) _lastFocus.focus();
  }
  document.getElementById('playerClose').addEventListener('click', closePlayer);
  document.getElementById('player').addEventListener('click', e=>{ if(e.target.id==='player') closePlayer(); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape' && document.getElementById('player').classList.contains('show')) closePlayer(); });

  // ============ 统一加载:Hero 余额 + 统计(一次 /jobs 供作品计数)============
  // (删 3 区后只剩 Hero 用它;最近作品/角色透传已移除,但保留五连拉数供余额+统计)
  async function loadAll(){
    try{ await LJ.me(); }catch(e){ return; /* 401 已跳登录 */ }
    const [bal,warn,jobs,avs,vcs]=await Promise.all([
      LJ.get('/credits/balance').catch(()=>({balance:null})),
      LJ.get('/credits/warning').catch(()=>null),
      LJ.get('/jobs').catch(()=>null),
      LJ.get('/avatars').catch(()=>null),
      LJ.get('/voices').catch(()=>null),
    ]);
    const balEl=document.getElementById('balVal');
    balEl.textContent = bal.balance==null ? '—' : bal.balance.toLocaleString('en-US');
    if(warn&&warn.low){ balEl.classList.add('low'); document.getElementById('balWarn').style.display='block'; document.getElementById('balMeta').style.display='none'; }
    const set=(id,v)=>{ document.getElementById(id).textContent = v==null?'—':v; };
    set('cWorks', jobs?jobs.length:null);
    set('cAvatars', avs?(avs.custom||[]).length:null);
    set('cVoices', vcs?(vcs.clones||[]).length:null);
  }

  // ============ 启动 ============
  function scEmpty(){ document.getElementById('showcase').innerHTML = `<div style="color:var(--t4);padding:40px 8px;font-size:13px">灵感正在生成中,稍后再来看看 ✨</div>`; }
  renderScFilter();
  if(SC_ALL.length) scApplyFilter(); else scEmpty();
  document.getElementById('scShuffle').addEventListener('click', e=>{ e.preventDefault(); scApplyFilter(true); document.getElementById('showcase').scrollTo({left:0,behavior:'smooth'}); });
  loadAll();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新建开票 · 灵镜</title>
  <link rel="icon" type="image/svg+xml" href="/brand/lingjing-favicon.svg">
  <link rel="stylesheet" href="app.css">
  <style>
    .in-grid{ display:grid; grid-template-columns:1fr 360px; gap:20px; align-items:start; }
    .in-sec{ font-size:12px; color:var(--t3); font-weight:700; text-transform:uppercase; letter-spacing:.6px; margin-bottom:12px; }
    /* 订单勾选 */
    .in-ord{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:10px; display:flex; align-items:center; gap:14px; cursor:pointer; }
    .in-ord.sel{ border-color:var(--blue); background:linear-gradient(180deg,rgba(77,141,255,.06),transparent); }
    .in-ck{ width:20px; height:20px; border-radius:6px; border:2px solid var(--line-hi); flex-shrink:0; display:flex; align-items:center; justify-content:center; }
    .in-ord.sel .in-ck{ border-color:var(--blue); background:var(--blue); }
    .in-ord.sel .in-ck::after{ content:'✓'; color:#fff; font-size:13px; font-weight:700; }
    .in-on{ font-size:13px; font-weight:600; }
    .in-om{ font-size:11px; color:var(--t3); margin-top:3px; font-family:var(--f-mono,monospace); }
    .in-oa{ margin-left:auto; font-size:16px; font-weight:800; font-family:var(--f-en,'Manrope',sans-serif); }
    .in-empty{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:36px; text-align:center; color:var(--t4); font-size:13px; }
    /* 右栏:抬头资料 + 确认 */
    .in-card{ background:var(--card-hi); border:1px solid var(--line); border-radius:16px; padding:20px; position:sticky; top:24px; }
    .in-card h3{ font-size:14px; font-weight:700; margin-bottom:14px; }
    .in-card label{ display:block; font-size:12px; color:var(--t3); margin:10px 0 4px; }
    .in-card input{ width:100%; background:var(--field); border:1px solid var(--line); border-radius:10px; padding:10px 12px; color:var(--t1); font-size:14px; font-family:inherit; }
    .in-sum{ display:flex; justify-content:space-between; align-items:baseline; margin:16px 0 4px; padding-top:14px; border-top:1px solid var(--line-soft); }
    .in-sum .k{ color:var(--t2); font-size:13px; }
    .in-sum .v{ font-size:26px; font-weight:800; color:var(--green); font-family:var(--f-en,'Manrope',sans-serif); }
    .in-btn{ width:100%; margin-top:14px; background:var(--blue); color:#fff; border:none; border-radius:999px; padding:13px; font-size:15px; font-weight:700; font-family:inherit; cursor:pointer; min-height:46px; }
    .in-btn:disabled{ opacity:.5; cursor:not-allowed; }
    .in-hint{ font-size:11px; color:var(--t4); margin-top:10px; line-height:1.6; }
    @media (max-width:760px){ .in-grid{ grid-template-columns:1fr; } .in-card{ position:static; } }
  </style>
</head>

<body data-page="invoices" data-crumb="财务中心 > 发票管理 > 新建开票">
  <div class="shell" id="shell-mount">
    <div class="main-col">
      <main class="page">
        <div class="ph">
          <div><h1 class="t-h1">新建开票</h1><p class="desc">勾选需要开票的已到账订单(可多选合并),核对抬头资料后提交。平台核对入账后开具发票。</p></div>
        </div>
        <div id="inRoot"><div class="in-empty">加载中…</div></div>
      </main>
    </div>
  </div>

  <script src="shell.js"></script>
  <script src="api.js"></script>
  <script>
    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
    function fmtN(n){ return (n||0).toLocaleString('zh-CN'); }

    let ORDERS = [];        // 可开票(credited 未开票)订单
    const selected = new Set();
    let PROFILE = null;
    let submitting = false;

    async function load(){
      const root = document.getElementById('inRoot');
      try{
        const me = await LJ.me();
        if(me.role !== 'admin'){ root.innerHTML = '<div class="in-empty">开票由管理员发起,你没有权限。<br><a href="invoices.html" style="color:var(--blue)">返回发票管理</a></div>'; return; }
        const [{ orders }, { profile }] = await Promise.all([ LJ.get('/orders'), LJ.get('/invoice-profile') ]);
        // 可开票 = credited 且 invoiceStatus 空(未开票)
        ORDERS = (orders||[]).filter(o => o.status === 'credited' && !o.invoiceStatus);
        PROFILE = profile;
        render();
      }catch(e){ root.innerHTML = '<div class="in-empty">加载失败,请刷新重试。</div>'; }
    }

    function render(){
      const root = document.getElementById('inRoot');
      root.innerHTML = `<div class="in-grid">
        <div>
          <div class="in-sec">选择订单(已到账·未开票)</div>
          <div id="inOrders"></div>
        </div>
        <div class="in-card">
          <h3>开票资料</h3>
          <label>发票抬头(公司名称)</label><input id="inTitle" placeholder="例:某某科技有限公司" value="${esc(PROFILE&&PROFILE.title||'')}">
          <label>纳税人识别号(税号)</label><input id="inTax" placeholder="例:91320114MAEGND5180" value="${esc(PROFILE&&PROFILE.tax_no||'')}">
          <div class="in-sum"><span class="k">合计金额</span><span class="v" id="inTotal">¥0</span></div>
          <button class="in-btn" id="inSubmit" disabled>提交开票申请</button>
          <div class="in-hint">${PROFILE?'抬头资料已自动带入,可修改。':'首次开票将自动保存抬头资料到机构,后续自动带入。'}提交后平台核对入账并开具,可在发票管理下载。</div>
        </div>
      </div>`;
      renderOrders();
      document.getElementById('inSubmit').onclick = submit;
    }

    function renderOrders(){
      const box = document.getElementById('inOrders');
      if(!ORDERS.length){ box.innerHTML = '<div class="in-empty">暂无可开票订单。<br>已到账且未开票的充值订单会出现在这里。</div>'; return; }
      box.innerHTML = ORDERS.map(o => {
        const sel = selected.has(o.id) ? ' sel' : '';
        return `<div class="in-ord${sel}" data-id="${esc(o.id)}">
          <div class="in-ck"></div>
          <div><div class="in-on">${esc(o.planName)}</div><div class="in-om">${esc(o.orderNo)}</div></div>
          <div class="in-oa"><span style="font-size:12px;color:var(--t2)">¥</span>${fmtN(o.priceYuan)}</div>
        </div>`;
      }).join('');
      box.querySelectorAll('.in-ord').forEach(el => el.onclick = () => {
        const id = el.dataset.id;
        if(selected.has(id)) selected.delete(id); else selected.add(id);
        renderOrders(); updateTotal();
      });
    }

    function updateTotal(){
      const total = ORDERS.filter(o => selected.has(o.id)).reduce((s,o)=>s+o.priceYuan,0);
      const el = document.getElementById('inTotal'); if(el) el.textContent = '¥'+fmtN(total);
      const btn = document.getElementById('inSubmit'); if(btn) btn.disabled = selected.size === 0;
    }

    async function submit(){
      if(submitting || selected.size === 0) return;
      const title = document.getElementById('inTitle').value.trim();
      const taxNo = document.getElementById('inTax').value.trim();
      if(!title){ window.LJToast('请填写发票抬头','err'); return; }
      if(!taxNo){ window.LJToast('请填写税号','err'); return; }
      submitting = true;
      const btn = document.getElementById('inSubmit'); btn.disabled = true; btn.textContent = '提交中…';
      try{
        await LJ.post('/invoices', { orderIds: [...selected], title, taxNo });
        window.LJToast('✓ 开票申请已提交');
        location.href = 'invoices.html';
      }catch(e){
        submitting = false; btn.disabled = false; btn.textContent = '提交开票申请';
        window.LJToast(e.message || '提交失败','err');
      }
    }

    load();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成员与权限 · 灵镜</title>
<link rel="icon" type="image/svg+xml" href="/brand/lingjing-favicon.svg">
<link rel="stylesheet" href="app.css">
</head>
<body data-page="members" data-crumb="经营管理 > 成员与权限">
<div class="shell" id="shell-mount">
  <div class="main-col">
    <main class="page">
      <div class="ph">
        <div><h1 class="t-h1">成员与权限</h1><p class="desc">按「机构 → 成员 → 角色」三级管理团队。管理员可邀请成员、分配角色、停用账号;创作席位决定可同时创作的成员数。各机构的形象、音色、作品相互隔离。</p></div>
        <button class="btn btn-white" id="inviteBtn" onclick="invite()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>邀请成员</button>
      </div>

      <div class="stat-row" id="statRow">
        <!-- 统计卡由 renderStats() 用真实数据填充(机构/创作席位/成员总数/角色分布) -->
      </div>

      <div class="bar">
        <div class="search-in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="searchIn" placeholder="搜索成员…"></div>
        <div class="sp"></div>
        <button class="chip active" data-role="all">全部</button><button class="chip" data-role="admin">管理员</button><button class="chip" data-role="creator">创作者</button><button class="chip" data-role="viewer">查看者</button>
      </div>

      <table class="tbl">
        <thead><tr><th>成员</th><th>角色</th><th>占用席位</th><th>最近活跃</th><th>状态</th><th></th></tr></thead>
        <tbody id="memberBody"></tbody>
      </table>

      <div class="set-card" style="margin-top:24px">
        <h3>角色权限</h3>
        <div class="h-desc">三种内置角色的能力边界。</div>
        <table class="tbl" style="box-shadow:none;border:none">
          <thead><tr><th>权限</th><th style="text-align:center">管理员</th><th style="text-align:center">创作者</th><th style="text-align:center">查看者</th></tr></thead>
          <tbody>
            <tr><td>创作数字人视频 / 配音</td><td style="text-align:center">✓</td><td style="text-align:center">✓</td><td style="text-align:center" class="num">—</td></tr>
            <tr><td>管理形象 / 音色 / 素材</td><td style="text-align:center">✓</td><td style="text-align:center">✓</td><td style="text-align:center" class="num">—</td></tr>
            <tr><td>查看 / 下载作品</td><td style="text-align:center">✓</td><td style="text-align:center">✓</td><td style="text-align:center">✓</td></tr>
            <tr><td>成员管理 / 用量查看</td><td style="text-align:center">✓</td><td style="text-align:center" class="num">—</td><td style="text-align:center" class="num">—</td></tr>
            <tr><td>系统设置 / 能力网关</td><td style="text-align:center">✓</td><td style="text-align:center" class="num">—</td><td style="text-align:center" class="num">—</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<!-- 邀请成员弹窗(替代 3 个 prompt)-->
<div class="ov" id="ov-invite" style="position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:none;place-items:center;z-index:300">
  <div style="width:380px;max-width:92vw;background:var(--modal,#161618);border:1px solid var(--line);border-radius:18px;padding:26px">
    <h3 style="font-size:18px;font-weight:700;margin-bottom:4px">邀请成员</h3>
    <div style="color:var(--t3);font-size:12.5px;margin-bottom:20px">为机构添加成员并分配角色。用户名全平台唯一。</div>
    <label style="display:block;font-size:12px;color:var(--t3);margin-bottom:7px">用户名</label>
    <input id="invUser" placeholder="登录用户名(全平台唯一)" style="width:100%;box-sizing:border-box;background:var(--field,#121214);border:1px solid var(--line);border-radius:10px;padding:11px 13px;color:var(--t1);font-size:14px;outline:none;margin-bottom:14px">
    <label style="display:block;font-size:12px;color:var(--t3);margin-bottom:7px">初始密码(≥6 位)</label>
    <input id="invPass" type="password" placeholder="成员首次登录用,可后续自行修改" style="width:100%;box-sizing:border-box;background:var(--field,#121214);border:1px solid var(--line);border-radius:10px;padding:11px 13px;color:var(--t1);font-size:14px;outline:none;margin-bottom:14px">
    <label style="display:block;font-size:12px;color:var(--t3);margin-bottom:9px">角色</label>
    <div id="invRoleSeg" style="display:flex;gap:8px;margin-bottom:6px">
      <button type="button" data-r="creator" class="ir-opt" onclick="pickRole(this)">创作者</button>
      <button type="button" data-r="viewer" class="ir-opt" onclick="pickRole(this)">查看者</button>
      <button type="button" data-r="admin" class="ir-opt" onclick="pickRole(this)">管理员</button>
    </div>
    <div id="invRoleDesc" style="font-size:11.5px;color:var(--t4);min-height:30px;line-height:1.6">创作者:可创建形象/音色/作品、发起生成,但不能管理成员。</div>
    <div id="invMsg" style="color:var(--red);font-size:12.5px;min-height:16px;margin-bottom:4px"></div>
    <div style="display:flex;gap:10px;margin-top:8px">
      <button class="btn btn-dark" style="flex:1" onclick="document.getElementById('ov-invite').style.display='none'">取消</button>
      <button class="btn btn-white" style="flex:1" id="invSubmit" onclick="submitInvite()">邀请</button>
    </div>
  </div>
</div>

<!-- 改角色弹窗(清晰单选,复用 .ir-opt 分段控件)-->
<div class="ov" id="ov-role" style="position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:none;place-items:center;z-index:300">
  <div style="width:380px;max-width:92vw;background:var(--modal,#161618);border:1px solid var(--line);border-radius:18px;padding:26px">
    <h3 style="font-size:18px;font-weight:700;margin-bottom:4px">修改角色</h3>
    <div id="roleWho" style="color:var(--t3);font-size:12.5px;margin-bottom:20px"></div>
    <label style="display:block;font-size:12px;color:var(--t3);margin-bottom:9px">新角色</label>
    <div id="roleSeg" style="display:flex;gap:8px;margin-bottom:6px">
      <button type="button" data-r="creator" class="ir-opt" onclick="pickNewRole(this)">创作者</button>
      <button type="button" data-r="viewer" class="ir-opt" onclick="pickNewRole(this)">查看者</button>
      <button type="button" data-r="admin" class="ir-opt" onclick="pickNewRole(this)">管理员</button>
    </div>
    <div id="roleDesc" style="font-size:11.5px;color:var(--t4);min-height:30px;line-height:1.6"></div>
    <div id="roleMsg" style="color:var(--red);font-size:12.5px;min-height:16px;margin-bottom:4px"></div>
    <div style="display:flex;gap:10px;margin-top:8px">
      <button class="btn btn-dark" style="flex:1" onclick="document.getElementById('ov-role').style.display='none'">取消</button>
      <button class="btn btn-white" style="flex:1" id="roleSubmit" onclick="submitRole()">保存</button>
    </div>
  </div>
</div>
<style>
  .ir-opt{flex:1;padding:9px;border-radius:9px;background:var(--field,#121214);border:1px solid var(--line);color:var(--t2);font-size:13px;font-family:var(--f);cursor:pointer;transition:.15s}
  .ir-opt:hover{border-color:var(--line-hi)}
  .ir-opt.active{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}
  /* 骨架屏:加载占位灰条 */
  .skel-bar{height:18px;border-radius:6px;background:linear-gradient(90deg,var(--card-2,#1c1c20) 25%,var(--line,#2a2a30) 37%,var(--card-2,#1c1c20) 63%);background-size:400% 100%;animation:skel 1.3s ease infinite}
  @keyframes skel{0%{background-position:100% 50%}100%{background-position:0 50%}}
  /* 移动端:≤640px 表格转卡片(每成员一卡,不横向溢出)*/
  @media (max-width:640px){
    .tbl thead{display:none}
    .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%;box-sizing:border-box}
    .tbl tr{margin-bottom:12px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--card,#141418)}
    .tbl td{border:none;padding:6px 4px;text-align:left!important}
    .tbl td.num{color:var(--t3)}
    .tbl td[style*="text-align:right"]{text-align:left!important}
    .skel-row td{padding:6px 4px}
  }
</style>
<script src="shell.js"></script>
<script src="api.js"></script>
<script>
  // chip data-role 已在 HTML 静态写死(全部/管理员/创作者/查看者),不依赖 load() 赋值 —— 加载前点也有效。
  let curFilter='all';
  document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',function(){
    this.parentNode.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
    this.classList.add('active'); curFilter=this.dataset.role; render(curFilter);
  }));

  const body = document.getElementById('memberBody');
  let members = [], seats = null, myId = null, myRole = null;
  const ROLE_CN = {admin:'管理员',creator:'创作者',viewer:'查看者'};
  function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

  // 相对时间:真实 last_active(null=从未登录)。
  function fmtActive(ts){
    if(!ts) return '从未登录';
    const diff=Date.now()-ts, m=60000, h=3600000, d=86400000;
    if(diff<m) return '刚刚';
    if(diff<h) return Math.floor(diff/m)+' 分钟前';
    if(diff<d) return Math.floor(diff/h)+' 小时前';
    if(diff<7*d) return Math.floor(diff/d)+' 天前';
    const dt=new Date(ts), p=n=>String(n).padStart(2,'0');
    return `${dt.getFullYear()}-${p(dt.getMonth()+1)}-${p(dt.getDate())}`;
  }

  // 席位占用号:creator 按 created_at 升序(列表已按此序),第 N 个 creator 显示「席位 #N」。
  function seatNoMap(){
    const map={}; let n=0;
    members.forEach(m=>{ if(m.role==='creator'){ n++; map[m.id]='席位 #'+n; } });
    return map;
  }

  function row(m, seatNo){
    const name = esc(m.display_name||m.username);
    const initial = (m.display_name||m.username||'?').slice(0,1).toUpperCase();
    const statusBdg = m.status==='active'
      ? '<span class="bdg bdg-ok">活跃</span>'
      : '<span class="bdg" style="background:rgba(255,82,71,.14);color:var(--red)">已停用</span>';
    // 仅 admin 显示操作按钮(后端也有 403/code 兜底);不渲染针对自己的危险操作。
    const isSelf = m.id===myId;
    const actions = myRole==='admin' ? `<td style="text-align:right;white-space:nowrap">
      ${isSelf ? '<span style="color:var(--t4);font-size:12px">本人</span>' : `
      <button class="btn btn-dark" style="padding:7px 11px;font-size:12px" aria-label="改角色" onclick="openRole('${m.id}','${name}','${m.role}')">改角色</button>
      ${m.status==='active'
        ? `<button class="btn btn-dark" style="padding:7px 11px;font-size:12px" aria-label="停用 ${name}" onclick="disable('${m.id}','${name}')">停用</button>`
        : `<button class="btn btn-dark" style="padding:7px 11px;font-size:12px" aria-label="启用 ${name}" onclick="enable('${m.id}')">启用</button>`}
      <button class="btn btn-dark" style="padding:7px 11px;font-size:12px" aria-label="移除 ${name}" onclick="removeM('${m.id}','${name}')">移除</button>`}
    </td>` : '<td></td>';
    return `<tr>
      <td><div style="display:flex;align-items:center;gap:12px"><div class="mini-face" style="background:linear-gradient(150deg,#2C2C32,#161618);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--t2)">${initial}</div><div><div class="strong">${name}</div></div></div></td>
      <td><span class="bdg bdg-role">${ROLE_CN[m.role]||m.role}</span></td>
      <td class="num">${seatNo||'—'}</td>
      <td class="num">${fmtActive(m.last_active)}</td>
      <td>${statusBdg}</td>
      ${actions}
    </tr>`;
  }

  function render(roleFilter){
    const sn = seatNoMap();
    let list = members;
    if(['admin','creator','viewer'].includes(roleFilter)) list = members.filter(m=>m.role===roleFilter);
    body.innerHTML = list.length ? list.map(m=>row(m, sn[m.id])).join('')
      : '<tr><td colspan="6" style="text-align:center;color:var(--t4);padding:40px">暂无成员</td></tr>';
  }

  // 真实统计卡:机构名 / 创作席位(已用/上限) / 成员总数 / 角色分布。
  function renderStats(orgName){
    const total=members.length;
    const nAdmin=members.filter(m=>m.role==='admin').length;
    const nCreator=members.filter(m=>m.role==='creator').length;
    const nViewer=members.filter(m=>m.role==='viewer').length;
    const used=seats?seats.used:nCreator, limit=seats?seats.limit:10;
    const pct=limit>0?Math.min(100,Math.round(used/limit*100)):0;
    document.getElementById('statRow').innerHTML = `
      <div class="stat" style="animation-delay:.04s"><div class="lbl">机构</div><div class="val" style="font-size:22px">${esc(orgName||'我的机构')}</div></div>
      <div class="stat" style="animation-delay:.08s"><div class="lbl">创作席位</div><div class="val">${used} <small>/ ${limit}</small></div><div class="bar"><i style="width:${pct}%"></i></div><div class="sub">已用 ${used}，余 ${Math.max(0,limit-used)}</div></div>
      <div class="stat" style="animation-delay:.12s"><div class="lbl">成员总数</div><div class="val">${total}</div><div class="sub">管理员 ${nAdmin} · 创作者 ${nCreator} · 查看者 ${nViewer}</div></div>`;
  }

  // 错误码 → 用户文案兜底(后端已带中文 message,这里仅作 code 分支判断的语义来源)。
  function isSeatsFull(e){ return e && e.code==='SEATS_FULL'; }

  // 骨架屏:加载期 3 行灰色闪动占位(与作品库/创作台一致),不闪假数据。
  function skeleton(){
    body.innerHTML = Array.from({length:3}).map(()=>
      `<tr class="skel-row"><td colspan="6"><div class="skel-bar"></div></td></tr>`).join('');
  }
  function errorRow(){
    body.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--t4);padding:40px">加载失败 <button class="btn btn-dark" style="margin-left:8px;padding:6px 12px;font-size:12px" onclick="load()">重试</button></td></tr>`;
  }

  // 邀请成员弹窗(替代 3 个浏览器 prompt)
  let invRole='creator';
  const ROLE_DESC={
    creator:'创作者:可创建形象/音色/作品、发起生成,但不能管理成员。',
    viewer:'查看者:只读作品、下载,不能发起生成或管理。',
    admin:'管理员:成员管理、用量查看、系统配置,权限最高。',
  };
  function pickRole(b){ invRole=b.dataset.r; b.parentNode.querySelectorAll('.ir-opt').forEach(x=>{x.classList.remove('active');x.setAttribute('aria-pressed','false');}); b.classList.add('active'); b.setAttribute('aria-pressed','true'); document.getElementById('invRoleDesc').textContent=ROLE_DESC[invRole]; }
  function invite(){
    if(myRole!=='admin'){ window.LJToast('仅管理员可邀请成员','err'); return; }
    document.getElementById('invUser').value=''; document.getElementById('invPass').value='';
    document.getElementById('invMsg').textContent=''; invRole='creator';
    document.querySelectorAll('#invRoleSeg .ir-opt').forEach(b=>{const on=b.dataset.r==='creator';b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on));});
    document.getElementById('invRoleDesc').textContent=ROLE_DESC.creator;
    document.getElementById('ov-invite').style.display='grid';
    document.getElementById('invUser').focus();
  }
  async function submitInvite(){
    const username=document.getElementById('invUser').value.trim();
    const password=document.getElementById('invPass').value;
    const msg=document.getElementById('invMsg'); msg.style.color='var(--red)';
    if(!username){ msg.textContent='请输入用户名'; return; }
    if(password.length<6){ msg.textContent='初始密码至少 6 位'; return; }
    const btn=document.getElementById('invSubmit'); btn.disabled=true; btn.textContent='邀请中…';
    try{
      await LJ.post('/members',{username,password,role:invRole});
      document.getElementById('ov-invite').style.display='none';
      window.LJToast('已邀请「'+username+'」');
      await load();
    }catch(e){ msg.textContent=e.message; }  // 含席位满 SEATS_FULL 文案
    finally{ btn.disabled=false; btn.textContent='邀请'; }
  }
  async function disable(id,name){ if(!(await window.LJConfirm({title:'停用成员',body:`停用「<b style="color:var(--t1)">${esc(name)}</b>」?其登录将立即失效。`,confirmText:'停用',danger:true})))return; try{await LJ.post('/members/'+id+'/disable');await load();window.LJToast('已停用成员');}catch(e){window.LJToast(e.message,'err');} }
  async function enable(id){ try{await LJ.post('/members/'+id+'/enable');await load();window.LJToast('已启用成员');}catch(e){window.LJToast(e.message,'err');} }
  async function removeM(id,name){ if(!(await window.LJConfirm({title:'移除成员',body:`移除「<b style="color:var(--t1)">${esc(name)}</b>」?此操作不可恢复,并释放其创作席位。`,confirmText:'移除',danger:true})))return; try{await LJ.del('/members/'+id);await load();window.LJToast('已移除成员');}catch(e){window.LJToast(e.message,'err');} }

  // 改角色:清晰单选弹窗(复用 .ir-opt 分段控件,与邀请一致)。
  let roleTargetId=null, roleNewRole=null, roleCur=null;
  function pickNewRole(b){
    roleNewRole=b.dataset.r;
    b.parentNode.querySelectorAll('.ir-opt').forEach(x=>{x.classList.remove('active');x.setAttribute('aria-pressed','false');});
    b.classList.add('active'); b.setAttribute('aria-pressed','true');
    document.getElementById('roleDesc').textContent=ROLE_DESC[roleNewRole]
      + (roleNewRole==='creator' ? ' 升为创作者会占用一个创作席位。' : '');
  }
  function openRole(id,name,cur){
    roleTargetId=id; roleCur=cur; roleNewRole=null;
    document.getElementById('roleWho').innerHTML=`成员「<b style="color:var(--t1)">${esc(name)}</b>」当前为 <b style="color:var(--t1)">${ROLE_CN[cur]}</b>,选择新角色:`;
    document.getElementById('roleMsg').textContent='';
    document.getElementById('roleDesc').textContent='';
    // 当前角色按钮置灰(选它无意义),其余可选,初始不选中
    document.querySelectorAll('#roleSeg .ir-opt').forEach(b=>{
      const isCur=b.dataset.r===cur;
      b.classList.remove('active'); b.setAttribute('aria-pressed','false');
      b.disabled=isCur; b.style.opacity=isCur?'.4':''; b.style.cursor=isCur?'not-allowed':'pointer';
    });
    document.getElementById('ov-role').style.display='grid';
  }
  async function submitRole(){
    const msg=document.getElementById('roleMsg'); msg.style.color='var(--red)';
    if(!roleNewRole){ msg.textContent='请选择新角色'; return; }
    if(roleNewRole===roleCur){ msg.textContent='与当前角色相同'; return; }
    const btn=document.getElementById('roleSubmit'); btn.disabled=true; btn.textContent='保存中…';
    try{
      await LJ.put('/members/'+roleTargetId+'/role',{role:roleNewRole});
      document.getElementById('ov-role').style.display='none';
      window.LJToast('已改为'+ROLE_CN[roleNewRole]);
      await load();
    }catch(e){ msg.textContent=e.message; }  // 含 SEATS_FULL / LAST_ADMIN 文案(后端带 code)
    finally{ btn.disabled=false; btn.textContent='保存'; }
  }

  async function load(){
    skeleton();
    try{
      const me = await LJ.me(); myRole = me.role; myId = me.id;
      if(myRole!=='admin'){
        document.getElementById('inviteBtn').style.display='none';
        document.getElementById('statRow').innerHTML='';
        body.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--t4);padding:40px">仅管理员可查看成员列表</td></tr>`;
        return;
      }
      const data = await LJ.get('/members');   // { members, seats }
      members = data.members||[]; seats = data.seats||null;
      renderStats(me.tenantName);
      render(curFilter);
    }catch(e){
      if(e && e.status===401) return;  // 已跳转登录
      errorRow();
    }
  }
  load();
</script>
</body>
</html>

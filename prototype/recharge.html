  <style>
    /* ── 充值页(只选套餐 → 提交订单 → 收银台)── */
    .rc-grid{ display:grid; grid-template-columns:1fr 320px; gap:20px; align-items:start; }
    .rc-sec{ font-size:12px; color:var(--t3); font-weight:700; text-transform:uppercase; letter-spacing:.6px; font-family:var(--f-en,'Manrope',sans-serif); margin-bottom:12px; }
    .rc-plan{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:10px; display:flex; align-items:center; gap:14px; cursor:pointer; transition:border-color .15s,background .15s; }
    .rc-plan:hover{ border-color:var(--line-hi); }
    .rc-plan.sel{ border-color:var(--gold-line); background:linear-gradient(180deg,var(--gold-bg),transparent); box-shadow:var(--gold-glow); }
    .rc-radio{ width:18px; height:18px; border-radius:999px; border:2px solid var(--line-hi); flex-shrink:0; }
    .rc-plan.sel .rc-radio{ border-color:var(--gold); background:radial-gradient(circle,#fff 3.5px,var(--gold) 4.5px); }
    .rc-pn{ font-size:14px; font-weight:600; }
    .rc-pc{ font-size:12px; color:var(--t2); margin-top:3px; }
    .rc-pc .rc-bonus{ color:var(--green); background:rgba(52,199,89,.12); font-weight:700; margin-left:6px; padding:1px 7px; border-radius:999px; }
    .rc-price{ margin-left:auto; font-size:22px; font-weight:800; font-family:var(--f-en,'Manrope',sans-serif); }
    .rc-price .rc-cur{ font-size:14px; color:var(--gold); font-weight:700; }
    .rc-hint{ font-size:12px; color:var(--t4); margin-top:8px; line-height:1.6; }
    .rc-empty{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:36px; text-align:center; color:var(--t4); font-size:13px; }
    /* 右栏:下单摘要 */
    .rc-cart{ background:var(--card-hi); border:1px solid var(--line); border-radius:16px; padding:22px; position:sticky; top:24px; }
    .rc-cart h3{ font-size:14px; font-weight:700; margin-bottom:16px; }
    .rc-crow{ display:flex; justify-content:space-between; align-items:baseline; padding:8px 0; font-size:13px; }
    .rc-crow .k{ color:var(--t3); }
    .rc-crow .v{ color:var(--t1); font-weight:600; }
    .rc-crow .v .cr{ color:var(--green); }
    .rc-amt{ display:flex; justify-content:space-between; align-items:baseline; margin:14px 0 4px; padding-top:14px; border-top:1px solid var(--line-soft); }
    .rc-amt .k{ color:var(--t2); font-size:13px; }
    .rc-amt .v{ font-size:28px; font-weight:800; color:var(--green); font-family:var(--f-en,'Manrope',sans-serif); }
    .rc-btn{ width:100%; margin-top:16px; background:var(--gold-grad); color:#3A2A06; border:none; border-radius:999px; padding:13px; font-size:15px; font-weight:700; font-family:inherit; cursor:pointer; min-height:46px; box-shadow:var(--gold-glow); transition:filter .15s; }
    .rc-btn:hover:not(:disabled){ filter:brightness(1.06); }
    .rc-btn:disabled{ opacity:.5; cursor:not-allowed; box-shadow:none; }
    .rc-muted{ color:var(--t4); font-size:11px; text-align:center; margin-top:10px; line-height:1.6; }
    @media (max-width:760px){
      .rc-grid{ grid-template-columns:1fr; }
      .rc-cart{ position:fixed; left:0; right:0; bottom:0; top:auto; border-radius:0; border-bottom:none; border-left:none; border-right:none; padding:14px 16px env(safe-area-inset-bottom,14px); display:flex; align-items:center; gap:12px; z-index:30; }
      .rc-cart h3,.rc-crow,.rc-amt .k{ display:none; }
      .rc-cart .rc-amt{ margin:0; padding:0; border:none; flex-direction:column; align-items:flex-start; }
      .rc-cart .rc-amt .v{ font-size:20px; }
      .rc-btn{ width:auto; flex:1; margin:0; }
      body{ padding-bottom:80px; }
    }
  </style>

  <script>
    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
    function fmtN(n){ return (n||0).toLocaleString('zh-CN'); }

    let PLANS = [], selectedId = null, submitting = false;

    async function load(){
      try{
        const { plans } = await LJ.get('/pricing-plans');
        PLANS = (plans||[]).filter(p => p.priceYuan != null); // 面议套餐不可直接充值
        if(PLANS.length) selectedId = PLANS[0].id;
        renderPlans(); renderSummary();
      }catch(e){
        document.getElementById('rcPlans').innerHTML = '<div class="rc-empty">套餐加载失败,请刷新重试。</div>';
      }
    }

    function renderPlans(){
      const box = document.getElementById('rcPlans');
      if(!PLANS.length){ box.innerHTML = '<div class="rc-empty">暂无可购套餐,请联系平台运营开通。</div>'; return; }
      box.innerHTML = PLANS.map(p => {
        const sel = p.id === selectedId ? ' sel' : '';
        const bonus = p.bonusCredits>0 ? `<span class="rc-bonus">+${fmtN(p.bonusCredits)} 赠</span>` : '';
        return `<div class="rc-plan${sel}" data-id="${esc(p.id)}">
          <div class="rc-radio"></div>
          <div><div class="rc-pn">${esc(p.name)}</div><div class="rc-pc">◆ ${fmtN(p.credits)} 积分${bonus}</div></div>
          <div class="rc-price"><span class="rc-cur">¥</span>${fmtN(p.priceYuan)}</div>
        </div>`;
      }).join('');
      box.querySelectorAll('.rc-plan').forEach(el => el.onclick = () => { selectedId = el.dataset.id; renderPlans(); renderSummary(); });
    }

    function plan(){ return PLANS.find(p => p.id === selectedId); }

    function renderSummary(){
      const box = document.getElementById('rcSummary');
      const p = plan();
      if(!p){ box.innerHTML = '<div class="rc-muted">请先选择套餐</div>'; return; }
      const total = p.credits + p.bonusCredits;
      box.innerHTML = `
        <div class="rc-crow"><span class="k">套餐</span><span class="v">${esc(p.name)}</span></div>
        <div class="rc-crow"><span class="k">到账积分</span><span class="v"><span class="cr">${fmtN(total)}</span></span></div>
        ${p.bonusCredits>0?`<div class="rc-crow"><span class="k">含赠送</span><span class="v cr">+${fmtN(p.bonusCredits)}</span></div>`:''}
        <div class="rc-amt"><span class="k">应付金额</span><span class="v">¥${fmtN(p.priceYuan)}</span></div>
        <button class="rc-btn" id="rcSubmit">提交订单</button>
        <div class="rc-muted">提交后前往收银台完成对公转账。</div>`;
      document.getElementById('rcSubmit').onclick = submit;
    }

    async function submit(){
      const p = plan(); if(!p || submitting) return;
      submitting = true;
      const btn = document.getElementById('rcSubmit'); if(btn){ btn.disabled = true; btn.textContent = '提交中…'; }
      try{
        const { order } = await LJ.post('/orders', { planId: p.id });
        location.href = 'pay.html?order=' + encodeURIComponent(order.id);
      }catch(e){
        submitting = false;
        if(btn){ btn.disabled = false; btn.textContent = '提交订单'; }
        window.LJToast(e.message || '下单失败','err');
      }
    }

    load();
  </script>

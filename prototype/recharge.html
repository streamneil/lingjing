<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>对公充值 · 灵镜</title>
  <link rel="icon" type="image/svg+xml" href="/brand/lingjing-favicon.svg">
  <link rel="stylesheet" href="app.css">
  <style>
    /* ── 对公充值页 ── */
    .rc-grid{ display:grid; grid-template-columns:1fr 380px; gap:20px; align-items:start; }
    .rc-sec{ font-size:12px; color:var(--t3); font-weight:700; text-transform:uppercase; letter-spacing:.6px; font-family:var(--f-en,'Manrope',sans-serif); margin-bottom:12px; }
    .rc-plan{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:10px; display:flex; align-items:center; gap:14px; cursor:pointer; transition:border-color .15s,background .15s; }
    .rc-plan:hover{ border-color:var(--line-hi); }
    .rc-plan.sel{ border-color:var(--blue); background:linear-gradient(180deg,rgba(77,141,255,.06),transparent); }
    .rc-radio{ width:18px; height:18px; border-radius:999px; border:2px solid var(--line-hi); flex-shrink:0; }
    .rc-plan.sel .rc-radio{ border-color:var(--blue); background:radial-gradient(circle,#fff 3.5px,var(--blue) 4.5px); }
    .rc-pn{ font-size:14px; font-weight:600; }
    .rc-pc{ font-size:12px; color:var(--t2); margin-top:3px; }
    .rc-pc .rc-bonus{ color:var(--green); margin-left:4px; }
    .rc-price{ margin-left:auto; font-size:22px; font-weight:800; font-family:var(--f-en,'Manrope',sans-serif); }
    .rc-price .rc-cur{ font-size:14px; color:var(--t2); }
    .rc-hint{ font-size:12px; color:var(--t4); margin-top:8px; line-height:1.6; }
    .rc-empty{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:36px; text-align:center; color:var(--t4); font-size:13px; }
    /* 右栏对公卡 */
    .rc-pay{ background:var(--card-hi); border:1px solid var(--line); border-radius:16px; padding:22px; position:sticky; top:24px; }
    .rc-steps{ display:flex; gap:8px; margin-bottom:16px; font-size:11px; }
    .rc-step{ flex:1; text-align:center; padding:6px 4px; border-radius:8px; background:var(--field); color:var(--t4); }
    .rc-step.on{ background:var(--blue-bg); color:#9EC1FF; font-weight:700; }
    .rc-pay h3{ font-size:15px; font-weight:700; margin-bottom:16px; }
    .rc-row{ display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line-soft); font-size:13px; gap:12px; }
    .rc-row .rc-k{ color:var(--t3); flex-shrink:0; }
    .rc-row .rc-v{ color:var(--t1); font-weight:600; text-align:right; word-break:break-all; }
    .rc-row .rc-mono{ font-family:var(--f-mono,'SF Mono',Menlo,monospace); font-size:12.5px; }
    .rc-copy{ margin-left:8px; color:var(--blue); font-size:11px; cursor:pointer; border:1px solid var(--blue); border-radius:6px; padding:1px 6px; background:none; min-height:24px; }
    .rc-amt{ display:flex; justify-content:space-between; align-items:baseline; margin:16px 0 6px; }
    .rc-amt .rc-k{ color:var(--t2); font-size:13px; }
    .rc-amt .rc-v{ font-size:30px; font-weight:800; color:var(--green); font-family:var(--f-en,'Manrope',sans-serif); }
    .rc-ordno{ font-size:11px; color:var(--t4); font-family:var(--f-mono,monospace); }
    .rc-tip{ background:var(--blue-bg); border:1px solid rgba(77,141,255,.25); border-radius:10px; padding:10px 12px; font-size:12px; color:#9EC1FF; line-height:1.6; margin:16px 0; }
    .rc-btn{ width:100%; background:var(--blue); color:#fff; border:none; border-radius:999px; padding:13px; font-size:15px; font-weight:700; font-family:inherit; cursor:pointer; min-height:46px; }
    .rc-btn:disabled{ opacity:.5; cursor:not-allowed; }
    .rc-upload{ margin-top:10px; border:1px dashed var(--line-hi); border-radius:12px; padding:14px; text-align:center; color:var(--t3); font-size:12px; cursor:pointer; min-height:44px; background:none; width:100%; font-family:inherit; }
    .rc-upload b{ color:var(--blue); }
    .rc-upload.has{ border-color:var(--green); color:var(--green); }
    .rc-muted{ color:var(--t4); font-size:11px; text-align:center; margin-top:10px; line-height:1.6; }
    .rc-notcfg{ color:var(--t4); font-size:12px; text-align:center; padding:24px; line-height:1.7; }
    @media (max-width:760px){
      .rc-grid{ grid-template-columns:1fr; }
      .rc-pay{ position:static; }
      /* 移动端:应付金额 + 我已打款 变底部 sticky 条 */
      .rc-mobile-bar{ position:fixed; left:0; right:0; bottom:0; background:var(--card-hi); border-top:1px solid var(--line); padding:12px 16px env(safe-area-inset-bottom,12px); display:flex; gap:12px; align-items:center; z-index:30; }
      .rc-mobile-bar .rc-mb-amt{ font-size:20px; font-weight:800; color:var(--green); }
      .rc-mobile-bar .rc-btn{ flex:1; width:auto; }
      body{ padding-bottom:72px; }
    }
    @media (min-width:761px){ .rc-mobile-bar{ display:none; } }
  </style>
</head>

<body data-page="recharge" data-crumb="账户 > 充值">
  <div class="shell" id="shell-mount">
    <div class="main-col">
      <main class="page">
        <div class="ph">
          <div><h1 class="t-h1">对公充值</h1><p class="desc">对公采购,积分有效期 1 年,用多少扣多少。线下打款,平台核对到账后积分自动入账。</p></div>
        </div>

        <div class="rc-grid">
          <!-- 左:选择套餐 -->
          <div>
            <div class="rc-sec">选择套餐</div>
            <div id="rcPlans"><div class="rc-empty">加载中…</div></div>
            <div class="rc-hint">套餐由平台运营在后台配置(名称/价格/积分/赠送)。如需更大额度或私有化,请联系客户成功经理。</div>
          </div>

          <!-- 右:对公转账信息 -->
          <div class="rc-pay" id="rcPay">
            <div class="rc-steps">
              <div class="rc-step on">① 待打款</div>
              <div class="rc-step">② 待确认</div>
              <div class="rc-step">③ 已到账</div>
            </div>
            <h3>对公转账信息</h3>
            <div id="rcPayee"><div class="rc-notcfg">对公收款信息加载中…</div></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="shell.js"></script>
  <script src="api.js"></script>
  <script>
    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
    function fmtN(n){ return (n||0).toLocaleString('zh-CN'); }

    let PLANS = [];
    let PAYEE = null;
    let selectedId = null;

    async function load(){
      try{
        const [{ plans }, payee] = await Promise.all([ LJ.get('/pricing-plans'), LJ.get('/payee-info') ]);
        PLANS = (plans||[]).filter(p => p.priceYuan != null); // 面议套餐不可直接充值
        PAYEE = payee;
        if(PLANS.length){ selectedId = PLANS[0].id; }
        renderPlans();
        renderPay();
      }catch(e){
        document.getElementById('rcPlans').innerHTML = '<div class="rc-empty">套餐加载失败,请刷新重试。</div>';
      }
    }

    function renderPlans(){
      const box = document.getElementById('rcPlans');
      if(!PLANS.length){ box.innerHTML = '<div class="rc-empty">暂无可购套餐,请联系平台运营开通。</div>'; return; }
      box.innerHTML = PLANS.map(p => {
        const sel = p.id === selectedId ? ' sel' : '';
        const bonus = p.bonusCredits>0 ? `<span class="rc-bonus">+${fmtN(p.bonusCredits)} 赠</span>` : '';
        return `<div class="rc-plan${sel}" data-id="${esc(p.id)}">
          <div class="rc-radio"></div>
          <div><div class="rc-pn">${esc(p.name)}</div><div class="rc-pc">◆ ${fmtN(p.credits)} 积分${bonus}</div></div>
          <div class="rc-price"><span class="rc-cur">¥</span>${fmtN(p.priceYuan)}</div>
        </div>`;
      }).join('');
      box.querySelectorAll('.rc-plan').forEach(el => el.onclick = () => { selectedId = el.dataset.id; renderPlans(); renderPay(); });
    }

    function plan(){ return PLANS.find(p => p.id === selectedId); }

    function renderPay(){
      const box = document.getElementById('rcPayee');
      if(!PAYEE || !PAYEE.configured){
        box.innerHTML = '<div class="rc-notcfg">平台尚未配置对公收款账户,<br>请联系平台运营开通后再充值。</div>';
        return;
      }
      const p = plan();
      const totalCredits = p ? (p.credits + p.bonusCredits) : 0;
      box.innerHTML = `
        <div class="rc-row"><span class="rc-k">收款户名</span><span class="rc-v">${esc(PAYEE.payeeName)}</span></div>
        ${PAYEE.taxNo?`<div class="rc-row"><span class="rc-k">税号</span><span class="rc-v rc-mono">${esc(PAYEE.taxNo)}</span></div>`:''}
        <div class="rc-row"><span class="rc-k">开户银行</span><span class="rc-v">${esc(PAYEE.bankName)}</span></div>
        <div class="rc-row"><span class="rc-k">银行账号</span><span class="rc-v rc-mono">${esc(PAYEE.bankAccount)}<button class="rc-copy" id="rcCopy" aria-label="复制银行账号">复制</button></span></div>
        <div class="rc-amt"><span class="rc-k">应付金额</span><span class="rc-v">${p?('¥'+fmtN(p.priceYuan)):'—'}</span></div>
        <div class="rc-ordno">${p?`到账 ${fmtN(p.credits)}${p.bonusCredits>0?' + '+fmtN(p.bonusCredits)+' 赠':''} = ${fmtN(totalCredits)} 积分`:'请先选择套餐'}</div>
        <div class="rc-tip">⚠ 请务必使用<b>对公账户</b>转账。到账后点击下方按钮提交,平台核对后积分自动入账(1 个工作日内)。</div>
        <button class="rc-btn" id="rcGo" ${p?'':'disabled'}>生成订单并打款</button>
        <div class="rc-muted">生成订单后可在「充值订单」查看进度、上传回单。</div>
        <div class="rc-mobile-bar"><div class="rc-mb-amt">${p?('¥'+fmtN(p.priceYuan)):'—'}</div><button class="rc-btn" id="rcGoM" ${p?'':'disabled'}>生成订单</button></div>
      `;
      const copy = document.getElementById('rcCopy');
      if(copy) copy.onclick = async () => { try{ await navigator.clipboard.writeText(PAYEE.bankAccount); window.LJToast('✓ 账号已复制'); }catch{ window.LJToast('复制失败,请手动选择','err'); } };
      const go = document.getElementById('rcGo'); if(go) go.onclick = createOrder;
      const goM = document.getElementById('rcGoM'); if(goM) goM.onclick = createOrder;
    }

    async function createOrder(){
      const p = plan(); if(!p) return;
      try{
        const { order } = await LJ.post('/orders', { planId: p.id });
        // 跳订单台账,高亮本单
        location.href = 'orders.html?new=' + encodeURIComponent(order.id);
      }catch(e){ window.LJToast(e.message || '下单失败','err'); }
    }

    load();
  </script>
</body>
</html>

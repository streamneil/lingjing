<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文字转语音 · 灵镜</title>
<link rel="icon" type="image/svg+xml" href="/brand/lingjing-favicon.svg">
<link rel="stylesheet" href="app.css">
<style>
  .voice-pick { display:flex; align-items:center; gap:13px; padding:14px 16px; border:1px solid var(--line); border-radius:var(--r); background:var(--card); cursor:pointer; transition:.15s; }
  .voice-pick:hover { border-color:var(--line-hi); }
  .voice-pick .vi { width:42px; height:42px; border-radius:11px; background:var(--field); border:1px solid var(--line); display:grid; place-items:center; flex-shrink:0; }
  .voice-pick .vi svg { width:20px; height:20px; color:var(--t2); }
  .voice-pick h5 { font-size:14.5px; font-weight:600; color:var(--t1); }
  .voice-pick p { font-size:12px; color:var(--t4); margin-top:2px; }
  .voice-pick .ar svg { width:18px; height:18px; color:var(--t4); }

  /* 音色面板复用共享 sheet-side / ss-head / ss-seg / vcard(app.css,与 create.html 一致);
     仅覆盖:窄单列(合成器内选音色,非整页素材库)+ 新增(筛选 / 试听 / 设计入口)。 */
  #sheet-voices { width:min(480px,92vw); }   /* 共享面板默认宽 64vw,这里收窄成单列选择器 */
  #sheet-voices .ss-head { gap:10px; padding:22px 22px 14px; flex-wrap:wrap; }  /* 窄面板:收紧 gutter */
  #sheet-voices .ss-head h3 { font-size:17px; white-space:nowrap; }  /* 不换行 */
  #sheet-voices .ss-filters { padding:0 22px 14px; }
  #sheet-voices .ss-body { grid-template-columns:1fr; padding:0 22px 22px; }  /* 单列 + 收紧 gutter */
  /* 设计弹窗从面板内打开,须盖在面板(.sheet-side z110)之上 */
  #ov-design { z-index:320; }
  /* 面板遮罩(.ov 不带,侧滑面板自配一层):对齐系统 .ov 配方 */
  .vsheet-ov { position:fixed; inset:0; background:rgba(4,4,5,.66); backdrop-filter:blur(8px); display:none; z-index:105; }
  .vsheet-ov.on { display:block; }
  /* 语言/性别 筛选下拉 */
  .vfilter { padding:9px 13px; background:var(--field); border:1px solid var(--line); border-radius:10px; color:var(--t2); font-size:13px; cursor:pointer; font-family:var(--f); }
  /* .vcard 圆形试听键:复用 .vc-p 视觉,补 44px 触点 + 真按钮 + focus + 禁用态 */
  #sheet-voices .vc-play { width:44px; height:44px; }
  #sheet-voices .vc-play:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
  #sheet-voices .vc-play[disabled] { opacity:.35; cursor:not-allowed; }
  #sheet-voices .vcard:focus-visible { outline:2px solid var(--blue); outline-offset:-1px; }
  #sheet-voices .vcard.on { background:var(--card-hi); border-color:var(--blue); }  /* 选中态(共享 .vcard 无,补) */
  /* 设计弹窗维度芯片 */
  .vd-dims { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 4px; }
  .vd-dim { font-size:11px; padding:4px 9px; border-radius:var(--r-sm); background:var(--field); border:1px solid var(--line); color:var(--t3); cursor:pointer; transition:.15s; }
  .vd-dim:hover { border-color:var(--line-hi); color:var(--t1); }
  .vd-preview { margin-top:12px; }

  .sld-row { display:flex; align-items:center; gap:12px; padding:11px 14px; background:var(--field); border:1px solid var(--line); border-radius:var(--r); }
  .sld-row .lbl { font-size:13px; color:var(--t3); width:36px; }
  .sld-row input[type=range] { flex:1; }
  .sld-row .val { font-family:var(--f-mono); font-size:12.5px; color:var(--t2); width:42px; text-align:right; }
  .cfg-label { font-size:12px; color:var(--t3); margin:14px 0 7px; }
</style>
</head>
<body data-page="tts" data-crumb="创作工具 > 文字转语音">
<div class="shell" id="shell-mount">
 <div class="main-col">
  <div class="studio">
  <!-- 左:配置 -->
  <div class="cfg">
    <div class="cfg-h"><span class="dot"></span>文字转语音</div>

    <div class="script">
      <textarea id="text" maxlength="6000" placeholder="输入需要配音的文字…（≤6000 字）"></textarea>
      <div class="f"><span class="h" id="estLabel">预估 — 点</span><span class="c"><b id="cnt">0</b> / 6000</span></div>
    </div>

    <div class="cfg-label">声音</div>
    <div class="voice-pick" id="voicePick" onclick="openVoices()">
      <div class="vi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 11v2M8 7v10M12 4v16M16 8v8M20 11v2"/></svg></div>
      <div style="flex:1"><h5 id="voiceName">选择音色</h5><p id="voiceDesc">从音色库选择或克隆一个声音</p></div>
      <div class="ar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg></div>
    </div>

    <div class="cfg-label">语速</div>
    <div class="sld-row"><span class="lbl">速度</span><input type="range" id="rate" min="0.5" max="2" step="0.1" value="1"><span class="val" id="rateVal">1.0×</span></div>
    <div class="cfg-label">音量</div>
    <div class="sld-row"><span class="lbl">音量</span><input type="range" id="volume" min="0" max="100" step="5" value="50"><span class="val" id="volVal">50</span></div>

    <div class="cfg-sp"></div>
    <div class="cbtn-wrap">
      <button class="cbtn" id="createBtn">
        <span id="cbtnLabel">创建</span> <span class="gem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M6 3h12l4 6-10 12L2 9l4-6Z"/></svg> <b id="estGem">—</b></span>
      </button>
    </div>
  </div>

  <!-- 右:作品流(音频) -->
  <div class="feed">
    <div class="feed-tabs">
      <button class="ftab active" data-st="all">全部</button>
      <button class="ftab" data-st="running">生成中</button>
      <button class="ftab" data-st="done">已完成</button>
      <button class="ftab" data-st="failed">失败</button>
    </div>
    <div class="feed-list">
      <div class="fitem feed-empty" id="feedEmpty">
        <div class="feed-empty-in">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 11v2M8 7v10M12 4v16M16 8v8M20 11v2"/></svg>
          <div class="t">还没有配音</div>
          <div class="s">输入文字,选好音色,点「创建」就能生成第一条配音。</div>
        </div>
      </div>
    </div>
  </div>
 </div>
</div>

<!-- 音色选择 sheet(复用共享 .sheet-side/.ss-*/.vcard,与 create.html 一致)-->
<div class="vsheet-ov" id="vsheetOv" onclick="closeVoices()"></div>
<div class="sheet-side" id="sheet-voices">
  <div class="ss-head">
    <h3>所有声音</h3>
    <div class="sp"></div>
    <div class="ss-seg" role="tablist" aria-label="音色来源">
      <button class="active" data-tab="preset" role="tab" aria-selected="true" onclick="switchVTab('preset')">音色库</button>
      <button data-tab="mine" role="tab" aria-selected="false" onclick="switchVTab('mine')">我的声音</button>
    </div>
    <button class="btn btn-dark" onclick="openDesign()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" style="width:15px;height:15px"><path d="M4 11v2M8 7v10M12 4v16M16 8v8M20 11v2"/></svg>复制或设计</button>
    <div class="x" onclick="closeVoices()" role="button" tabindex="0" aria-label="关闭" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();closeVoices();}" style="cursor:pointer;color:var(--t3)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:22px;height:22px"><path d="M18 6 6 18M6 6l12 12"/></svg></div>
  </div>
  <div class="ss-filters">
    <select class="vfilter" id="vfLang" aria-label="按语言筛选" onchange="renderVoices()"><option value="">语言:全部</option><option value="中文">中文</option><option value="英文">英文</option></select>
    <select class="vfilter" id="vfGender" aria-label="按性别筛选" onchange="renderVoices()"><option value="">性别:全部</option><option value="女">女</option><option value="男">男</option></select>
  </div>
  <div class="ss-body" id="vsheetBody"><div style="color:var(--t4);padding:20px">加载音色中…</div></div>
</div>

<!-- 声音设计弹窗 -->
<div class="ov" id="ov-design"><div class="modal">
  <div class="mh"><h3>设计音色</h3><div class="mc" onclick="closeModal('design')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></div></div>
  <div class="mb">
    <div class="iline"><label>音色名称</label><input id="dgName" placeholder="例如:温柔知性女声" maxlength="40" oninput="refreshDgBtn()"></div>
    <div class="cfg-label" style="margin-top:2px">声音描述(越具体越精准,≤2048 字)</div>
    <textarea id="dgPrompt" maxlength="2048" placeholder="例如:年轻活泼的女性声音,语速较快,带有明显的上扬语调,适合介绍时尚产品。" style="width:100%;min-height:84px;padding:11px 13px;background:var(--field);border:1px solid var(--line);border-radius:10px;color:var(--t1);font-size:13px;resize:vertical" oninput="refreshDgBtn()"></textarea>
    <div class="vd-dims" id="dgDims"></div>
    <div class="vd-preview" id="dgPreview" style="display:none"></div>
    <button class="btn btn-white" id="dgSubmitBtn" style="width:100%;padding:14px;font-size:15px;margin-top:12px" onclick="submitDesign()">生成音色</button>
  </div>
</div></div>

<script src="shell.js"></script>
<script src="tools.js"></script>
<script src="api.js"></script>
<script>
  const ta=document.getElementById('text'), cnt=document.getElementById('cnt'), btn=document.getElementById('createBtn');
  const feedList=document.querySelector('.feed-list');
  let selectedVoice=null; // {id,name,desc}

  function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  // 语速/音量
  const rate=document.getElementById('rate'), vol=document.getElementById('volume');
  rate.oninput=()=>document.getElementById('rateVal').textContent=parseFloat(rate.value).toFixed(1)+'×';
  vol.oninput=()=>document.getElementById('volVal').textContent=vol.value;

  // ── 音色 sheet:音色库/我的声音 Tab + 语言/性别筛选 + 逐音色试听 ──
  const PLAY_SVG=window.LJAudioPreview.PLAY_SVG;
  let vsData={presets:[],clones:[]};   // /voices 原始数据
  let vTab='preset';                   // 当前 Tab:preset | mine
  function openModal(id){ document.getElementById('ov-'+id)?.classList.add('show'); }
  function closeModal(id){ document.getElementById('ov-'+id)?.classList.remove('show'); }
  window.openModal=openModal; window.closeModal=closeModal;

  function openVoices(){ document.getElementById('vsheetOv').classList.add('on'); document.getElementById('sheet-voices').classList.add('show'); loadVoices(); }
  function closeVoices(){ window.LJAudioPreview.stop(); document.getElementById('vsheetOv').classList.remove('on'); document.getElementById('sheet-voices').classList.remove('show'); }
  function switchVTab(t){ vTab=t; document.querySelectorAll('#sheet-voices .ss-seg button').forEach(b=>{ const on=b.dataset.tab===t; b.classList.toggle('active',on); b.setAttribute('aria-selected',on?'true':'false'); }); renderVoices(); }

  async function loadVoices(){
    const body=document.getElementById('vsheetBody');
    body.innerHTML='<div style="color:var(--t4);padding:20px">加载音色中…</div>';
    try{
      vsData=await LJ.get('/voices');
      renderVoices();
      // 默认选中:首个可用音色(优先当前 Tab)
      if(!selectedVoice){ const first=currentList()[0]; if(first) pickVoiceObj(first,true); }
    }catch(e){ body.innerHTML='<div style="color:var(--red);padding:20px">音色加载失败</div>'; }
  }
  function currentList(){
    if(vTab==='mine') return (vsData.clones||[]).filter(v=>v.status==='ready');
    return vsData.presets||[];
  }
  function renderVoices(){
    window.LJAudioPreview.stop();
    const body=document.getElementById('vsheetBody');
    const lang=document.getElementById('vfLang').value, gender=document.getElementById('vfGender').value;
    let list=currentList();
    // 筛选(预置有 lang/gender;自建音色无,语言/性别筛选时排除)
    if(lang) list=list.filter(v=>(v.lang||'')===lang);
    if(gender) list=list.filter(v=>(v.gender||'')===gender);
    if(!list.length){
      body.innerHTML=`<div style="color:var(--t4);padding:30px;text-align:center">${vTab==='mine'?'还没有自己的声音,点「复制或设计」创建一个':'没有符合筛选的音色'}</div>`;
      return;
    }
    body.innerHTML=list.map(v=>{
      const isMine=vTab==='mine';
      const kindLabel=v.kind==='design'?'设计音色':(v.kind==='clone'?'克隆音色':'');
      const desc=isMine?kindLabel:`${[v.gender,v.lang].filter(Boolean).join(' · ')}${v.desc?' · '+v.desc:''}`;
      const hot=(!isMine)?' <span class="hot">预置</span>':'';
      const on=selectedVoice&&selectedVoice.id===v.id;
      const canPlay=!!v.sample;
      // 复用共享 .vcard/.vc-* + .vc-p.vc-play(圆形试听槽);保留真试听 + 键盘 a11y
      const play=`<button class="vc-p vc-play" data-src="${esc(v.sample||'')}" ${canPlay?'':'disabled'} onclick="event.stopPropagation();window.LJAudioPreview.play(this.dataset.src,this)" aria-label="试听">${PLAY_SVG}</button>`;
      const pick=`pickVoiceObj(${JSON.stringify({id:v.id,name:v.name,desc}).replace(/'/g,"&#39;")})`;
      return `<div class="vcard${on?' on':''}" data-id="${esc(v.id)}" role="button" tabindex="0" aria-pressed="${on?'true':'false'}" aria-label="选择音色 ${esc(v.name)}" onclick='${pick}' onkeydown='if(event.key==="Enter"||event.key===" "){event.preventDefault();${pick};}'>`
        +`<div class="vc-b"><div class="vc-n"><span class="flag">🇨🇳</span>${esc(v.name)}${hot}</div><div class="vc-d">${esc(desc)}</div></div>${play}</div>`;
    }).join('');
  }
  window.pickVoiceObj=(v, silent)=>{
    selectedVoice={id:v.id,name:v.name,desc:v.desc};
    document.getElementById('voiceName').textContent=v.name;
    document.getElementById('voiceDesc').textContent=v.desc||'已选择';
    document.querySelectorAll('#vsheetBody .vcard').forEach(c=>c.classList.toggle('on', c.dataset.id===v.id));
    if(!silent) closeVoices(); refreshBtn();
  };
  window.openVoices=openVoices; window.closeVoices=closeVoices; window.switchVTab=switchVTab; window.renderVoices=renderVoices;

  // ── 声音设计弹窗(E7)──
  const DG_DIMS=['年轻女声','沉稳男声','温柔','活泼','磁性','播音腔','语速偏快','适合有声书'];
  function openDesign(){
    document.getElementById('dgName').value=''; document.getElementById('dgPrompt').value='';
    document.getElementById('dgPreview').style.display='none'; document.getElementById('dgPreview').innerHTML='';
    document.getElementById('dgDims').innerHTML=DG_DIMS.map(d=>`<span class="vd-dim" onclick="addDgDim('${d}')">${d}</span>`).join('');
    refreshDgBtn(); openModal('design');
    setTimeout(()=>document.getElementById('dgName').focus(),60);
  }
  window.addDgDim=(d)=>{ const t=document.getElementById('dgPrompt'); t.value=(t.value?t.value.replace(/[，。]?$/,'，'):'')+d; refreshDgBtn(); t.focus(); };
  function refreshDgBtn(){
    const btn=document.getElementById('dgSubmitBtn');
    const name=document.getElementById('dgName').value.trim(), prompt=document.getElementById('dgPrompt').value.trim();
    let ok=true, txt='生成音色';
    if(!name){ ok=false; txt='请输入音色名称'; }
    else if(!prompt){ ok=false; txt='请输入声音描述'; }
    btn.disabled=!ok; btn.textContent=txt;
  }
  async function submitDesign(){
    const btn=document.getElementById('dgSubmitBtn'); if(btn.disabled) return;
    const name=document.getElementById('dgName').value.trim(), voicePrompt=document.getElementById('dgPrompt').value.trim();
    btn.disabled=true; btn.textContent='生成中…';
    try{
      const r=await LJ.post('/voices/design',{name,voicePrompt});
      // 预览试听
      const pv=document.getElementById('dgPreview');
      if(r.previewUrl){
        pv.style.display=''; pv.innerHTML=`<div class="cfg-label">预览试听</div><audio src="${esc(r.previewUrl)}" controls preload="metadata" style="width:100%"></audio>`;
      }
      window.LJToast&&window.LJToast('✓ 音色「'+name+'」已生成,可在「我的声音」选用');
      await loadVoices(); switchVTab('mine');
      // 自动选中新音色
      pickVoiceObj({id:r.id,name:r.name,desc:'设计音色'}, true);
      setTimeout(()=>closeModal('design'), r.previewUrl?2500:300);
    }catch(e){ window.LJToast&&window.LJToast(e.message||'设计失败','err'); }
    finally{ refreshDgBtn(); }
  }
  window.openDesign=openDesign; window.refreshDgBtn=refreshDgBtn; window.submitDesign=submitDesign;
  // Esc 关设计弹窗
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&document.getElementById('ov-design').classList.contains('show')) closeModal('design'); });

  // 预估
  let estTimer=null;
  function scheduleEstimate(){
    clearTimeout(estTimer);
    estTimer=setTimeout(async()=>{
      if(!ta.value.trim()){ document.getElementById('estLabel').textContent='预估 — 点'; document.getElementById('estGem').textContent='—'; return; }
      try{ const r=await LJ.post('/jobs/estimate',{type:'tts',text:ta.value}); document.getElementById('estLabel').textContent='预估 '+r.cost+' 点'; document.getElementById('estGem').textContent=r.cost; }catch(e){}
    },350);
  }
  function refreshBtn(){
    const hasText=ta.value.trim().length>0;
    let ok=hasText, label='创建';
    if(!selectedVoice){ ok=false; label='请选择音色'; }
    else if(!hasText){ ok=false; label='请输入文字'; }
    btn.classList.toggle('ready',ok); btn.disabled=!ok;
    document.getElementById('cbtnLabel').textContent=label;
  }
  ta.addEventListener('input',()=>{ cnt.textContent=ta.value.length; refreshBtn(); scheduleEstimate(); });

  document.querySelectorAll('.ftab').forEach(t=>t.onclick=function(){
    this.parentNode.querySelectorAll('.ftab').forEach(x=>x.classList.remove('active')); this.classList.add('active');
    const k=this.dataset.st;
    document.querySelectorAll('.feed-list .fitem[id^=job-]').forEach(it=>{ it.style.display=(k==='all'||(it.dataset.st||'')===k)?'':'none'; });
  });

  function renderCard(job){
    document.getElementById('feedEmpty').style.display='none';
    let card=document.getElementById('job-'+job.id);
    if(!card){ card=document.createElement('div'); card.className='fitem'; card.id='job-'+job.id; feedList.insertBefore(card, feedList.firstChild); }
    if(job.status==='queued'||job.status==='running'){
      card.dataset.st='running';
      card.innerHTML=`<div class="fmeta"><b>文字转语音</b><span class="ts">${(window.LJTimeAgo&&LJTimeAgo(job.createdAt))||'刚刚'}</span><span class="sp"></span><span class="st" style="color:var(--amber)"><span class="led led-run"></span>${job.status==='queued'?'排队中':'生成中'}</span></div>
        <div class="fbubble"><div class="tx">${esc(job.text||'')}</div></div>
        <div class="fvideo proc"><div class="proc-in"><div class="spinner"></div><div class="lbl">${job.progress?('进度 '+job.progress+'%'):'已进入生成队列'}</div><div class="proc-bar"><i style="width:${job.progress||8}%"></i></div></div></div>`;
    } else if(job.status==='done'){
      card.dataset.st='done';
      const url=(job.outputUrls||[])[0];
      const player=url ? `<audio src="${url}" controls preload="metadata" style="width:100%;margin-top:6px"></audio>` : '<div style="color:var(--t4);padding:14px">已生成</div>';
      card.innerHTML=`<div class="fmeta"><b>文字转语音</b><span class="ts">${(window.LJTimeAgo&&LJTimeAgo(job.createdAt))||'刚刚'}</span><span class="sp"></span><span class="st" style="color:var(--green)"><span class="led led-ok"></span>已完成</span></div>
        <div class="fbubble"><div class="tx">${esc(job.text||'')}</div></div>${player}`;
    } else {
      card.dataset.st='failed';
      card.innerHTML=`<div class="fmeta"><b>文字转语音</b><span class="ts">${(window.LJTimeAgo&&LJTimeAgo(job.createdAt))||'刚刚'}</span><span class="sp"></span><span class="st" style="color:var(--red)"><span class="led led-err"></span>生成失败</span></div>
        <div class="fbubble"><div class="tx">${esc(job.text||'')}</div></div>
        <div class="fvideo err"><div class="err-in"><div class="ei">!</div><div class="lbl">${esc(job.error||'生成失败,请重试')}</div></div></div>`;
    }
  }

  async function track(id, text){ try{ await LJ.pollJob(id, (job)=>renderCard({...job, text})); }catch(e){} }
  async function loadHistory(){
    let jobs=[]; try{ jobs=await LJ.listJobs(); }catch(e){ return; }
    const mine=jobs.filter(j=>j.type==='tts');
    if(!mine.length) return;
    document.getElementById('feedEmpty').style.display='none';
    for(const j of [...mine].sort((a,b)=>(a.createdAt||0)-(b.createdAt||0))){
      try{ const d=await LJ.getJob(j.id); renderCard({...d, text:(d.input&&d.input.text)||''});
        if(d.status==='queued'||d.status==='running') track(d.id,(d.input&&d.input.text)||'');
      }catch(e){}
    }
  }

  btn.addEventListener('click', async ()=>{
    if(btn.disabled) return;
    const text=ta.value.trim(); if(!text||!selectedVoice) return;
    btn.disabled=true; const prev=btn.innerHTML; btn.textContent='提交中…';
    try{
      const res=await LJ.createJob({ type:'tts', text, voiceRef:selectedVoice.id, rate:parseFloat(rate.value), volume:parseInt(vol.value,10) });
      renderCard({ id:res.id, status:'queued', progress:0, text });
      track(res.id, text);
      ta.value=''; cnt.textContent='0'; scheduleEstimate();
      window.LJToast&&window.LJToast('✓ 已提交生成,可在右侧查看进度');
    }catch(e){ window.LJToast&&window.LJToast('提交失败:'+e.message,'err'); }
    finally{ btn.innerHTML=prev; refreshBtn(); }
  });

  LJ.me().then(()=>loadHistory()).catch(()=>{});
  refreshBtn();
</script>
</body>
</html>

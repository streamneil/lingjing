  <style>
    /* ── 充值订单台账 ── */
    .od-list{ display:flex; flex-direction:column; gap:10px; }
    .od-row{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; }
    .od-row.hl{ border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-bg); }
    .od-top{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .od-no{ font-family:var(--f-mono,monospace); font-size:12px; color:var(--t3); }
    .od-plan{ font-size:14px; font-weight:600; }
    .od-pm{ font-size:11px; color:var(--t3); border:1px solid var(--line); border-radius:999px; padding:2px 9px; }
    .od-ivb{ font-size:11px; font-weight:700; border-radius:999px; padding:2px 9px; border:1px solid; }
    .od-ivb.iv-req{ color:#9EC1FF; border-color:rgba(77,141,255,.4); background:var(--blue-bg); }
    .od-ivb.iv-iss{ color:var(--green); border-color:rgba(52,199,89,.4); background:rgba(52,199,89,.1); }
    .od-amt{ margin-left:auto; font-size:18px; font-weight:800; font-family:var(--f-en,'Manrope',sans-serif); }
    .od-amt .cur{ font-size:12px; color:var(--t2); }
    .od-meta{ font-size:12px; color:var(--t3); margin-top:6px; }
    .od-meta .cr{ color:var(--green); }
    /* 状态徽章(文字+色双编码,色盲可读)*/
    .od-badge{ font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; border:1px solid; }
    .b-pending{ color:var(--t2); border-color:var(--line-hi); background:var(--field); }
    .b-claimed{ color:#9EC1FF; border-color:rgba(77,141,255,.4); background:var(--blue-bg); }
    .b-credited{ color:var(--green); border-color:rgba(52,199,89,.4); background:rgba(52,199,89,.1); }
    .b-rejected{ color:#FF6B6B; border-color:rgba(255,107,107,.4); background:rgba(255,107,107,.1); }
    .b-cancelled{ color:var(--t4); border-color:var(--line); background:transparent; }
    .od-note{ margin-top:10px; font-size:12px; color:#FF9B9B; background:rgba(255,107,107,.08); border:1px solid rgba(255,107,107,.25); border-radius:8px; padding:8px 10px; }
    .od-acts{ margin-top:12px; display:flex; gap:8px; flex-wrap:wrap; }
    .od-act{ font-size:13px; font-weight:600; padding:8px 16px; border-radius:999px; border:1px solid var(--line); background:var(--field); color:var(--t1); cursor:pointer; font-family:inherit; min-height:40px; }
    .od-act:hover{ border-color:var(--line-hi); }
    .od-act.primary{ background:var(--blue); color:#fff; border:none; }
    .od-act.ghost{ background:none; color:var(--t3); }
    .od-empty{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:48px 24px; text-align:center; }
    .od-empty .ee-t{ font-size:15px; font-weight:600; }
    .od-empty .ee-d{ font-size:13px; color:var(--t3); margin:8px 0 18px; }
    .od-empty .ee-b{ display:inline-block; background:var(--blue); color:#fff; border:none; border-radius:999px; padding:11px 24px; font-size:14px; font-weight:700; cursor:pointer; text-decoration:none; min-height:44px; }
  </style>

<div class="main-col">
      <main class="page">
        <div class="ph">
          <div><h1 class="t-h1">充值订单</h1><p class="desc">对公充值订单台账。打款后点「我已打款」,平台核对到账后积分自动入账。</p></div>

  <script src="api.js"></script>
  <script>
    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
    function fmtN(n){ return (n||0).toLocaleString('zh-CN'); }
    const NEW_ID = new URLSearchParams(location.search).get('new');

    const BADGE = {
      pending_payment:['待打款','b-pending'], paid_claimed:['待确认','b-claimed'],
      credited:['已到账','b-credited'], rejected:['已驳回','b-rejected'], cancelled:['已取消','b-cancelled'],
    };

    async function refreshBalance(){
      try{ const { balance } = await LJ.get('/orders'); const el=document.getElementById('lj-balance'); if(el && balance!=null) el.textContent = fmtN(balance); }catch{}
    }

    let IS_ADMIN = false;
    async function load(){
      try{
        const me = await LJ.me().catch(()=>({role:''}));
        IS_ADMIN = me.role === 'admin';
        const { orders, balance } = await LJ.get('/orders');
        const el=document.getElementById('lj-balance'); if(el && balance!=null) el.textContent = fmtN(balance);
        render(orders||[]);
      }catch(e){
        document.getElementById('odList').innerHTML = '<div class="od-empty"><div class="ee-d">加载失败,请刷新重试。</div></div>';
      }
    }

    function render(orders){
      const box = document.getElementById('odList');
      if(!orders.length){
        box.innerHTML = `<div class="od-empty">
          <div class="ee-t">还没有充值记录</div>
          <div class="ee-d">首次充值即享开票与发票台账。用多少扣多少,失败自动退还。</div>
          <a class="ee-b" href="recharge.html">去充值 →</a>
        </div>`;
        return;
      }
      box.innerHTML = '<div class="od-list">' + orders.map(o => {
        const [label, cls] = BADGE[o.status] || ['未知','b-pending'];
        const hl = o.id === NEW_ID ? ' hl' : '';
        const note = o.status==='rejected' && o.adminNote ? `<div class="od-note">驳回原因:${esc(o.adminNote)}</div>` : '';
        const pm = o.paymentMethod === 'offline_bank' ? '对公转账' : (o.paymentMethod || '—');
        const who = o.actorName ? ` · 发起人 ${esc(o.actorName)}` : '';
        // 开票状态徽章 + 右侧「开票信息」小字(开票中/已开票可点查详情)。未开票不显徽章。
        const ivBadge = o.status==='credited' && o.invoiceStatus
          ? `<span class="od-ivb ${o.invoiceStatus==='issued'?'iv-iss':'iv-req'}">${o.invoiceStatus==='issued'?'已开票':'开票中'}</span><button class="od-ivlink" onclick='showOrderInvoice(${JSON.stringify(o.id)})'>开票信息</button>` : '';
        return `<div class="od-row${hl}" data-id="${esc(o.id)}">
          <div class="od-top">
            <span class="od-plan">${esc(o.planName)}</span>
            <span class="od-badge ${cls}">${label}</span>
            <span class="od-pm">${esc(pm)}</span>${ivBadge}
            <span class="od-amt"><span class="cur">¥</span>${fmtN(o.priceYuan)}</span>
          </div>
          <div class="od-meta"><span class="od-no">${esc(o.orderNo)}</span> · 到账 <span class="cr">${fmtN(o.credits + o.bonusCredits)}</span> 积分${who}</div>
          ${note}
          <div class="od-acts">${actions(o)}</div>
        </div>`;
      }).join('') + '</div>';
      box.querySelectorAll('[data-act]').forEach(b => b.onclick = () => handle(b.dataset.act, b.dataset.id));
    }

    function actions(o){
      const a = [];
      // 待支付 → 去收银台支付;可取消。
      if(o.status==='pending_payment'){ a.push(btn('pay',o.id,'去支付','primary')); a.push(btn('cancel',o.id,'取消','ghost')); }
      // 已驳回 = 终态:无任何操作按钮(只显驳回原因);用户要重买就重新下单。
      // paid_claimed:核对中,不给取消(竞态守卫);有回执可查看。
      if(o.status==='paid_claimed'){ a.push('<span class="od-act ghost" style="cursor:default">核对中…</span>'); }
      // 已到账 + 未开票 → 去开票(仅 admin)。开票中/已开票的「开票信息」已在状态徽章右侧(行内小字)。
      if(o.status==='credited' && !o.invoiceStatus && IS_ADMIN){ a.push(btn('invoice',o.id,'去开票','')); }
      // 发起人上传过回执 → 可查看(打款/已到账阶段都能看)。
      if(o.hasReceipt && (o.status==='paid_claimed' || o.status==='credited')){ a.push(btn('receipt',o.id,'查看回执','ghost')); }
      return a.join('');
    }
    function btn(act,id,label,cls){ return `<button class="od-act ${cls}" data-act="${act}" data-id="${esc(id)}">${label}</button>`; }

    async function handle(act, id){
      if(act==='pay'){
        // 去收银台支付(查对公信息 / 我已支付 / 传回单都在 pay.html)
        location.href = 'pay.html?order=' + encodeURIComponent(id);
      } else if(act==='cancel'){
        if(!(await window.LJConfirm({ title:'取消订单', body:'确认取消该充值订单?', confirmText:'取消订单', danger:true }))) return;
        try{ await LJ.post('/orders/'+id+'/cancel'); window.LJToast('✓ 订单已取消'); load(); }catch(e){ window.LJToast(e.message,'err'); }
      } else if(act==='invoice'){
        // 去独立开票页(可在那里多选合并;预选不强制,跳过去即可)。
        location.href = 'invoice-new.html';
      } else if(act==='receipt'){
        // 查看发起人上传的银行回执 → 弹层预览图片(inline,不下载)。
        previewReceipt(id);
      }
    }

    // 回执预览(图片直显,不下载;专用层 .rcp-* 自适应竖/横图 + 居中)。
    function previewReceipt(id){
      const ov = document.createElement('div'); ov.className='rcp-ov'; ov.onclick=()=>ov.remove();
      ov.innerHTML = `<div class="rcp-modal" onclick="event.stopPropagation()">
        <h3>打款回执</h3>
        <img src="/api/orders/${encodeURIComponent(id)}/receipt" alt="银行回执">
        <button class="rcp-close" onclick="this.closest('.rcp-ov').remove()">关闭</button></div>`;
      document.body.appendChild(ov);
    }

    // 订单的开票信息详情(行内「开票信息」点击)→ 拉 /orders/:id/invoice。
    window.showOrderInvoice = async (id) => {
      let iv;
      try{ iv = (await LJ.get('/orders/'+encodeURIComponent(id)+'/invoice')).invoice; }
      catch(e){ window.LJToast(e.message||'该订单尚未开票','err'); return; }
      const issued = iv.status==='issued';
      const rows = [
        ['发票抬头', esc(iv.title)],
        ['纳税人识别号', esc(iv.taxNo)],
        ['发票类型', esc(iv.kind)],
        ['开票金额', '¥'+fmtN(iv.amountYuan)],
        ['所含订单', `${(iv.orderNos||[]).length} 单 · ${(iv.orderNos||[]).map(esc).join('、')||'—'}`],
        ['开票状态', issued?'已开票':'待开票'],
        ...(issued&&iv.invoiceNo?[['发票号', esc(iv.invoiceNo)]]:[]),
      ];
      const body = rows.map(([k,v])=>`<div class="ivd-row"><span class="ivd-k">${k}</span><span class="ivd-v">${v}</span></div>`).join('');
      const dl = issued && iv.hasPdf ? `<a class="ivd-dl" href="/api/invoices/${esc(iv.id)}/pdf">下载发票 PDF</a>` : '';
      const ov = document.createElement('div'); ov.className='ivd-ov'; ov.onclick=()=>ov.remove();
      ov.innerHTML = `<div class="ivd-modal" onclick="event.stopPropagation()"><h3>开票信息</h3>${body}<div class="ivd-foot">${dl}<button class="ivd-close" onclick="this.closest('.ivd-ov').remove()">关闭</button></div></div>`;
      document.body.appendChild(ov);
    };

    load();
    // 余额刷新:页面 focus 时重拉(到账后回到本页能看到余额已涨,外部#7)
    window.addEventListener('focus', refreshBalance);
  </script>

<!-- 灵镜 Lingjing logo — 镜中分身(方案 A2) -->
<!-- 设计:外层圆角方"镜框"=镜;框内头肩剖影=数字人。负空间对比,单一强剖面,20px 仍清晰可辨。 -->
<!-- 单色 currentColor 跟随上下文取色;页面内多数场景外框由容器(.mk/.logo-mark)提供,此处给独立完整版。 -->
<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="灵镜">
  <!-- 镜框 -->
  <rect x="4" y="4" width="24" height="24" rx="7" fill="currentColor"/>
  <!-- 框内:头肩剖影(负空间反白)-->
  <circle cx="16" cy="13" r="4" fill="#0A0A0B"/>
  <path d="M8 25.5c0-4.4 3.4-7 8-7s8 2.6 8 7z" fill="#0A0A0B"/>
</svg>

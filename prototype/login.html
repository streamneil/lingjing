<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 灵镜</title>
<link rel="icon" type="image/svg+xml" href="/brand/lingjing-favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#060607; --bg:#0A0A0B; --card:#161618; --card-hi:#1C1C1F; --field:#101012;
    --line:#232327; --line-soft:#1A1A1D; --line-hi:#34343A; --hairline:rgba(255,255,255,.06);
    --t1:#F6F6F8; --t2:#ABABB2; --t3:#717179; --t4:#4A4A51;
    --blue:#4D8DFF; --blue-bg:rgba(77,141,255,.13); --red:#FF5247; --green:#34C759; --amber:#FFB23E;
    --f:'Noto Sans SC',sans-serif; --f-en:'Manrope',sans-serif; --f-mono:'Space Mono',monospace;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  /* 单一居中布局 — 用 flex 居中,不依赖 grid 列对齐/高度链,任何视口都稳 */
  body{
    font-family:var(--f); background:var(--void); color:var(--t1);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:32px; position:relative; overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  /* 氛围背景:渐变光晕 + 网格 + 颗粒,铺满整屏 */
  body::before{
    content:""; position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(60% 50% at 50% -10%, rgba(77,141,255,.10) 0%, transparent 60%),
      radial-gradient(50% 50% at 100% 100%, rgba(77,141,255,.06) 0%, transparent 55%),
      radial-gradient(80% 60% at 0% 30%, #141417 0%, transparent 60%),
      var(--bg);
  }
  body::after{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:linear-gradient(var(--hairline) 1px,transparent 1px),linear-gradient(90deg,var(--hairline) 1px,transparent 1px);
    background-size:60px 60px; mask-image:radial-gradient(70% 60% at 50% 40%,#000 0%,transparent 80%); opacity:.5;
  }

  .wrap{ position:relative; z-index:1; width:100%; max-width:430px; animation:rise .6s var(--ease) both; }
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

  /* 品牌(卡片上方,居中) */
  .brand{ display:flex; flex-direction:column; align-items:center; text-align:center; margin-bottom:26px; }
  .brand .mk{
    width:56px;height:56px;border-radius:16px;background:var(--t1);display:grid;place-items:center;
    box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 16px 40px -14px rgba(255,255,255,.32); margin-bottom:16px;
  }
  .brand .mk svg{width:33px;height:33px}
  .brand .nm{display:flex;align-items:baseline;gap:9px}
  .brand .nm b{font-size:22px;font-weight:700;letter-spacing:.5px}
  .brand .nm .en{font-family:var(--f-en);font-size:11px;color:var(--t4);letter-spacing:3px;text-transform:uppercase}
  .brand .tag{margin-top:9px;font-size:12.5px;color:var(--blue);letter-spacing:.5px}

  /* 登录卡 */
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:22px; padding:34px 34px 30px;
    box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 40px 100px -34px rgba(0,0,0,.9);
  }
  .card h2{font-size:21px;font-weight:700;letter-spacing:-.3px;text-align:center}
  .card .sub{color:var(--t3);font-size:13px;margin-top:7px;margin-bottom:26px;text-align:center}
  .fld{margin-bottom:15px}
  .fld label{display:block;font-size:11px;color:var(--t3);margin-bottom:8px;font-family:var(--f-en);letter-spacing:.5px;text-transform:uppercase;font-weight:600}
  .fld input{
    width:100%;background:var(--field);border:1px solid var(--line);border-radius:12px;
    padding:13px 15px;color:var(--t1);font-size:14.5px;font-family:var(--f);outline:none;
    transition:border-color .18s,box-shadow .18s,background .18s;
  }
  .fld input::placeholder{color:var(--t4)}
  .fld input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-bg);background:var(--card-hi)}
  .pw-wrap{position:relative}
  .pw-wrap input{padding-right:54px}
  .pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--t3);font-family:var(--f);font-size:12px;cursor:pointer;padding:7px 9px;border-radius:8px;transition:.15s}
  .pw-eye:hover{color:var(--t1);background:var(--card-hi)}
  .fld input.shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
  .submit{
    width:100%;margin-top:10px;background:var(--t1);color:#0A0A0B;border:none;border-radius:999px;
    padding:14px;font-size:15px;font-weight:700;font-family:var(--f);cursor:pointer;letter-spacing:2px;
    box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 10px 26px -10px rgba(255,255,255,.28);
    transition:transform .12s var(--ease),box-shadow .18s,opacity .18s;
  }
  .submit:hover{transform:translateY(-1px);box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 14px 34px -10px rgba(255,255,255,.4)}
  .submit:active{transform:translateY(0)}
  .submit:disabled{opacity:.5;cursor:not-allowed;transform:none}
  .err{color:var(--red);font-size:12.5px;margin-top:13px;min-height:17px;display:flex;align-items:center;gap:6px}
  .hint{color:var(--t4);font-size:11.5px;margin-top:22px;line-height:1.7;border-top:1px solid var(--line-soft);padding-top:17px;text-align:center}
  .hint b{color:var(--t3);font-weight:500}

  /* 卡片下方一行"价值锚点"(替代原大舞台,信息保留但不靠脆弱分栏) */
  .pitch{ margin-top:20px; display:flex; align-items:center; justify-content:center; gap:18px; color:var(--t4); font-size:12px; font-family:var(--f-mono); flex-wrap:wrap; }
  .pitch .dot{width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);display:inline-block;margin-right:5px}
  .pitch span{white-space:nowrap}

  /* 登录方式 tab(验证码 / 密码),等权两 tab */
  .tabs{display:flex;gap:4px;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:22px}
  .tab{flex:1;text-align:center;padding:9px 0;font-size:13.5px;color:var(--t3);border-radius:9px;cursor:pointer;font-weight:600;transition:.18s;background:none;border:none;font-family:var(--f)}
  .tab.active{background:var(--card-hi);color:var(--t1);box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 2px 8px -4px rgba(0,0,0,.6)}
  .panel{display:none}
  .panel.active{display:block}
  /* 验证码行:输入框 + 获取按钮 */
  .code-row{display:flex;gap:9px}
  .code-row input{flex:1;letter-spacing:6px;font-family:var(--f-mono);font-size:16px;text-align:center}
  .send-btn{flex:0 0 auto;white-space:nowrap;background:var(--blue-bg);color:var(--blue);border:1px solid rgba(77,141,255,.28);border-radius:12px;padding:0 16px;font-size:13px;font-weight:600;font-family:var(--f);cursor:pointer;transition:.15s}
  .send-btn:hover:not(:disabled){background:rgba(77,141,255,.2)}
  .send-btn:disabled{opacity:.5;cursor:not-allowed;color:var(--t3)}
  .affordance{font-size:11.5px;color:var(--t3);margin-top:9px;line-height:1.6;display:flex;align-items:center;gap:6px}
  .affordance svg{width:13px;height:13px;flex:0 0 auto;color:var(--blue)}
  .sent-hint{color:var(--green);font-size:12px;margin-top:9px;min-height:16px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <span class="mk"><svg viewBox="0 0 100 100" fill="none"><circle cx="37" cy="50" r="29" stroke="#0E0E0E" stroke-width="5"/><circle cx="63" cy="50" r="29" stroke="#0E0E0E" stroke-width="5"/><path d="M50 24.08 A29 29 0 0 1 50 75.92 A29 29 0 0 1 50 24.08 Z" fill="#0E0E0E"/></svg></span>
      <div class="nm"><b>灵镜</b><span class="en">Lingjing</span></div>
      <div class="tag">一站式 AI 内容创作平台</div>
    </div>

    <div class="card">
      <h2>欢迎来到灵镜</h2>
      <div class="sub">登录创作台,继续你的内容生产</div>

      <div class="tabs" role="tablist">
        <button class="tab active" id="tabSms" role="tab" aria-selected="true">验证码登录</button>
        <button class="tab" id="tabPw" role="tab" aria-selected="false">密码登录</button>
      </div>

      <!-- 验证码登录 / 注册(统一入口) -->
      <form class="panel active" id="smsForm">
        <div class="fld">
          <label>手机号</label>
          <input id="smsPhone" type="tel" inputmode="numeric" maxlength="11" placeholder="请输入手机号" autocomplete="tel" required autofocus>
        </div>
        <div class="fld" style="margin-bottom:6px">
          <label>安全验证</label>
          <div id="smsCaptcha"></div>
        </div>
        <div class="fld">
          <label>验证码</label>
          <div class="code-row">
            <input id="smsCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 位验证码">
            <button type="button" class="send-btn" id="sendBtn" disabled>获取验证码</button>
          </div>
          <div class="sent-hint" id="sentHint" aria-live="polite"></div>
        </div>
        <button class="submit" id="smsBtn" type="submit" disabled>登 录 / 注 册</button>
        <div class="affordance">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
          <span>未注册的手机号,验证后将自动创建账号</span>
        </div>
        <div class="err" id="smsErr" aria-live="polite"></div>
      </form>

      <!-- 密码登录(回落) -->
      <form class="panel" id="pwForm">
        <div class="fld">
          <label>用户名</label>
          <input id="username" placeholder="你的登录账号" autocomplete="username">
        </div>
        <div class="fld">
          <label>密码</label>
          <div class="pw-wrap">
            <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
            <button type="button" class="pw-eye" id="pwEye" aria-label="显示密码">显示</button>
          </div>
        </div>
        <div class="fld" style="margin-bottom:6px">
          <label>安全验证</label>
          <div id="pwCaptcha"></div>
        </div>
        <button class="submit" id="pwBtn" type="submit" disabled>登 录</button>
        <div style="text-align:center;margin-top:14px"><a href="#" id="forgotLink" style="color:var(--t3);font-size:12.5px;text-decoration:none">忘记密码?</a></div>
        <div class="err" id="pwErr" aria-live="polite"></div>
      </form>

      <!-- 忘记密码(#8):绑定手机号 → 验证码 → 设新密码 -->
      <form class="panel" id="fgForm">
        <div class="sub" style="margin-bottom:18px">填写账号绑定的手机号,通过验证码重置密码。</div>
        <div class="fld">
          <label>手机号</label>
          <input id="fgPhone" type="tel" inputmode="numeric" maxlength="11" placeholder="账号绑定的手机号" autocomplete="tel">
        </div>
        <div class="fld" style="margin-bottom:6px">
          <label>安全验证</label>
          <div id="fgCaptcha"></div>
        </div>
        <div class="fld">
          <label>验证码</label>
          <div class="code-row">
            <input id="fgCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 位验证码">
            <button type="button" class="send-btn" id="fgSend" disabled>获取验证码</button>
          </div>
          <div class="sent-hint" id="fgHint" aria-live="polite"></div>
        </div>
        <div class="fld">
          <label>新密码(≥6 位)</label>
          <input id="fgPw" type="password" placeholder="设置新密码" autocomplete="new-password">
        </div>
        <button class="submit" id="fgBtn" type="submit">重 置 密 码</button>
        <div style="text-align:center;margin-top:12px"><a href="#" id="fgBack" style="color:var(--t3);font-size:12.5px;text-decoration:none">← 返回登录</a></div>
        <div class="err" id="fgErr" aria-live="polite"></div>
      </form>
    </div>

    <div class="pitch">
      <span><span class="dot"></span>云端秒级生成</span>
      <span>多模态创作</span>
      <span>声音克隆</span>
      <span>合规 AI 标识</span>
    </div>
  </div>

<script src="api.js"></script>
<script src="captcha.js"></script>
<script>
  const $=(id)=>document.getElementById(id);
  const isPhone=(p)=>/^1[3-9]\d{9}$/.test(p);
  const mask=(p)=>p.slice(0,3)+'****'+p.slice(7);

  // ── tab 切换(验证码 / 密码)──
  const tabSms=$('tabSms'),tabPw=$('tabPw'),smsForm=$('smsForm'),pwForm=$('pwForm');
  function selectTab(sms){
    tabSms.classList.toggle('active',sms); tabPw.classList.toggle('active',!sms);
    tabSms.setAttribute('aria-selected',sms); tabPw.setAttribute('aria-selected',!sms);
    smsForm.classList.toggle('active',sms); pwForm.classList.toggle('active',!sms);
    (sms?$('smsPhone'):$('username')).focus();
  }
  tabSms.addEventListener('click',()=>selectTab(true));
  tabPw.addEventListener('click',()=>selectTab(false));

  // ── 验证码登录 / 注册 ──
  const smsPhone=$('smsPhone'),smsCode=$('smsCode'),sendBtn=$('sendBtn'),smsBtn=$('smsBtn'),
        smsErr=$('smsErr'),sentHint=$('sentHint');
  let smsToken=null, countdown=0, codeSent=false;
  function refreshSend(){ sendBtn.disabled=!(countdown===0 && smsToken && isPhone(smsPhone.value.trim())); }
  function refreshSubmit(){ smsBtn.disabled=!(codeSent && smsCode.value.trim().length===6); }
  const smsCap=LJCaptcha.mount($('smsCaptcha'),{
    onPass:(t)=>{ smsToken=t; refreshSend(); },
    onReset:()=>{ smsToken=null; refreshSend(); },
  });
  smsPhone.addEventListener('input',()=>{ smsPhone.value=smsPhone.value.replace(/\D/g,''); refreshSend(); });
  smsCode.addEventListener('input',()=>{ smsCode.value=smsCode.value.replace(/\D/g,''); refreshSubmit(); });

  function startCountdown(){
    countdown=60; sendBtn.textContent=countdown+'s'; refreshSend();
    const t=setInterval(()=>{ countdown--; if(countdown<=0){ clearInterval(t); countdown=0; sendBtn.textContent='重新获取'; } else sendBtn.textContent=countdown+'s'; refreshSend(); },1000);
  }

  sendBtn.addEventListener('click',async()=>{
    smsErr.textContent=''; const phone=smsPhone.value.trim();
    if(!isPhone(phone)){ smsErr.innerHTML='✕ 请输入有效的手机号'; return; }
    if(!smsToken){ smsErr.innerHTML='✕ 请先完成滑块验证'; return; }
    sendBtn.disabled=true; sendBtn.textContent='发送中…';
    try{
      await LJ.smsSend(phone,smsToken);
      sentHint.textContent='✓ 验证码已发往 '+mask(phone);
      codeSent=true; smsCode.focus(); refreshSubmit();
      smsToken=null; smsCap.reset(); // token 一次性,重发需重新滑块
      startCountdown();
    }catch(ex){
      smsErr.innerHTML='✕ '+(ex.message||'发送失败'); sendBtn.textContent='获取验证码';
      smsToken=null; smsCap.reset(); refreshSend();
    }
  });

  smsForm.addEventListener('submit',async(e)=>{
    e.preventDefault(); smsErr.textContent='';
    const phone=smsPhone.value.trim(), code=smsCode.value.trim();
    if(!isPhone(phone)||code.length!==6){ smsErr.innerHTML='✕ 请填写手机号与 6 位验证码'; return; }
    smsBtn.disabled=true; smsBtn.textContent='登录中…';
    try{
      await LJ.smsLogin(phone,code);
      location.href='explore.html';
    }catch(ex){
      smsErr.innerHTML='✕ '+(ex.message||'登录失败'); smsBtn.textContent='登 录 / 注 册';
      smsCode.classList.add('shake'); setTimeout(()=>smsCode.classList.remove('shake'),420);
      smsCode.value=''; smsCode.focus(); refreshSubmit();
    }
  });

  // ── 密码登录(回落)──
  const pw=$('password'),eye=$('pwEye'),pwBtn=$('pwBtn'),pwErr=$('pwErr');
  eye.addEventListener('click',()=>{ const show=pw.type==='password'; pw.type=show?'text':'password'; eye.textContent=show?'隐藏':'显示'; pw.focus(); });
  let pwToken=null;
  const pwCap=LJCaptcha.mount($('pwCaptcha'),{
    onPass:(t)=>{ pwToken=t; pwBtn.disabled=false; },
    onReset:()=>{ pwToken=null; pwBtn.disabled=true; },
  });
  pwForm.addEventListener('submit',async(e)=>{
    e.preventDefault(); pwErr.textContent='';
    if(!pwToken){ pwErr.innerHTML='✕ 请先完成滑块验证'; return; }
    pwBtn.disabled=true; pwBtn.textContent='登录中…';
    try{
      await LJ.login($('username').value.trim(),pw.value,pwToken);
      location.href='explore.html';
    }catch(ex){
      pwErr.innerHTML='✕ '+(ex.message||'登录失败'); pwBtn.textContent='登 录';
      pw.classList.add('shake'); setTimeout(()=>pw.classList.remove('shake'),420);
      pw.value=''; pw.focus();
      pwToken=null; pwCap.reset();
    }
  });

  // ── 忘记密码(#8):绑定手机号 → 验证码 → 设新密码 ──
  const tabsEl=document.querySelector('.tabs'),fgForm=$('fgForm'),fgPhone=$('fgPhone'),fgCode=$('fgCode'),
        fgPw=$('fgPw'),fgSend=$('fgSend'),fgBtn=$('fgBtn'),fgErr=$('fgErr'),fgHint=$('fgHint');
  let fgToken=null, fgCountdown=0;
  function fgRefreshSend(){ fgSend.disabled=!(fgCountdown===0 && fgToken && isPhone(fgPhone.value.trim())); }
  const fgCap=LJCaptcha.mount($('fgCaptcha'),{ onPass:(t)=>{ fgToken=t; fgRefreshSend(); }, onReset:()=>{ fgToken=null; fgRefreshSend(); } });
  fgPhone.addEventListener('input',()=>{ fgPhone.value=fgPhone.value.replace(/\D/g,''); fgRefreshSend(); });
  fgCode.addEventListener('input',()=>{ fgCode.value=fgCode.value.replace(/\D/g,''); });

  function showForgot(on){
    tabsEl.style.display=on?'none':'';
    smsForm.classList.remove('active'); pwForm.classList.toggle('active',!on); fgForm.classList.toggle('active',on);
    if(on) fgPhone.focus(); else selectTab(false);
  }
  $('forgotLink').addEventListener('click',(e)=>{ e.preventDefault(); showForgot(true); });
  $('fgBack').addEventListener('click',(e)=>{ e.preventDefault(); showForgot(false); });

  function fgStartCountdown(){
    fgCountdown=60; fgSend.textContent='60s'; fgRefreshSend();
    const t=setInterval(()=>{ fgCountdown--; if(fgCountdown<=0){ clearInterval(t); fgCountdown=0; fgSend.textContent='重新获取'; } else fgSend.textContent=fgCountdown+'s'; fgRefreshSend(); },1000);
  }
  fgSend.addEventListener('click',async()=>{
    fgErr.textContent=''; const phone=fgPhone.value.trim();
    if(!isPhone(phone)){ fgErr.innerHTML='✕ 请输入有效的手机号'; return; }
    if(!fgToken){ fgErr.innerHTML='✕ 请先完成滑块验证'; return; }
    fgSend.disabled=true; fgSend.textContent='发送中…';
    try{
      await LJ.post('/sms/send',{phone,captchaToken:fgToken,purpose:'reset'});
      fgHint.textContent='✓ 若该手机号已绑定账号,验证码已发送'; // 不泄露存在性
      fgCode.focus(); fgToken=null; fgCap.reset(); fgStartCountdown();
    }catch(ex){
      fgErr.innerHTML='✕ '+(ex.message||'发送失败'); fgSend.textContent='获取验证码';
      fgToken=null; fgCap.reset(); fgRefreshSend();
    }
  });
  fgForm.addEventListener('submit',async(e)=>{
    e.preventDefault(); fgErr.textContent='';
    const phone=fgPhone.value.trim(), code=fgCode.value.trim(), npw=fgPw.value;
    if(!isPhone(phone)||code.length!==6){ fgErr.innerHTML='✕ 请填写手机号与 6 位验证码'; return; }
    if(npw.length<6){ fgErr.innerHTML='✕ 新密码至少 6 位'; return; }
    fgBtn.disabled=true; fgBtn.textContent='重置中…';
    try{
      await LJ.post('/sms/forgot',{phone,code,newPassword:npw});
      showForgot(false);
      pwErr.style.color='var(--green)'; pwErr.innerHTML='✓ 密码已重置,请用新密码登录';
    }catch(ex){
      fgErr.innerHTML='✕ '+(ex.message||'重置失败'); fgBtn.disabled=false; fgBtn.textContent='重 置 密 码';
    }
  });
</script>
</body>
</html>

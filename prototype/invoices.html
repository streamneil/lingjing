<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发票管理 · 灵镜</title>
  <link rel="icon" type="image/svg+xml" href="/brand/lingjing-favicon.svg">
  <link rel="stylesheet" href="app.css">
  <style>
    .iv-list{ display:flex; flex-direction:column; gap:10px; }
    .iv-row{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; }
    .iv-top{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .iv-title{ font-size:14px; font-weight:600; }
    .iv-amt{ margin-left:auto; font-size:16px; font-weight:800; font-family:var(--f-en,'Manrope',sans-serif); }
    .iv-meta{ font-size:12px; color:var(--t3); margin-top:6px; }
    .iv-badge{ font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; border:1px solid; }
    .b-req{ color:#9EC1FF; border-color:rgba(77,141,255,.4); background:var(--blue-bg); }
    .b-iss{ color:var(--green); border-color:rgba(52,199,89,.4); background:rgba(52,199,89,.1); }
    .iv-acts{ margin-top:12px; }
    .iv-act{ font-size:13px; font-weight:600; padding:8px 16px; border-radius:999px; border:1px solid var(--line); background:var(--field); color:var(--t1); cursor:pointer; font-family:inherit; min-height:40px; text-decoration:none; display:inline-block; }
    .iv-act.primary{ background:var(--blue); color:#fff; border:none; }
    .iv-empty{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:48px 24px; text-align:center; }
    .iv-empty .ee-t{ font-size:15px; font-weight:600; }
    .iv-empty .ee-d{ font-size:13px; color:var(--t3); margin:8px 0 18px; }
    .iv-empty .ee-b{ display:inline-block; background:var(--blue); color:#fff; border-radius:999px; padding:11px 24px; font-size:14px; font-weight:700; text-decoration:none; min-height:44px; }
    .iv-new-btn{ background:var(--blue); color:#fff; border:none; border-radius:999px; padding:10px 20px; font-size:14px; font-weight:700; text-decoration:none; align-self:center; min-height:44px; }
  </style>
<script defer src="shell.js"></script>
</head>

<body data-page="invoices" data-crumb="财务中心 > 发票管理">
  <div class="shell" id="shell-mount">
    <div class="main-col">
      <main class="page">
        <div class="ph">
          <div><h1 class="t-h1">发票管理</h1><p class="desc" id="ivDesc">已到账订单可申请开具增值税普通发票,支持多单合并开票。开具后可下载电子发票 PDF。</p></div>
          <a class="iv-new-btn" id="ivNewBtn" href="invoice-new.html" style="display:none">+ 新建开票</a>
        </div>
        <div id="ivList"><div class="iv-empty"><div class="ee-d">加载中…</div></div></div>
      </main>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
    function fmtN(n){ return (n||0).toLocaleString('zh-CN'); }

    async function load(){
      try{
        const me = await LJ.me();
        const isAdmin = me.role === 'admin';
        // 仅 admin 显「新建开票」入口(开票是 admin 专属);creator 只读列表 + 下载。
        if(isAdmin) document.getElementById('ivNewBtn').style.display = 'inline-block';
        else document.getElementById('ivDesc').textContent = '本机构发票台账。开票由管理员发起,你可在此查看与下载已开具的发票。';
        const { invoices } = await LJ.get('/invoices');
        render(invoices||[], isAdmin);
      }catch(e){
        document.getElementById('ivList').innerHTML = '<div class="iv-empty"><div class="ee-d">加载失败,请刷新重试。</div></div>';
      }
    }

    function render(invoices, isAdmin){
      const box = document.getElementById('ivList');
      if(!invoices.length){
        box.innerHTML = `<div class="iv-empty">
          <div class="ee-t">还没有发票</div>
          <div class="ee-d">${isAdmin?'已到账的充值订单可「新建开票」(支持多单合并)。':'开票由管理员发起,暂无已开发票。'}</div>
          ${isAdmin?'<a class="ee-b" href="invoice-new.html">新建开票 →</a>':'<a class="ee-b" href="orders.html">查看订单 →</a>'}
        </div>`;
        return;
      }
      INVOICES = invoices;
      box.innerHTML = '<div class="iv-list">' + invoices.map(iv => {
        const issued = iv.status==='issued';
        const badge = issued ? '<span class="iv-badge b-iss">已开票</span>' : '<span class="iv-badge b-req">待开票</span>';
        const dl = issued && iv.hasPdf ? `<a class="iv-act primary" href="/api/invoices/${esc(iv.id)}/pdf">下载发票 PDF</a>` : (issued ? `<span class="iv-meta">发票号 ${esc(iv.invoiceNo)}</span>` : '<span class="iv-meta">平台开具中,请稍候…</span>');
        return `<div class="iv-row">
          <div class="iv-top"><span class="iv-title">${esc(iv.title)}</span>${badge}<button class="iv-detail-link" onclick='showInvDetail(${JSON.stringify(iv.id)})'>开票信息</button><span class="iv-amt">¥${fmtN(iv.amountYuan)}</span></div>
          <div class="iv-meta">税号 ${esc(iv.taxNo)} · ${esc(iv.kind)} · 含 ${(iv.orderNos||[]).length} 单</div>
          <div class="iv-acts">${dl}</div>
        </div>`;
      }).join('') + '</div>';
    }

    // 开票信息详情弹层(抬头/税号/发票号/金额/含单/下载PDF)。
    let INVOICES = [];
    window.showInvDetail = (id) => {
      const iv = INVOICES.find(x => x.id === id); if(!iv) return;
      const issued = iv.status==='issued';
      const orders = (iv.orderNos||[]).map(esc).join('、') || '—';
      const rows = [
        ['发票抬头', esc(iv.title)],
        ['纳税人识别号', esc(iv.taxNo)],
        ['发票类型', esc(iv.kind)],
        ['开票金额', '¥'+fmtN(iv.amountYuan)],
        ['所含订单', `${(iv.orderNos||[]).length} 单 · ${orders}`],
        ['开票状态', issued?'已开票':'待开票'],
        ...(issued&&iv.invoiceNo?[['发票号', esc(iv.invoiceNo)]]:[]),
      ];
      const body = rows.map(([k,v])=>`<div class="ivd-row"><span class="ivd-k">${k}</span><span class="ivd-v">${v}</span></div>`).join('');
      const dl = issued && iv.hasPdf ? `<a class="ivd-dl" href="/api/invoices/${esc(iv.id)}/pdf">下载发票 PDF</a>` : '';
      const ov = document.createElement('div'); ov.className='ivd-ov'; ov.onclick=()=>ov.remove();
      ov.innerHTML = `<div class="ivd-modal" onclick="event.stopPropagation()"><h3>开票信息</h3>${body}<div class="ivd-foot">${dl}<button class="ivd-close" onclick="this.closest('.ivd-ov').remove()">关闭</button></div></div>`;
      document.body.appendChild(ov);
    };

    load();
  </script>
</body>
</html>

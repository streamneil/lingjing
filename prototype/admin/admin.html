<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>平台运营 · 灵镜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#060607; --bg:#0A0A0B; --card:#161618; --card-hi:#1C1C1F; --modal:#1A1A1D; --field:#101012;
    --line:#232327; --line-soft:#1A1A1D; --line-hi:#34343A; --hairline:rgba(255,255,255,.06);
    --t1:#F6F6F8; --t2:#ABABB2; --t3:#717179; --t4:#4A4A51;
    --blue:#4D8DFF; --blue-bg:rgba(77,141,255,.13); --red:#FF5247; --green:#34C759; --amber:#FFB23E;
    --f:'Noto Sans SC',sans-serif; --f-en:'Manrope',sans-serif; --f-mono:'Space Mono',monospace;
    --ease:cubic-bezier(.22,.61,.36,1); --sh-pop:0 40px 100px -30px rgba(0,0,0,.9);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--f);background:var(--bg);color:var(--t1);min-height:100vh;-webkit-font-smoothing:antialiased}
  .top{display:flex;align-items:center;justify-content:space-between;padding:18px 30px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(10,10,11,.85);backdrop-filter:blur(12px);z-index:50}
  .brand{display:flex;align-items:center;gap:11px}
  .mk{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--amber),#E8902B);display:grid;place-items:center;font-weight:800;color:#0A0A0B;font-family:var(--f-en);font-size:15px}
  .brand b{font-size:15px;font-weight:700}
  .brand .tg{font-size:10px;color:var(--amber);font-family:var(--f-mono);letter-spacing:1.5px;text-transform:uppercase;margin-left:2px}
  .top .right{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--t3)}
  .logout{background:none;border:1px solid var(--line);color:var(--t2);padding:7px 14px;border-radius:999px;font-family:var(--f);font-size:12.5px;cursor:pointer;transition:.15s}
  .logout:hover{border-color:var(--line-hi);color:var(--t1)}
  .page{max-width:1080px;margin:0 auto;padding:30px}
  .ph{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
  .ph h1{font-size:24px;font-weight:700;letter-spacing:-.4px}
  .ph p{font-size:13px;color:var(--t3);margin-top:5px}
  .btn-new{background:var(--amber);color:#0A0A0B;border:none;border-radius:999px;padding:11px 18px;font-size:13.5px;font-weight:700;font-family:var(--f);cursor:pointer;display:flex;align-items:center;gap:6px;transition:transform .12s}
  .btn-new:hover{transform:translateY(-1px)}
  .tbl{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.5px;padding:14px 18px;border-bottom:1px solid var(--line);font-family:var(--f-en)}
  td{padding:15px 18px;border-bottom:1px solid var(--line-soft);font-size:13.5px;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:var(--card-hi)}
  .tn{font-weight:600}
  .tid{font-family:var(--f-mono);font-size:10.5px;color:var(--t4);margin-top:2px}
  .bdg{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600}
  .bdg-host{background:var(--blue-bg);color:var(--blue)}
  .bdg-priv{background:rgba(255,178,62,.13);color:var(--amber)}
  .bal{font-family:var(--f-mono);font-weight:700}
  .acts{display:flex;gap:7px;justify-content:flex-end}
  .act{background:var(--field);border:1px solid var(--line);color:var(--t2);padding:6px 12px;border-radius:8px;font-size:12px;font-family:var(--f);cursor:pointer;transition:.15s}
  .act:hover{border-color:var(--line-hi);color:var(--t1)}
  .act.pri:hover{border-color:var(--amber);color:var(--amber)}
  .empty{padding:50px;text-align:center;color:var(--t4);font-size:13px}
  /* 弹窗(.bl-ov 同款) */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:none;place-items:center;z-index:400}
  .ov.on{display:grid}
  .modal{width:400px;max-width:92vw;background:var(--modal);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:var(--sh-pop)}
  .modal h3{font-size:17px;font-weight:700;margin-bottom:5px}
  .modal .mdesc{font-size:12.5px;color:var(--t3);margin-bottom:18px;line-height:1.6}
  .modal label{display:block;font-size:11.5px;color:var(--t3);margin:13px 0 6px;font-weight:600}
  .modal input,.modal select{width:100%;box-sizing:border-box;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:11px 13px;color:var(--t1);font-size:14px;font-family:var(--f);outline:none}
  .modal input:focus,.modal select:focus{border-color:var(--amber)}
  .qa{display:flex;gap:7px;margin:10px 0 2px}
  .qa button{flex:1;background:var(--field);border:1px solid var(--line);color:var(--t2);font-family:var(--f-mono);font-size:11.5px;padding:8px;border-radius:9px;cursor:pointer;transition:.15s}
  .qa button:hover{background:var(--card-hi);color:var(--t1)}
  .mmsg{font-size:12.5px;min-height:16px;color:var(--red);margin-top:12px}
  .mbtns{display:flex;gap:10px;margin-top:16px}
  .mbtns button{flex:1;padding:11px;border-radius:999px;font-size:14px;font-weight:600;font-family:var(--f);cursor:pointer}
  .mbtns .cancel{border:1px solid var(--line);background:none;color:var(--t2)}
  .mbtns .ok{border:none;background:var(--amber);color:#0A0A0B}
  .mbtns .ok:disabled{opacity:.5;cursor:not-allowed}
  /* 租户详情宽弹窗 */
  .modal.mwide{width:540px;max-height:86vh;overflow-y:auto}
  .msec{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
  .msec:first-of-type{margin-top:14px}
  .msec-h{font-size:12px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.5px;font-family:var(--f-en);margin-bottom:4px}
  .mrow2{display:flex;gap:12px}
  .mrow2>div{flex:1}
  .muser-list{margin-top:10px;display:flex;flex-direction:column;gap:8px}
  .muser{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .muser .ui{min-width:0}
  .muser .un{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .muser .meta{font-size:11px;color:var(--t4);margin-top:2px;font-family:var(--f-mono)}
  .muser .uacts{display:flex;gap:6px;flex-shrink:0}
  .rbdg{display:inline-block;padding:2px 7px;border-radius:999px;font-size:10px;font-weight:600;margin-left:6px;vertical-align:middle}
  .rbdg-admin{background:rgba(255,178,62,.13);color:var(--amber)}
  .rbdg-creator{background:var(--blue-bg);color:var(--blue)}
  .rbdg-viewer{background:rgba(255,255,255,.06);color:var(--t3)}
  .rbdg-off{background:rgba(255,82,71,.13);color:var(--red)}
  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--card-hi);border:1px solid var(--line-hi);color:var(--t1);padding:12px 20px;border-radius:12px;font-size:13.5px;box-shadow:var(--sh-pop);z-index:500;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
</style>
</head>
<body>
  <div class="top">
    <div class="brand"><span class="mk">灵</span><b>灵镜 · 平台运营</b><span class="tg">Admin</span></div>
    <div class="right"><span id="who"></span><button class="logout" id="logoutBtn">登出</button></div>
  </div>

  <div class="page">
    <div class="ph">
      <div><h1>租户管理</h1><p id="subline">管理机构、开设账号、充值点数</p></div>
      <button class="btn-new" onclick="openTenant()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>新建租户</button>
    </div>
    <div class="tbl">
      <table>
        <thead><tr><th>机构</th><th>交付</th><th>用户</th><th>余额</th><th>创建时间</th><th style="text-align:right">操作</th></tr></thead>
        <tbody id="rows"><tr><td colspan="6" class="empty">加载中…</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- 新建租户(只建托管;私有化是独立部署交付,不在此管理)-->
  <div class="ov" id="tenantOv">
    <div class="modal">
      <h3>新建租户</h3>
      <p class="mdesc">为新机构开通托管账号。机构名称由平台设定,租户用户不能自行修改;创建后可在「管理」里改名/调整配置。</p>
      <label>机构名称</label>
      <input id="tName" placeholder="如:XX 区融媒体中心">
      <div class="mmsg" id="tMsg"></div>
      <div class="mbtns"><button class="cancel" onclick="closeOv('tenantOv')">取消</button><button class="ok" id="tOk" onclick="submitTenant()">创建</button></div>
    </div>
  </div>

  <!-- 开户 -->
  <div class="ov" id="userOv">
    <div class="modal">
      <h3>开设账号</h3>
      <p class="mdesc" id="uFor"></p>
      <label>登录用户名(全平台唯一,不能用 admin 等保留字)</label>
      <input id="uName" placeholder="如:xxtv-zhangsan">
      <label>初始密码</label>
      <input id="uPass" type="text" placeholder="至少 6 位" value="">
      <label>角色</label>
      <select id="uRole"><option value="admin">机构管理员</option><option value="creator">创作者</option><option value="viewer">查看者</option></select>
      <div class="mmsg" id="uMsg"></div>
      <div class="mbtns"><button class="cancel" onclick="closeOv('userOv')">取消</button><button class="ok" id="uOk" onclick="submitUser()">开通</button></div>
    </div>
  </div>

  <!-- 充值 -->
  <div class="ov" id="grantOv">
    <div class="modal">
      <h3>租户充值</h3>
      <p class="mdesc" id="gFor"></p>
      <label>充值点数</label>
      <input id="gAmt" type="number" min="1" value="1000">
      <div class="qa"><button data-v="1000">+1,000</button><button data-v="5000">+5,000</button><button data-v="10000">+10,000</button></div>
      <div class="mmsg" id="gMsg"></div>
      <div class="mbtns"><button class="cancel" onclick="closeOv('grantOv')">取消</button><button class="ok" id="gOk" onclick="submitGrant()">确认充值</button></div>
    </div>
  </div>

  <!-- 租户详情管理(改名/席位/交付 + 用户列表)-->
  <div class="ov" id="manageOv">
    <div class="modal mwide">
      <h3 id="mTitle">租户管理</h3>
      <p class="mdesc" id="mSub"></p>

      <div class="msec">
        <div class="msec-h">机构设置</div>
        <label>机构名称</label>
        <input id="mName" placeholder="机构名称">
        <div class="mrow2">
          <div><label>创作席位上限</label><input id="mSeats" type="number" min="1"></div>
          <div><label>交付模式</label><select id="mDelivery"><option value="hosted">托管</option><option value="private">私有化</option></select></div>
        </div>
        <div class="mmsg" id="mSetMsg"></div>
        <div style="margin-top:10px"><button class="ok" style="width:auto;padding:9px 18px;border-radius:999px" id="mSetBtn" onclick="saveTenantSettings()">保存设置</button></div>
      </div>

      <div class="msec">
        <div class="msec-h">用户(<span id="mUserCount">0</span>)</div>
        <div id="mUsers" class="muser-list"><div class="empty" style="padding:20px">加载中…</div></div>
      </div>

      <div class="mbtns"><button class="cancel" onclick="closeOv('manageOv')" style="flex:none;padding:11px 24px">关闭</button></div>
    </div>
  </div>

  <!-- 重置密码(二级弹窗)-->
  <div class="ov" id="resetOv" style="z-index:420">
    <div class="modal">
      <h3>重置密码</h3>
      <p class="mdesc" id="rFor"></p>
      <label>新密码(至少 6 位)</label>
      <input id="rPass" type="text" placeholder="设置新密码">
      <p style="font-size:11.5px;color:var(--t4);margin-top:8px">重置后该用户当前所有登录会话立即失效,需用新密码重新登录。</p>
      <div class="mmsg" id="rMsg"></div>
      <div class="mbtns"><button class="cancel" onclick="closeOv('resetOv')">取消</button><button class="ok" id="rOk" onclick="submitReset()">确认重置</button></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  // 超管 API：独立端点 /admin/api/*（cookie lj_padmin），未登录跳超管登录页。
  async function PA(method, path, body){
    const opts={method,headers:{},credentials:'same-origin'};
    if(body!==undefined){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(body);}
    const res=await fetch('/admin'+path,opts);
    if(res.status===401){ location.href='/admin/login'; throw new Error('未登录'); }
    let data=null; try{ data=await res.json(); }catch{}
    if(!res.ok){ const e=new Error((data&&data.error)||`请求失败(${res.status})`); if(data&&data.code)e.code=data.code; throw e; }
    return data;
  }
  function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
  function closeOv(id){ document.getElementById(id).classList.remove('on'); }
  function fmtN(n){ return (n||0).toLocaleString('zh-CN'); }
  function fmtDate(ts){ const d=new Date(ts); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

  let curTenant=null; // 开户/充值的目标租户

  async function load(){
    try{
      const me=await PA('GET','/api/me');
      document.getElementById('who').textContent='超管 · '+me.username;
      const { tenants }=await PA('GET','/api/tenants');
      const rows=document.getElementById('rows');
      if(!tenants.length){ rows.innerHTML='<tr><td colspan="6" class="empty">还没有租户,点右上「新建租户」开始</td></tr>'; return; }
      rows.innerHTML=tenants.map(t=>`
        <tr>
          <td><div class="tn">${esc(t.name)}</div><div class="tid">${t.id}</div></td>
          <td><span class="bdg ${t.delivery==='private'?'bdg-priv':'bdg-host'}">${t.delivery==='private'?'私有化':'托管'}</span></td>
          <td>${t.user_count}</td>
          <td class="bal">${fmtN(t.balance)}</td>
          <td style="color:var(--t3);font-family:var(--f-mono);font-size:12px">${fmtDate(t.created_at)}</td>
          <td><div class="acts">
            <button class="act" onclick='openUser(${JSON.stringify(t.id)},${JSON.stringify(t.name)})'>开户</button>
            <button class="act pri" onclick='openGrantFor(${JSON.stringify(t.id)},${JSON.stringify(t.name)})'>充值</button>
            <button class="act" onclick='openManage(${JSON.stringify(t.id)})'>管理</button>
          </div></td>
        </tr>`).join('');
    }catch(e){ /* 401 已跳转 */ }
  }
  function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  // 新建租户
  function openTenant(){ document.getElementById('tName').value=''; document.getElementById('tMsg').textContent=''; document.getElementById('tenantOv').classList.add('on'); }
  async function submitTenant(){
    const name=document.getElementById('tName').value.trim();
    const msg=document.getElementById('tMsg');
    if(!name){ msg.textContent='机构名称不能为空'; return; }
    const ok=document.getElementById('tOk'); ok.disabled=true;
    try{ await PA('POST','/api/tenants',{name}); closeOv('tenantOv'); toast('✓ 租户已创建'); await load(); }
    catch(e){ msg.textContent=e.message; } finally{ ok.disabled=false; }
  }

  // 开户
  function openUser(id,name){ curTenant=id; document.getElementById('uFor').textContent=`为「${name}」开设账号`; document.getElementById('uName').value=''; document.getElementById('uPass').value=''; document.getElementById('uMsg').textContent=''; document.getElementById('userOv').classList.add('on'); }
  async function submitUser(){
    const username=document.getElementById('uName').value.trim();
    const password=document.getElementById('uPass').value;
    const role=document.getElementById('uRole').value;
    const msg=document.getElementById('uMsg');
    if(!username||!password){ msg.textContent='用户名和密码必填'; return; }
    if(password.length<6){ msg.textContent='密码至少 6 位'; return; }
    const ok=document.getElementById('uOk'); ok.disabled=true;
    try{ const u=await PA('POST',`/api/tenants/${curTenant}/users`,{username,password,role}); closeOv('userOv'); toast(`✓ 已开通 ${u.username}`); await load(); }
    catch(e){ msg.textContent=e.message; } finally{ ok.disabled=false; }
  }

  // 充值
  function openGrantFor(id,name){ curTenant=id; document.getElementById('gFor').textContent=`为「${name}」充值点数（记入审计）`; document.getElementById('gAmt').value='1000'; document.getElementById('gMsg').textContent=''; document.getElementById('grantOv').classList.add('on'); }
  document.querySelectorAll('#grantOv .qa button').forEach(b=>b.onclick=()=>{ document.getElementById('gAmt').value=b.dataset.v; });
  async function submitGrant(){
    const amount=parseInt(document.getElementById('gAmt').value,10);
    const msg=document.getElementById('gMsg');
    if(!amount||amount<=0){ msg.textContent='请输入正整数'; return; }
    const ok=document.getElementById('gOk'); ok.disabled=true; ok.textContent='充值中…'; // 防双击（D6）
    try{ const r=await PA('POST',`/api/tenants/${curTenant}/grant`,{amount}); closeOv('grantOv'); toast(`✓ 已充值 ${fmtN(amount)} 点，当前余额 ${fmtN(r.balance)}`); await load(); }
    catch(e){ msg.textContent=e.message; } finally{ ok.disabled=false; ok.textContent='确认充值'; }
  }

  // ── 租户详情管理 ──
  let mgTenant=null;       // 当前管理的租户对象(含 name/delivery/max_creator_seats)
  let resetUser=null;      // 当前重置密码的目标用户

  async function openManage(id){
    // 从已加载的租户列表拿基础信息(再补 max_creator_seats —— 列表已含)
    const { tenants }=await PA('GET','/api/tenants');
    const t=tenants.find(x=>x.id===id);
    if(!t){ toast('租户不存在'); return; }
    mgTenant=t;
    document.getElementById('mTitle').textContent='管理 · '+t.name;
    document.getElementById('mSub').textContent='机构 ID '+t.id;
    document.getElementById('mName').value=t.name;
    document.getElementById('mSeats').value=t.max_creator_seats;
    document.getElementById('mDelivery').value=t.delivery;
    document.getElementById('mSetMsg').textContent='';
    document.getElementById('manageOv').classList.add('on');
    await loadTenantUsers();
  }

  async function saveTenantSettings(){
    const name=document.getElementById('mName').value.trim();
    const maxCreatorSeats=parseInt(document.getElementById('mSeats').value,10);
    const delivery=document.getElementById('mDelivery').value;
    const msg=document.getElementById('mSetMsg');
    if(!name){ msg.textContent='机构名称不能为空'; return; }
    const btn=document.getElementById('mSetBtn'); btn.disabled=true;
    try{
      await PA('PUT',`/api/tenants/${mgTenant.id}`,{name,maxCreatorSeats,delivery});
      msg.style.color='var(--green)'; msg.textContent='✓ 已保存';
      mgTenant.name=name; mgTenant.delivery=delivery; mgTenant.max_creator_seats=maxCreatorSeats;
      document.getElementById('mTitle').textContent='管理 · '+name;
      await load(); // 刷新主表
      setTimeout(()=>{ msg.textContent=''; msg.style.color='var(--red)'; },1500);
    }catch(e){ msg.style.color='var(--red)'; msg.textContent=e.message; }
    finally{ btn.disabled=false; }
  }

  async function loadTenantUsers(){
    const box=document.getElementById('mUsers');
    try{
      const { users }=await PA('GET',`/api/tenants/${mgTenant.id}/users`);
      document.getElementById('mUserCount').textContent=users.length;
      if(!users.length){ box.innerHTML='<div class="empty" style="padding:20px">该租户暂无用户</div>'; return; }
      const ROLE={admin:['rbdg-admin','管理员'],creator:['rbdg-creator','创作者'],viewer:['rbdg-viewer','查看者']};
      box.innerHTML=users.map(u=>{
        const r=ROLE[u.role]||['rbdg-viewer',u.role];
        const off=u.status==='disabled';
        return `<div class="muser">
          <div class="ui"><div class="un">${esc(u.display_name||u.username)}<span class="rbdg ${r[0]}">${r[1]}</span>${off?'<span class="rbdg rbdg-off">已停用</span>':''}</div>
            <div class="meta">${esc(u.username)}</div></div>
          <div class="uacts">
            <button class="act" onclick='openReset(${JSON.stringify(u.id)},${JSON.stringify(u.username)})'>重置密码</button>
            <button class="act" onclick='toggleUser(${JSON.stringify(u.id)},${off?'"enable"':'"disable"'})'>${off?'启用':'停用'}</button>
          </div></div>`;
      }).join('');
    }catch(e){ box.innerHTML='<div class="empty" style="padding:20px">加载失败</div>'; }
  }

  function openReset(uid,username){
    resetUser=uid;
    document.getElementById('rFor').textContent=`为用户「${username}」设置新密码`;
    document.getElementById('rPass').value=''; document.getElementById('rMsg').textContent='';
    document.getElementById('resetOv').classList.add('on');
  }
  async function submitReset(){
    const newPassword=document.getElementById('rPass').value;
    const msg=document.getElementById('rMsg');
    if(!newPassword||newPassword.length<6){ msg.textContent='新密码至少 6 位'; return; }
    const ok=document.getElementById('rOk'); ok.disabled=true;
    try{ await PA('POST',`/api/tenants/${mgTenant.id}/users/${resetUser}/reset-password`,{newPassword}); closeOv('resetOv'); toast('✓ 密码已重置,该用户需重新登录'); }
    catch(e){ msg.textContent=e.message; } finally{ ok.disabled=false; }
  }
  async function toggleUser(uid,action){
    try{ await PA('POST',`/api/tenants/${mgTenant.id}/users/${uid}/${action}`); toast(action==='disable'?'✓ 已停用':'✓ 已启用'); await loadTenantUsers(); await load(); }
    catch(e){ toast(e.message); }
  }

  document.getElementById('logoutBtn').onclick=async()=>{ try{ await PA('POST','/logout'); }catch{} location.href='/admin/login'; };

  load();
</script>
</body>
</html>

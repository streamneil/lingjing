<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 图片 · 灵镜</title>
<link rel="icon" type="image/svg+xml" href="/brand/lingjing-favicon.svg">
<link rel="stylesheet" href="app.css">
<style>
  .img-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px; }
  .img-grid img { width:100%; border-radius:12px; display:block; background:var(--field); object-fit:cover; }
  /* item4:卡片元信息 + 动作 + 长词收展 */
  .card-meta { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 2px; }
  .card-meta .chip { font-size:11px; color:var(--t3); background:var(--field); border:1px solid var(--line); border-radius:7px; padding:2px 8px; }
  .card-acts { display:flex; gap:8px; margin-top:10px; }
  .card-acts button { display:inline-flex; align-items:center; gap:5px; font-size:12.5px; color:var(--t2); background:var(--field); border:1px solid var(--line); border-radius:9px; padding:7px 13px; cursor:pointer; transition:.15s; }
  .card-acts button:hover { border-color:var(--line-hi); color:var(--t1); }
  .card-acts button svg { width:14px; height:14px; }
  .tx.clamp { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .tx-toggle { font-size:12px; color:var(--blue); cursor:pointer; margin-top:4px; display:inline-block; }
  /* 大图查看器(点击图片放大,可关闭)*/
  .lightbox { position:fixed; inset:0; background:rgba(0,0,0,.88); backdrop-filter:blur(4px); z-index:500; display:none; align-items:center; justify-content:center; padding:40px; cursor:zoom-out; }
  .lightbox.on { display:flex; animation:fade .2s var(--ease-out); }
  .lightbox img { max-width:92vw; max-height:88vh; border-radius:12px; box-shadow:0 30px 80px -20px rgba(0,0,0,.8); cursor:default; }
  .lightbox .lb-x { position:absolute; top:22px; right:26px; width:42px; height:42px; border-radius:50%; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.18); display:grid; place-items:center; cursor:pointer; transition:.15s; }
  .lightbox .lb-x:hover { background:rgba(255,255,255,.22); }
  .lightbox .lb-x svg { width:22px; height:22px; color:#fff; }

  /* 二级 tab(图片转图片/文字转图片/模板)*/
  .sub-tabs { display:flex; gap:4px; background:var(--field); border:1px solid var(--line); border-radius:var(--r); padding:4px; margin-bottom:14px; }
  .sub-tabs button { flex:1; background:none; border:none; color:var(--t3); font-family:var(--f); font-size:13.5px; font-weight:500; padding:9px; border-radius:10px; cursor:pointer; transition:.15s; position:relative; }
  .sub-tabs button:hover { color:var(--t1); }
  .sub-tabs button.active { background:var(--card-hi); color:var(--t1); }
  .sub-tabs button .soon-dot { font-family:var(--f-mono); font-size:8px; color:var(--t4); border:1px solid var(--line); padding:0 4px; border-radius:3px; margin-left:5px; vertical-align:middle; }
  .sub-tabs button .hot { font-family:var(--f-en); font-size:9px; font-weight:700; color:var(--blue); background:var(--blue-bg); padding:1px 5px; border-radius:4px; margin-left:5px; vertical-align:middle; }

  /* 上传区(图转图,占位即将上线)*/
  .uploadbox { border:1.5px dashed var(--line-hi); border-radius:var(--r); padding:34px 20px; text-align:center; color:var(--t3); }
  .uploadbox svg { width:34px; height:34px; color:var(--t4); margin-bottom:10px; }
  .uploadbox .soon-tag { display:inline-block; margin-top:10px; font-family:var(--f-mono); font-size:10px; color:var(--blue); border:1px solid var(--blue); padding:3px 10px; border-radius:999px; }

  /* ── 图转图编辑器交互(主图大卡 + 局部重绘 + 参考图,与 ai-image-edit 一致)── */
  .mainimg-card { border:1px solid var(--line); border-radius:var(--r); background:var(--card); padding:14px; }
  .mainimg-stage { position:relative; min-height:150px; max-height:min(260px,30vh); display:grid; place-items:center; background:var(--field); border-radius:12px; overflow:hidden; }
  .mainimg-stage .pv-wrap { position:relative; display:inline-block; line-height:0; max-height:100%; }
  .mainimg-stage img.preview { max-width:100%; max-height:min(240px,28vh); border-radius:8px; display:block; }
  .mainimg-stage canvas.maskoverlay { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; border-radius:8px; }
  .mainimg-stage .del { position:absolute; top:10px; right:10px; width:34px; height:34px; border-radius:9px; background:rgba(0,0,0,.5); border:1px solid var(--line-hi); display:grid; place-items:center; cursor:pointer; z-index:3; }
  .mainimg-stage .del svg { width:17px; height:17px; color:var(--t2); }
  .mainimg-empty { width:100%; padding:34px 16px; text-align:center; cursor:pointer; }
  .mainimg-empty svg { width:34px; height:34px; color:var(--t3); }
  .mainimg-empty .t { font-size:13.5px; color:var(--t2); margin-top:9px; }
  .mainimg-empty .s { font-size:11px; color:var(--t4); margin-top:3px; }
  .maintool-bar { display:flex; align-items:center; justify-content:space-between; margin-top:12px; }
  .maintool-bar .lbl { display:flex; align-items:center; gap:7px; font-size:13px; color:var(--t2); }
  .maintool-bar .lbl svg { width:18px; height:18px; color:var(--blue); }
  .maintools { display:flex; gap:4px; background:var(--field); border:1px solid var(--line); border-radius:11px; padding:4px; }
  .maintools button { width:42px; height:34px; border-radius:8px; background:none; border:none; display:grid; place-items:center; cursor:pointer; color:var(--t3); transition:.12s; }
  .maintools button:hover { color:var(--t1); }
  .maintools button svg { width:18px; height:18px; }
  #refStrip { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  #refStrip:empty { display:none; }
  .refchip { position:relative; width:70px; height:70px; border-radius:10px; overflow:hidden; border:1px solid var(--line); background:var(--field); }
  .refchip img { width:100%; height:100%; object-fit:cover; display:block; }
  .refchip .rmx { position:absolute; top:-6px; right:-6px; width:20px; height:20px; background:var(--red,#ff5b5b); border-radius:50%; display:grid; place-items:center; color:#fff; font-size:12px; line-height:1; cursor:pointer; border:2px solid var(--card); }
  .refbtn { display:inline-flex; align-items:center; gap:7px; background:var(--field); border:1px solid var(--line); border-radius:10px; padding:8px 14px; font-size:12.5px; color:var(--t2); cursor:pointer; margin-top:10px; }
  .refbtn:hover { color:var(--t1); border-color:var(--line-hi); }
  .refbtn svg { width:16px; height:16px; }
  /* 局部重绘 大对话框 */
  .mkov { position:fixed; inset:0; background:rgba(0,0,0,.82); backdrop-filter:blur(6px); z-index:620; display:none; align-items:center; justify-content:center; padding:24px; }
  .mkov.on { display:flex; }
  .mksheet { background:#19191c; border:1px solid var(--line-hi); border-radius:18px; width:min(1040px,96vw); height:94vh; max-height:94vh; display:flex; flex-direction:column; overflow:hidden; }
  .mkhead { flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; padding:16px 22px; border-bottom:1px solid var(--line); }
  .mkhead h3 { font-size:17px; font-weight:700; margin:0; }
  .mkhead .x { width:34px; height:34px; border-radius:9px; display:grid; place-items:center; cursor:pointer; color:var(--t3); }
  .mkhead .x:hover { color:var(--t1); background:var(--field); }
  .mkbody { flex:1 1 auto; min-height:0; display:flex; flex-direction:column; padding:14px 22px; overflow:hidden; }
  .mkhints { flex:0 0 auto; display:flex; flex-direction:column; gap:5px; margin-bottom:10px; }
  .mkhints .h { display:flex; align-items:center; gap:9px; font-size:12.5px; color:var(--t3); }
  .mkhints .h svg { width:16px; height:16px; color:var(--t4); }
  .mkcanvas-wrap { flex:1 1 auto; min-height:0; display:grid; place-items:center; background:var(--field); border-radius:12px; padding:10px; overflow:hidden; }
  .mkcanvas-wrap canvas { border-radius:8px; cursor:crosshair; touch-action:none; display:block; }
  .mkcanvas-wrap canvas.pan { cursor:grab; }
  .mktoolbar { flex:0 0 auto; display:flex; align-items:center; gap:12px; margin-top:12px; }
  .mktoolbar .clear { background:var(--field); border:1px solid var(--line); color:var(--t2); border-radius:10px; padding:9px 16px; font-size:13px; cursor:pointer; }
  .mktoolbar .clear:hover { color:var(--t1); }
  .mktools { display:flex; align-items:center; gap:4px; background:var(--field); border:1px solid var(--line); border-radius:11px; padding:4px; margin-left:auto; }
  .mktools button { width:40px; height:36px; border-radius:8px; background:none; border:none; display:grid; place-items:center; cursor:pointer; color:var(--t3); transition:.12s; }
  .mktools button:hover { color:var(--t1); }
  .mktools button.on { background:var(--blue); color:#fff; }
  .mktools button:disabled { opacity:.35; cursor:default; }
  .mktools button svg { width:18px; height:18px; }
  .mktools .sep { width:1px; height:22px; background:var(--line); margin:0 3px; }
  .mkbrush { flex:0 0 auto; display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--t3); margin-top:10px; }
  .mkbrush input { width:180px; }
  .mkeditcard { flex:0 0 auto; margin-top:12px; border:1px solid var(--line); border-radius:12px; background:var(--card); padding:12px; }
  .mkeditcard .ttl { display:flex; align-items:center; gap:7px; font-size:13px; color:var(--t2); margin-bottom:9px; }
  .mkeditcard .ttl svg { width:16px; height:16px; color:var(--blue); }
  #mkRefStrip { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:9px; }
  #mkRefStrip:empty { display:none; }
  .mkeditcard textarea { width:100%; min-height:48px; max-height:80px; background:none; border:none; resize:none; color:var(--t1); font-size:13.5px; line-height:1.5; outline:none; font-family:inherit; }
  .mkeditcard textarea::placeholder { color:var(--t4); }
  .mkfoot { display:flex; align-items:center; justify-content:space-between; padding:14px 22px; border-top:1px solid var(--line); }
  .mkfoot .note { font-size:12px; color:var(--t4); }
  .mkfoot .acts { display:flex; gap:10px; }
  .mkfoot button { border-radius:10px; padding:9px 20px; font-size:13px; cursor:pointer; border:1px solid var(--line); }
  .mkfoot .cancel { background:var(--field); color:var(--t2); }
  .mkfoot .ok { background:var(--t1); color:#0A0A0B; font-weight:700; border-color:var(--t1); }

  /* 比例选择 */
  .ratio-row { display:flex; gap:5px; flex-wrap:nowrap; align-items:stretch; }
  /* 字形(高度随比例变)+ 标签整体居下对齐:格子等高 + 内容 flex-end 贴底 */
  .ratio-cell { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:4px; padding:8px 2px; border:1px solid var(--line); border-radius:9px; background:var(--field); color:var(--t3); cursor:pointer; transition:.15s; }
  .ratio-cell:hover { color:var(--t1); border-color:var(--line-hi); }
  .ratio-cell.on { background:var(--card-hi); color:var(--t1); border-color:var(--line-hi); }
  .ratio-cell .glyph { width:18px; height:18px; border:1.6px solid currentColor; border-radius:3px; }
  .ratio-cell .lbl { font-size:10.5px; font-family:var(--f-mono); }

  /* 解析度 / 输出 段选 */
  .seg-row { display:flex; gap:8px; }
  .seg-row .seg { flex:1; display:flex; align-items:center; justify-content:center; text-align:center; min-height:42px; padding:10px; border-radius:10px; background:var(--field); border:1px solid var(--line); color:var(--t3); font-size:13px; cursor:pointer; transition:.15s; }
  .seg-row .seg:hover { color:var(--t1); }
  .seg-row .seg.on { background:var(--card-hi); color:var(--t1); border-color:var(--line-hi); }

  .cfg-label { font-size:12px; color:var(--t3); margin:14px 0 7px; }
  .cfg-label:first-of-type { margin-top:0; }

  /* 模板选择行 */
  .tpl-pick { display:flex; align-items:center; gap:13px; padding:15px 16px; border:1px solid var(--line); border-radius:var(--r); background:var(--card); cursor:pointer; transition:.15s; }
  .tpl-pick:hover { border-color:var(--line-hi); }
  .tpl-pick .ti { width:46px; height:46px; border-radius:11px; background:var(--field); border:1px solid var(--line); display:grid; place-items:center; }
  .tpl-pick .ti svg { width:22px; height:22px; color:var(--t2); }
  .tpl-pick h5 { font-size:15px; font-weight:600; color:var(--t1); }
  .tpl-pick p { font-size:12px; color:var(--t4); margin-top:2px; }
</style>
</head>
<body data-page="ai-image" data-crumb="创作工具 > AI 图片">
<div class="shell" id="shell-mount">
 <div class="main-col">
  <div class="studio">
  <!-- 左:配置 -->
  <div class="cfg">
    <div class="cfg-h"><span class="dot"></span>AI 图像生成器</div>

    <!-- 二级 tab -->
    <div class="sub-tabs" id="subTabs">
      <button data-mode="img2img">图片转图片</button>
      <button class="active" data-mode="text2img">文字转图片</button>
      <button data-mode="template">模板<span class="hot">热门</span></button>
    </div>

    <!-- 图转图:主图大卡(可局部重绘)+ 参考图 + 授权(与 AI 图片编辑器一致)-->
    <div class="mode-pane" id="pane-img2img" style="display:none">
      <div class="mainimg-card">
        <div class="mainimg-stage" id="mainStage"></div>
        <div class="maintool-bar" id="mainToolBar" style="display:none">
          <div class="lbl">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5 4 4"/><path d="M13 7 8.7 2.7a2.4 2.4 0 0 0-3.4 0L2.7 5.3a2.4 2.4 0 0 0 0 3.4L7 13"/><path d="m8 14 8-8"/><path d="m2 22 5.5-1.5L21.6 6.4a2.1 2.1 0 0 0 0-3L18.6.4a2.1 2.1 0 0 0-3 0L1.5 14.5Z"/></svg>
            局部重绘
          </div>
          <div class="maintools" id="mainTools">
            <button type="button" data-tool="brush" title="画笔 — 打开局部重绘"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m9.06 11.9 8.07-8.06a2.85 2.85 0 1 1 4.03 4.03l-8.06 8.08"/><path d="M7.07 14.94c-1.66 0-3 1.35-3 3.02 0 1.33-2.5 1.52-2 2.02 1.08 1.1 2.49 2.02 4 2.02 2.2 0 4-1.8 4-4.04a3.01 3.01 0 0 0-3-3.02z"/></svg></button>
            <button type="button" data-tool="eraser" title="橡皮 — 打开局部重绘"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg></button>
            <button type="button" data-tool="pan" title="手形 — 打开局部重绘"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-2-2 2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2 2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2 2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg></button>
          </div>
        </div>
      </div>
      <div id="refStrip"></div>
      <div class="refbtn" id="refBtn" onclick="document.getElementById('refFile').click()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>
        <span id="refBtnLbl">参考图片 (0/2)</span>
      </div>
      <input type="file" id="mainFile" accept="image/jpeg,image/png,image/webp,image/bmp,image/tiff,image/gif,.jpg,.jpeg,.png,.webp,.bmp,.tiff,.gif" style="display:none">
      <input type="file" id="refFile" accept="image/jpeg,image/png,image/webp,image/bmp,image/tiff,image/gif,.jpg,.jpeg,.png,.webp,.bmp,.tiff,.gif" multiple style="display:none">
      <label style="display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--t3);cursor:pointer;margin-top:12px;line-height:1.5">
        <input type="checkbox" id="consentChk" style="width:auto;margin:2px 0 0">
        <span>我已获得图中人物的授权,并对编辑内容的合规性负责。</span>
      </label>
    </div>

    <!-- 模板选择(仅 template 模式)-->
    <div class="mode-pane" id="pane-template" style="display:none">
      <div class="tpl-pick" onclick="window.LJToast&&window.LJToast('模板库即将上线,可先用文字描述')">
        <div class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m12 3 2.4 5.6L20 9l-4.3 3.8L17 18l-5-2.7L7 18l1.3-5.2L4 9l5.6-.4Z"/></svg></div>
        <div><h5>模板</h5><p>为您的图像选择一个模板</p></div>
        <div style="margin-left:auto;color:var(--t4)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px"><path d="m9 6 6 6-6 6"/></svg></div>
      </div>
    </div>

    <!-- 提示词(text2img + template 共用)-->
    <div class="mode-pane" id="pane-prompt">
      <div class="cfg-label">提示</div>
      <div class="script">
        <textarea id="prompt" maxlength="2000" placeholder="详细描述您想要创建的图像…(如:一位新闻主播在演播室,正面，专业灯光)"></textarea>
        <div class="f"><span class="h" id="estLabel">预估 — 点</span><span class="c"><b id="cnt">0</b> / 2000</span></div>
      </div>
    </div>

    <div class="cfg-sp"></div>

    <!-- 紧凑配置栏:模型 pill + 设置 pill + 列表 toggle(贴 DeeVid 参考) -->
    <div class="cfgbar">
      <div class="pop-anchor" style="flex:1">
        <div class="cpill" id="modelPill" onclick="togglePop('model')"><span class="v" id="modelPillV">模型</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></div>
        <div class="pop" id="pop-model"><div class="pop-label">模型</div><div id="modelOpts"></div></div>
      </div>
      <div class="pop-anchor" style="flex:1.2">
        <div class="cpill" id="setPill" onclick="togglePop('set')"><span class="v" id="setPillV">1:1 · 1K · 1 张</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></div>
        <div class="pop" id="pop-set">
          <div class="pop-label">比例</div>
          <div class="ratio-row" id="ratioRow"></div>
          <div class="pop-label">清晰度</div>
          <div class="seg-row" id="resSeg"></div>
          <div class="pop-label">输出张数</div>
          <div class="seg-row" id="countSeg"></div>
        </div>
      </div>
      <div class="pop-anchor">
        <div class="cpill fixed" id="seedPill" onclick="togglePop('seed')" title="随机种子 Seed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
        <div class="pop" id="pop-seed" style="left:auto;right:0;width:200px">
          <div class="pop-label">Seed(随机种子)</div>
          <input id="seedInput" type="text" inputmode="numeric" placeholder="随机" style="width:100%;padding:9px 11px;background:var(--field);border:1px solid var(--line);border-radius:9px;color:var(--t1);font-size:13px;font-family:var(--f-mono)">
        </div>
      </div>
    </div>
    <div class="pop-ov" id="popOv" onclick="closePops()"></div>

    <div class="cbtn-wrap">
      <button class="cbtn" id="createBtn">
        <span id="cbtnLabel">创建</span> <span class="gem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M6 3h12l4 6-10 12L2 9l4-6Z"/></svg> <b id="estGem">—</b></span>
      </button>
    </div>
  </div>

  <!-- 右:对话流 / 样片画廊 -->
  <div class="feed">
    <div class="feed-tabs">
      <button class="ftab active" data-st="all">全部</button>
      <button class="ftab" data-st="running">生成中</button>
      <button class="ftab" data-st="done">已完成</button>
      <button class="ftab" data-st="failed">失败</button>
    </div>
    <div class="feed-list">
      <div class="fitem" id="sampleGallery" style="animation-delay:.02s">
        <div class="fmeta">

<div class="lightbox" id="lightbox" onclick="closeLightbox()">

<script src="shell.js"></script>
<script src="tools.js"></script>
<script src="api.js"></script>
<script>
  const ta=document.getElementById('prompt'), cnt=document.getElementById('cnt'), btn=document.getElementById('createBtn');
  const feedList=document.querySelector('.feed-list');
  let count=1, res='1K', ratio='1:1', mode='text2img', model='', allModels=[], seed='';

  const RES_ORDER={'1K':1,'2K':2,'4K':3};
  // ── 模型下拉(单一真相源:GET /image-models,自绘深色 popover)。按当前 mode 过滤 ──
  const modelOpts=document.getElementById('modelOpts');
  async function loadModels(){
    try{ const r=await LJ.get('/image-models'); allModels=r.models||[]; renderModels(); }
    catch(e){ modelOpts.innerHTML='<div class="pop-opt"><span class="nm">模型加载失败</span></div>'; }
  }
  function renderModels(){
    const usable=allModels.filter(m=>m.modes.includes(mode==='img2img'?'img2img':'text2img'));
    if(usable.length && !usable.find(m=>m.key===model)) model=usable[0].key;
    modelOpts.innerHTML=usable.map(m=>`<div class="pop-opt${m.key===model?' on':''}" data-k="${m.key}">
      <span class="nm">${esc(m.label)}</span>${m.maxResolution==='4K'?'<span class="tag">4K</span>':''}
      <svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg></div>`).join('')
      || '<div class="pop-opt"><span class="nm">该模式暂无可用模型</span></div>';
    modelOpts.querySelectorAll('.pop-opt[data-k]').forEach(el=>el.onclick=()=>{ model=el.dataset.k; renderModels(); closePops(); scheduleEstimate(); });
    renderRatios(); // 比例:有 resolutions 模型只显其录的比例(发官方 W×H)
    renderRes();    // 清晰度:有 resolutions 模型隐藏(尺寸由比例决定);无则按 maxResolution 显档
    renderCount();  // 张数按所选模型 maxImages
    syncPills();
    if(mode==='img2img' && typeof onI2iModelChange==='function') onI2iModelChange(); // 图转图:刷主图/参考图上限+局部重绘入口
  }
  // ── 清晰度按模型支持动态渲染;有 resolutions 表的模型隐藏清晰度(尺寸=比例决定)──
  function renderRes(){
    const m=allModels.find(x=>x.key===model);
    const resSeg=document.getElementById('resSeg');
    const resLbl=resSeg.previousElementSibling;
    if(m && m.resolutions && m.resolutions.length){
      // 模型录了分辨率表:尺寸由所选比例那条决定,不显清晰度档(避免与表冲突)
      resSeg.style.display='none'; if(resLbl&&resLbl.classList.contains('pop-label')) resLbl.style.display='none';
      return;
    }
    resSeg.style.display=''; if(resLbl&&resLbl.classList.contains('pop-label')) resLbl.style.display='';
    const maxR=RES_ORDER[m?m.maxResolution:'2K']||2;
    const opts=['1K','2K','4K'].filter(r=>RES_ORDER[r]<=maxR);
    if(!opts.includes(res)) res=opts[opts.length-1];
    resSeg.innerHTML=opts.map(r=>`<div class="seg${r===res?' on':''}" data-res="${r}">${r}</div>`).join('');
    resSeg.querySelectorAll('.seg').forEach(s=>s.onclick=()=>{ resSeg.querySelectorAll('.seg').forEach(x=>x.classList.remove('on')); s.classList.add('on'); res=s.dataset.res; syncPills(); scheduleEstimate(); });
  }
  // ── 输出张数按模型 maxImages 动态(修「选多张仍出 1 张」:固定 1 张的模型不给 2/3/4 假选项)──
  function renderCount(){
    const m=allModels.find(x=>x.key===model);
    const maxN=Math.min(4, (m&&m.maxImages)||1); // UI 上限 4(qwen-2.0 支持 6,但 UI 给 1-4 够用)
    const opts=[]; for(let i=1;i<=maxN;i++) opts.push(i);
    if(count>maxN) count=maxN;
    const countSeg=document.getElementById('countSeg');
    countSeg.innerHTML=opts.map(n=>`<div class="seg${n===count?' on':''}" data-n="${n}">${n}</div>`).join('');
    countSeg.querySelectorAll('.seg').forEach(s=>s.onclick=()=>{ countSeg.querySelectorAll('.seg').forEach(x=>x.classList.remove('on')); s.classList.add('on'); count=parseInt(s.dataset.n,10); syncPills(); scheduleEstimate(); });
    // 单张模型把「输出张数」标签也隐去(无意义)
    const lbl=countSeg.previousElementSibling; if(lbl&&lbl.classList.contains('pop-label')) lbl.style.display=maxN<=1?'none':'';
    countSeg.style.display=maxN<=1?'none':'';
  }

  // ── popover 开关 ──
  function togglePop(which){
    const map={model:'pop-model',set:'pop-set',seed:'pop-seed'}; const pillMap={model:'modelPill',set:'setPill',seed:'seedPill'};
    const el=document.getElementById(map[which]); const isOpen=el.classList.contains('show'); closePops();
    if(!isOpen){ el.classList.add('show'); document.getElementById('popOv').classList.add('show'); document.getElementById(pillMap[which]).classList.add('open'); }
  }
  function closePops(){ document.querySelectorAll('.pop.show').forEach(p=>p.classList.remove('show')); document.querySelectorAll('.cpill.open').forEach(p=>p.classList.remove('open')); document.getElementById('popOv').classList.remove('show'); }
  window.togglePop=togglePop; window.closePops=closePops;
  // ── 大图查看器(点击图片放大,点空白/X/Esc 关闭)──
  window.openLightbox=(url)=>{ document.getElementById('lightboxImg').src=url; document.getElementById('lightbox').classList.add('on'); };
  window.closeLightbox=()=>{ document.getElementById('lightbox').classList.remove('on'); document.getElementById('lightboxImg').src=''; };
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeLightbox(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closePops(); });
  document.getElementById('seedInput').addEventListener('input',e=>{ seed=e.target.value.replace(/[^0-9]/g,''); e.target.value=seed; });

  // ── pill 文案同步 ──
  function syncPills(){
    const m=allModels.find(x=>x.key===model);
    document.getElementById('modelPillV').textContent=m?m.label:'模型';
    // 有 resolutions 模型:显 比例 + 尺寸(如 16:9 · 2688×1536);无则显 比例 · 清晰度档。
    let sizePart=res;
    if(m && m.resolutions && m.resolutions.length){ const hit=m.resolutions.find(r=>r.ratio===ratio); sizePart=hit?`${hit.width}×${hit.height}`:''; }
    document.getElementById('setPillV').textContent=`${ratio==='auto'?'自动':ratio}${sizePart?' · '+sizePart:''}${mode==='img2img'?'':' · '+count+' 张'}`;
  }

  // ── 比例选择 ──
  // 写死 8 档(无 resolutions 模型回落用);有 resolutions 的模型只显其录的比例(发对应官方 W×H)。
  const RATIOS=[
    {v:'auto',l:'自动',w:18,h:18},{v:'16:9',l:'16:9',w:20,h:11},{v:'9:16',l:'9:16',w:11,h:20},
    {v:'1:1',l:'1:1',w:18,h:18},{v:'3:4',l:'3:4',w:14,h:18},{v:'4:3',l:'4:3',w:18,h:14},
    {v:'3:2',l:'3:2',w:19,h:13},{v:'2:3',l:'2:3',w:13,h:19},
  ];
  const RATIO_GLYPH={'auto':[18,18],'16:9':[20,11],'9:16':[11,20],'1:1':[18,18],'3:4':[14,18],'4:3':[18,14],'3:2':[19,13],'2:3':[13,19],'21:9':[20,9],'9:21':[9,20]};
  const ratioRow=document.getElementById('ratioRow');
  function renderRatios(){
    const m=allModels.find(x=>x.key===model);
    let cells;
    if(m && m.resolutions && m.resolutions.length){
      // 模型录了分辨率表:只显这些比例,选中默认那条
      const def=m.resolutions.find(r=>r.isDefault)||m.resolutions[0];
      if(!m.resolutions.find(r=>r.ratio===ratio)) ratio=def.ratio;
      cells=m.resolutions.map(r=>{ const g=RATIO_GLYPH[r.ratio]||[18,18];
        return {v:r.ratio,l:r.ratio,w:g[0],h:g[1]}; });
    } else {
      cells=RATIOS; if(!cells.find(r=>r.v===ratio)) ratio='1:1';
    }
    ratioRow.innerHTML=cells.map(r=>`<div class="ratio-cell${r.v===ratio?' on':''}" data-ratio="${r.v}"><span class="glyph" style="width:${r.w}px;height:${r.h}px"></span><span class="lbl">${r.l}</span></div>`).join('');
    ratioRow.querySelectorAll('.ratio-cell').forEach(c=>c.onclick=()=>{
      ratioRow.querySelectorAll('.ratio-cell').forEach(x=>x.classList.remove('on')); c.classList.add('on');
      ratio=c.dataset.ratio; syncPills(); scheduleEstimate();
    });
  }

  // ── 清晰度/张数由 renderRes/renderCount 按模型动态绑定 ──

  // ── 二级 tab 切换 ──
  document.querySelectorAll('#subTabs button').forEach(b=>b.onclick=()=>{
    const m=b.dataset.mode;
    document.querySelectorAll('#subTabs button').forEach(x=>x.classList.remove('active')); b.classList.add('active');
    mode=m;
    document.getElementById('pane-img2img').style.display = m==='img2img'?'':'none';
    document.getElementById('pane-template').style.display = m==='template'?'':'none';
    document.getElementById('pane-prompt').style.display = '';   // 三模式都用提示词
    ta.placeholder = m==='img2img' ? '描述您的编辑(新增、移除、替换)。在主图上用画笔标记区域,或上传参考图来指定更改部分。' : '详细描述您想要创建的图像…';
    renderModels(); // 模型按 mode 过滤(img2img 只列编辑模型)+ 图转图刷主图/参考图
    refreshBtn();
  });

  function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  // ── 图转图编辑器交互:主图(唯一可涂抹)+ 参考图 + 局部重绘大对话框(与 ai-image-edit 一致)──
  const OK_TYPES=['image/jpeg','image/png','image/webp','image/bmp','image/tiff','image/gif'];
  const MAX_BYTES=10*1024*1024;
  function isHeic(f){ return /heic|heif/i.test(f.type) || /\.heic$|\.heif$/i.test(f.name||''); }
  function validFile(f){
    if(isHeic(f)){ window.LJToast&&window.LJToast('暂不支持 HEIC,请在相册导出为 JPG 或截图后上传','err'); return false; }
    const okType=OK_TYPES.includes(f.type) || (!f.type && /\.(jpe?g|png|webp|bmp|tiff?|gif)$/i.test(f.name||''));
    if(!okType){ window.LJToast&&window.LJToast('不支持的格式,请用 JPG/PNG/WEBP','err'); return false; }
    if(f.size>MAX_BYTES){ window.LJToast&&window.LJToast('图片超过 10MB,请压缩后上传','err'); return false; }
    return true;
  }
  function readDataUrl(f){ return new Promise((ok,no)=>{ const fr=new FileReader(); fr.onload=()=>ok(fr.result); fr.onerror=no; fr.readAsDataURL(f); }); }
  function i2iModel(){ return allModels.find(x=>x.key===model); }
  function i2iSupportsBbox(){ const m=i2iModel(); return !!(m&&m.supportsBbox); }
  function i2iMaxInput(){ const m=i2iModel(); return m?m.maxInputImages:3; }
  function maxRefs(){ return Math.max(0, i2iMaxInput()-1); } // 主图占 1 张

  // 主图
  let mainFile=null; // { file, dataUrl, natW, natH, bbox, strokes }
  let baseImg=null;
  const mainStage=document.getElementById('mainStage');
  async function setMainImage(file){
    if(!validFile(file)) return;
    const dataUrl=await readDataUrl(file);
    const im=new Image();
    im.onload=()=>{ mainFile={ file, dataUrl, natW:im.naturalWidth, natH:im.naturalHeight, bbox:null, strokes:[] }; baseImg=im; renderMain(); refreshBtn(); scheduleEstimate(); };
    im.src=dataUrl;
  }
  function renderMain(){
    const bar=document.getElementById('mainToolBar');
    if(!mainFile){
      mainStage.innerHTML=`<div class="mainimg-empty" onclick="document.getElementById('mainFile').click()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>
        <div class="t">点击或拖放主图以上传</div>
        <div class="s">支持 JPG / PNG / WEBP / BMP / TIFF / GIF,≤ 10MB(暂不支持 HEIC)</div></div>`;
      bar.style.display='none'; return;
    }
    mainStage.innerHTML=`<div class="pv-wrap"><div class="del" id="mainDel" title="删除主图"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></div><img class="preview" src="${mainFile.dataUrl}"><canvas class="maskoverlay" id="mainOverlay"></canvas></div>`;
    document.getElementById('mainDel').onclick=()=>{ mainFile=null; baseImg=null; renderMain(); refreshBtn(); scheduleEstimate(); };
    drawMainOverlay();
    bar.style.display=i2iSupportsBbox()?'':'none'; // 仅支持 bbox 的模型显入口(千问编辑整图)
  }
  function drawMainOverlay(){
    const cv=document.getElementById('mainOverlay'); if(!cv||!mainFile) return;
    cv.width=mainFile.natW; cv.height=mainFile.natH;
    const x=cv.getContext('2d'); x.clearRect(0,0,cv.width,cv.height);
    x.fillStyle='rgba(122,90,248,.42)';
    (mainFile.strokes||[]).forEach(([px,py,r])=>{ x.beginPath(); x.arc(px,py,r,0,Math.PI*2); x.fill(); });
  }
  document.getElementById('mainTools').querySelectorAll('button[data-tool]').forEach(b=>b.onclick=()=>openMask(b.dataset.tool));
  document.getElementById('mainFile').onchange=(e)=>{ if(e.target.files[0]) setMainImage(e.target.files[0]); e.target.value=''; };
  mainStage.addEventListener('dragover',e=>{e.preventDefault();}); mainStage.addEventListener('drop',e=>{e.preventDefault(); if(e.dataTransfer.files[0]) setMainImage(e.dataTransfer.files[0]);});

  // 参考图(imageRefs[1..],不涂抹)
  let refFiles=[]; // [{file, dataUrl}]
  const refFileInput=document.getElementById('refFile');
  async function addRefs(list){
    for(const f of list){
      if(refFiles.length>=maxRefs()){ window.LJToast&&window.LJToast('该模型最多 '+maxRefs()+' 张参考图','err'); break; }
      if(!validFile(f)) continue;
      const dataUrl=await readDataUrl(f); refFiles.push({ file:f, dataUrl });
    }
    renderRefs(); syncMkEditCard(); refreshBtn(); scheduleEstimate();
  }
  refFileInput.onchange=()=>{ addRefs(refFileInput.files); refFileInput.value=''; };
  function refChipHtml(r,i){ return `<div class="refchip"><img src="${r.dataUrl}"><div class="rmx" data-rm="${i}">×</div></div>`; }
  function removeRef(i){ refFiles.splice(i,1); renderRefs(); syncMkEditCard(); refreshBtn(); scheduleEstimate(); }
  function renderRefs(){
    const strip=document.getElementById('refStrip');
    strip.innerHTML=refFiles.map(refChipHtml).join('');
    strip.querySelectorAll('[data-rm]').forEach(el=>el.onclick=()=>removeRef(Number(el.dataset.rm)));
    document.getElementById('refBtnLbl').textContent=`参考图片 (${refFiles.length}/${maxRefs()})`;
  }

  // ── 局部重绘大对话框 ──
  let mkTool='brush', mkBrushSz=34, mkDrawing=false, mkScale=1, mkCtx=null, mkBaseImg=null;
  let mkStrokes=[], mkUndoStack=[], mkRedoStack=[];
  const mkCanvas=document.getElementById('mkCanvas');
  function openMask(primeTool){
    if(!mainFile || !i2iSupportsBbox()) return;
    mkTool=primeTool||'brush'; mkStrokes=(mainFile.strokes||[]).slice(); mkUndoStack=[]; mkRedoStack=[];
    syncMkEditCard();
    const im=new Image();
    im.onload=()=>{
      mkCanvas.width=im.naturalWidth; mkCanvas.height=im.naturalHeight;
      mkCtx=mkCanvas.getContext('2d'); mkBaseImg=im; redrawMk(); applyMkTool(); updateUndoRedo();
      document.getElementById('mkOv').classList.add('on');
      requestAnimationFrame(fitCanvas);
    };
    im.src=mainFile.dataUrl;
  }
  function fitCanvas(){
    if(!mkBaseImg) return;
    const wrap=document.querySelector('.mkcanvas-wrap'); if(!wrap) return;
    const cs=getComputedStyle(wrap), padX=parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight), padY=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom);
    const availW=Math.max(40, wrap.clientWidth-padX), availH=Math.max(40, wrap.clientHeight-padY);
    const scale=Math.min(availW/mkBaseImg.naturalWidth, availH/mkBaseImg.naturalHeight);
    mkScale=scale;
    mkCanvas.style.width=(mkBaseImg.naturalWidth*scale)+'px'; mkCanvas.style.height=(mkBaseImg.naturalHeight*scale)+'px';
  }
  window.addEventListener('resize',()=>{ if(document.getElementById('mkOv').classList.contains('on')) fitCanvas(); });
  function redrawMk(){
    if(!mkCtx||!mkBaseImg) return;
    mkCtx.clearRect(0,0,mkCanvas.width,mkCanvas.height); mkCtx.drawImage(mkBaseImg,0,0);
    mkCtx.fillStyle='rgba(122,90,248,.5)';
    mkStrokes.forEach(([x,y,r])=>{ mkCtx.beginPath(); mkCtx.arc(x,y,r,0,Math.PI*2); mkCtx.fill(); });
  }
  function mkXY(e){ const r=mkCanvas.getBoundingClientRect(); const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left; const cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top; return [cx*(mkCanvas.width/r.width), cy*(mkCanvas.height/r.height)]; }
  mkCanvas.addEventListener('pointerdown',e=>{ if(mkTool==='pan')return; mkDrawing=true; mkUndoStack.push(mkStrokes.length); mkRedoStack=[]; mkPaint(mkXY(e)); });
  mkCanvas.addEventListener('pointermove',e=>{ if(!mkDrawing||mkTool==='pan')return; mkPaint(mkXY(e)); });
  window.addEventListener('pointerup',()=>{ if(mkDrawing){ mkDrawing=false; updateUndoRedo(); } });
  function mkPaint([x,y]){
    if(mkTool==='eraser'){ mkStrokes=mkStrokes.filter(([sx,sy])=>Math.hypot(sx-x,sy-y)>mkBrushSz); redrawMk(); }
    else { mkStrokes.push([x,y,mkBrushSz]); mkCtx.fillStyle='rgba(122,90,248,.5)'; mkCtx.beginPath(); mkCtx.arc(x,y,mkBrushSz,0,Math.PI*2); mkCtx.fill(); }
  }
  function applyMkTool(){ document.querySelectorAll('#mkTools button[data-tool]').forEach(b=>b.classList.toggle('on', b.dataset.tool===mkTool)); mkCanvas.classList.toggle('pan', mkTool==='pan'); }
  document.getElementById('mkTools').querySelectorAll('button[data-tool]').forEach(b=>b.onclick=()=>{ mkTool=b.dataset.tool; applyMkTool(); });
  document.getElementById('mkBrush').oninput=(e)=>{ mkBrushSz=Number(e.target.value); };
  document.getElementById('mkClear').onclick=()=>{ mkUndoStack.push(mkStrokes.length); mkStrokes=[]; mkRedoStack=[]; redrawMk(); updateUndoRedo(); };
  document.getElementById('mkUndo').onclick=()=>{ if(!mkUndoStack.length)return; mkRedoStack.push(mkStrokes.slice()); const cut=mkUndoStack.pop(); mkStrokes=mkStrokes.slice(0,cut); redrawMk(); updateUndoRedo(); };
  document.getElementById('mkRedo').onclick=()=>{ if(!mkRedoStack.length)return; mkUndoStack.push(mkStrokes.length); mkStrokes=mkRedoStack.pop(); redrawMk(); updateUndoRedo(); };
  function updateUndoRedo(){ document.getElementById('mkUndo').disabled=!mkUndoStack.length; document.getElementById('mkRedo').disabled=!mkRedoStack.length; }
  document.addEventListener('keydown',e=>{
    if(!document.getElementById('mkOv').classList.contains('on'))return;
    if(e.code==='Space'){ e.preventDefault(); if(mkTool!=='pan'){ mkCanvas.dataset.prev=mkTool; mkTool='pan'; applyMkTool(); } }
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){ e.preventDefault(); document.getElementById('mkUndo').click(); }
  });
  document.addEventListener('keyup',e=>{ if(e.code==='Space'&&mkCanvas.dataset.prev){ mkTool=mkCanvas.dataset.prev; delete mkCanvas.dataset.prev; applyMkTool(); } });
  function closeMask(commit){
    if(commit && mainFile){ mainFile.strokes=mkStrokes.slice(); mainFile.bbox=strokesToBoxes(mkStrokes, mainFile.natW, mainFile.natH); drawMainOverlay(); scheduleEstimate(); }
    document.getElementById('mkOv').classList.remove('on');
  }
  window.closeMask=closeMask;
  function strokesToBoxes(pts, W, H){
    if(!pts.length) return null;
    const rects=pts.map(([x,y,r])=>[x-r,y-r,x+r,y+r]);
    const xs=pts.map(p=>p[0]).sort((a,b)=>a-b);
    let splitX=null;
    for(let i=1;i<xs.length;i++){ if(xs[i]-xs[i-1] > W*0.22){ splitX=(xs[i]+xs[i-1])/2; break; } }
    function bound(list){ const x1=Math.max(0,Math.floor(Math.min(...list.map(r=>r[0])))); const y1=Math.max(0,Math.floor(Math.min(...list.map(r=>r[1])))); const x2=Math.min(W,Math.ceil(Math.max(...list.map(r=>r[2])))); const y2=Math.min(H,Math.ceil(Math.max(...list.map(r=>r[3])))); return [x1,y1,x2,y2]; }
    let boxes;
    if(splitX!=null){ const left=rects.filter((_,i)=>pts[i][0]<splitX), right=rects.filter((_,i)=>pts[i][0]>=splitX); boxes=[bound(left),bound(right)].filter(b=>b[2]>b[0]&&b[3]>b[1]); }
    else { boxes=[bound(rects)]; }
    return boxes.slice(0,2);
  }
  // 对话框嵌「编辑图片」卡 ↔ 主面板提示词/参考图 双向同步
  function syncMkEditCard(){
    const strip=document.getElementById('mkRefStrip');
    strip.innerHTML=refFiles.map(refChipHtml).join('');
    strip.querySelectorAll('[data-rm]').forEach(el=>el.onclick=()=>removeRef(Number(el.dataset.rm)));
    document.getElementById('mkRefBtnLbl').textContent=`参考图片 (${refFiles.length}/${maxRefs()})`;
    document.getElementById('mkPrompt').value=ta.value;
  }
  const mkPromptEl=document.getElementById('mkPrompt');
  mkPromptEl.addEventListener('input',()=>{ ta.value=mkPromptEl.value; cnt.textContent=ta.value.length; refreshBtn(); scheduleEstimate(); });

  // 提交顺序:主图在前(imageRefs[0]),参考图随后;bboxList 对齐(主图框 + 参考图都 [])
  function orderedI2iFiles(){ const arr=[]; if(mainFile) arr.push(mainFile.file); refFiles.forEach(r=>arr.push(r.file)); return arr; }
  function buildBboxList(refsLen){
    if(!i2iSupportsBbox() || !mainFile || !mainFile.bbox || !mainFile.bbox.length) return undefined;
    const arr=[mainFile.bbox]; for(let i=1;i<refsLen;i++) arr.push([]);
    return arr;
  }
  // 模型变化:参考图超额裁剪、不支持 bbox 清涂抹、刷新上限
  function onI2iModelChange(){
    if(refFiles.length>maxRefs()) refFiles=refFiles.slice(0,maxRefs());
    if(!i2iSupportsBbox() && mainFile){ mainFile.bbox=null; mainFile.strokes=[]; }
    renderMain(); renderRefs(); syncMkEditCard();
  }
  function useSample(p){ ta.value=p; cnt.textContent=p.length; refreshBtn(); scheduleEstimate(); ta.focus(); window.LJToast&&window.LJToast('✓ 已套用示范提示词,可改后生成'); }

  let estTimer=null;
  function scheduleEstimate(){
    clearTimeout(estTimer);
    estTimer=setTimeout(async()=>{
      if(!ta.value.trim()){ document.getElementById('estLabel').textContent='预估 — 点'; document.getElementById('estGem').textContent='—'; return; }
      try{
        const r=await LJ.post('/jobs/estimate',{type:'ai_image',model,mode,count,resolution:res});
        document.getElementById('estLabel').textContent='预估 '+r.cost+' 点';
        document.getElementById('estGem').textContent=r.cost;
      }catch(e){}
    },350);
  }
  function refreshBtn(){
    const hasPrompt=ta.value.trim().length>0;
    let ok=hasPrompt, label='创建';
    if(!hasPrompt){ ok=false; label='请输入提示词'; }
    if(mode==='img2img'){
      // 万相2.7(supportsBbox)允许 0 图纯生成;千问编辑需主图。主图或参考图任一即算有图。
      const needImg = !i2iSupportsBbox();
      const hasImg = !!mainFile || refFiles.length>0;
      if(needImg && !hasImg){ ok=false; label='请上传主图'; }
      else if(!document.getElementById('consentChk').checked){ ok=false; label='请勾选授权确认'; }
      else if(!hasPrompt){ ok=false; label='请输入编辑指令'; }
    }
    btn.classList.toggle('ready',ok); btn.disabled=!ok;
    document.getElementById('cbtnLabel').textContent=label;
  }
  document.getElementById('consentChk').onchange=refreshBtn;
  ta.addEventListener('input',()=>{ cnt.textContent=ta.value.length; var mp=document.getElementById('mkPrompt'); if(mp) mp.value=ta.value; refreshBtn(); scheduleEstimate(); });

  document.querySelectorAll('.ftab').forEach(t=>t.onclick=function(){
    this.parentNode.querySelectorAll('.ftab').forEach(x=>x.classList.remove('active')); this.classList.add('active');
    const k=this.dataset.st;
    document.querySelectorAll('.feed-list .fitem[id^=job-]').forEach(it=>{ it.style.display=(k==='all'||(it.dataset.st||'')===k)?'':'none'; });
  });

  const jobInputs={}; // id → 原始 input(重新生成回放,item4)

  // 提示词气泡:长词默认收起 + 展开/收起(item4)
  function promptBubble(p){
    const t=esc(p||''); const long=(p||'').length>80;
    return `<div class="fbubble"><div class="tx${long?' clamp':''}">${t}</div>${long?'<span class="tx-toggle" onclick="this.previousElementSibling.classList.toggle(\'clamp\');this.textContent=this.previousElementSibling.classList.contains(\'clamp\')?\'展开\':\'收起\'">展开</span>':''}</div>`;
  }
  // 元信息 chips(模型·比例·清晰度,item4)
  function metaChips(job){
    const c=[]; if(job.modelLabel) c.push(job.modelLabel);
    if(job.ratio) c.push(job.ratio==='auto'?'自动比例':job.ratio); if(job.resolution) c.push(job.resolution);
    return c.length?`<div class="card-meta">${c.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>`:'';
  }
  // 动作按钮(重新生成 + 下载;成功/失败都有重新生成,item4)
  function cardActs(job,ok){
    const re=`<button onclick="regenJob('${job.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>重新生成</button>`;
    const dl=ok&&(job.outputUrls||[]).length?`<button onclick="downloadImgs('${job.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14"/></svg>下载</button>`:'';
    return `<div class="card-acts">${re}${dl}</div>`;
  }

  function renderCard(job){
    document.getElementById('sampleGallery').style.display='none';
    if(job.input) jobInputs[job.id]=job.input; // detail 带 input;list 带散字段
    let card=document.getElementById('job-'+job.id);
    if(!card){ card=document.createElement('div'); card.className='fitem'; card.id='job-'+job.id; feedList.insertBefore(card, feedList.firstChild); }
    const head=(color,led,txt)=>`<div class="fmeta"><b>AI 图片</b><span class="ts">刚刚</span><span class="sp"></span><span class="st" style="color:${color}"><span class="led ${led}"></span>${txt}</span></div>`;
    // 图按比例显示(item4):ratio→aspect-ratio
    const ar=(job.ratio&&job.ratio!=='auto')?job.ratio.replace(':','/'):'1/1';
    if(job.status==='queued'||job.status==='running'){
      card.dataset.st='running';
      card.innerHTML=head('var(--amber)','led-run',job.status==='queued'?'排队中':'生成中')+promptBubble(job.prompt)+metaChips(job)+
        `<div class="fvideo proc"><div class="proc-in"><div class="spinner"></div><div class="lbl">${job.progress?('进度 '+job.progress+'%'):'已进入生成队列'}</div><div class="proc-bar"><i style="width:${job.progress||8}%"></i></div></div></div>`;
    } else if(job.status==='done'){
      card.dataset.st='done';
      const imgs=(job.outputUrls||[]).map(u=>`<img src="${u}" style="aspect-ratio:${ar};cursor:zoom-in" onclick="openLightbox('${u}')" title="点击查看大图">`).join('');
      card.innerHTML=head('var(--green)','led-ok','已完成')+promptBubble(job.prompt)+metaChips(job)+
        `<div class="img-grid">${imgs||'<div style="color:var(--t4);padding:20px">已生成</div>'}</div>`+cardActs(job,true);
    } else {
      card.dataset.st='failed';
      card.innerHTML=head('var(--red)','led-err','生成失败')+promptBubble(job.prompt)+metaChips(job)+
        `<div class="fvideo err"><div class="err-in"><div class="ei">!</div><div class="lbl">${esc(job.error||'生成失败,请重试')}</div></div></div>`+cardActs(job,false);
    }
  }

  // 重新生成(同 input 再提交;img2img 复用原 imageRefs+授权,不重新 consent,P2-regen-consent)
  window.regenJob=async(id)=>{
    const inp=jobInputs[id]; if(!inp){ window.LJToast&&window.LJToast('原参数丢失,无法重新生成','err'); return; }
    try{
      const res2=await LJ.createJob({ type:'ai_image', model:inp.model, mode:inp.mode||'text2img', prompt:inp.prompt,
        imageRefs:inp.imageRefs, count:inp.count, resolution:inp.resolution, ratio:inp.ratio, seed:inp.seed });
      renderCard({ id:res2.id, status:'queued', progress:0, prompt:inp.prompt, modelLabel:findLabel(inp.model), ratio:inp.ratio, resolution:inp.resolution });
      track(res2.id, inp.prompt);
      window.LJToast&&window.LJToast('✓ 已重新提交生成');
    }catch(e){ window.LJToast&&window.LJToast('重新生成失败:'+e.message,'err'); }
  };
  function findLabel(k){ const m=allModels.find(x=>x.key===k); return m?m.label:undefined; }
  // 下载(P1-download:跨域签名 URL,a[download] 无效 → fetch blob → 同源 objectURL 下载)
  window.downloadImgs=async(id)=>{
    const card=document.getElementById('job-'+id); const imgs=card?[...card.querySelectorAll('.img-grid img')]:[];
    for(let i=0;i<imgs.length;i++){
      try{ const r=await fetch(imgs[i].src); const b=await r.blob(); const u=URL.createObjectURL(b);
        const a=document.createElement('a'); a.href=u; a.download=`lingjing-${id}-${i+1}.png`; a.click(); URL.revokeObjectURL(u);
      }catch(e){ window.open(imgs[i].src,'_blank'); }
    }
  };

  async function track(id, prompt){ try{ await LJ.pollJob(id, (job)=>renderCard({...job, prompt, ...(jobInputs[id]?{modelLabel:findLabel(jobInputs[id].model),ratio:jobInputs[id].ratio,resolution:jobInputs[id].resolution}:{})})); }catch(e){} }

  async function loadHistory(){
    let jobs=[]; try{ jobs=await LJ.listJobs(); }catch(e){ return; }
    const mine=jobs.filter(j=>j.type==='ai_image');
    if(!mine.length) return;
    document.getElementById('sampleGallery').style.display='none';
    // list 已带 model/ratio/resolution/imageRefs 等(免 N+1);存 input 供重新生成。
    for(const j of [...mine].sort((a,b)=>(a.createdAt||0)-(b.createdAt||0))){
      jobInputs[j.id]={ model:j.model, mode:j.mode, prompt:j.script, imageRefs:j.imageRefs, count:j.count, resolution:j.resolution, ratio:j.ratio, seed:j.seed };
      renderCard({...j, prompt:j.script});
      if(j.status==='queued'||j.status==='running') track(j.id, j.script);
    }
  }

  // 图转图:multipart 上传输入图(主图在前 + 参考图),拿 imageRefs
  async function uploadInputImages(){
    const files=orderedI2iFiles(); if(!files.length) return [];
    const fd=new FormData();
    files.forEach(f=>fd.append('images', f));
    fd.append('consent','true');
    const r=await fetch('/api/image-uploads',{method:'POST',body:fd,credentials:'same-origin'});
    if(!r.ok){ const j=await r.json().catch(()=>({})); throw new Error(j.error||('上传失败 '+r.status)); }
    return (await r.json()).imageRefs;
  }

  btn.addEventListener('click', async ()=>{
    if(btn.disabled) return;
    const prompt=ta.value.trim(); if(!prompt) return;
    btn.disabled=true; const prev=btn.innerHTML; btn.textContent='提交中…';
    try{
      let payload;
      if(mode==='img2img'){
        btn.textContent='上传中…';
        const imageRefs=await uploadInputImages();
        payload={ type:'ai_image', model, mode:'img2img', prompt, imageRefs, resolution:res, count, seed:seed||undefined };
        const bb=buildBboxList(imageRefs.length); if(bb) payload.bboxList=bb;
      } else {
        payload={ type:'ai_image', model, mode:'text2img', prompt, count, resolution:res, ratio, seed:seed||undefined };
      }
      btn.textContent='提交中…';
      const res2=await LJ.createJob(payload);
      jobInputs[res2.id]={ model:payload.model, mode:payload.mode, prompt, imageRefs:payload.imageRefs, count:payload.count, resolution:payload.resolution, ratio:payload.ratio, seed:payload.seed, bboxList:payload.bboxList };
      renderCard({ id:res2.id, status:'queued', progress:0, prompt, modelLabel:findLabel(model), ratio:(mode==='img2img'?undefined:ratio), resolution:res, count });
      track(res2.id, prompt);
      ta.value=''; cnt.textContent='0';
      if(mode==='img2img'){ mainFile=null; baseImg=null; refFiles=[]; if(mkPromptEl) mkPromptEl.value=''; renderMain(); renderRefs(); syncMkEditCard(); document.getElementById('consentChk').checked=false; }
      scheduleEstimate();
      window.LJToast&&window.LJToast('✓ 已提交生成,可在右侧查看进度');
    }catch(e){ window.LJToast&&window.LJToast('提交失败:'+e.message,'err'); }
    finally{ btn.innerHTML=prev; refreshBtn(); }
  });

  LJ.me().then(()=>{ loadModels(); loadHistory(); }).catch(()=>{});
  refreshBtn();
</script>
</body>
</html>

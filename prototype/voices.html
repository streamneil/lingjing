<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音色库 · 灵镜</title>
<link rel="icon" type="image/svg+xml" href="/brand/lingjing-favicon.svg">
<link rel="stylesheet" href="app.css">
</head>
<body data-page="voices" data-crumb="创作 > 音色库">
<div class="shell" id="shell-mount">
  <div class="main-col">
    <main class="page">
      <div class="ph">
        <div><h1 class="t-h1">音色库</h1><p class="desc">预置人声可逐个试听,以及上传 5–30s 样本克隆、或用文字描述设计专属音色。配音可调语速 0.5–2 倍与音量。</p></div>
        <button class="btn btn-white" id="cloneBtn" onclick="cloneVoiceFlow()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg>克隆新音色</button>
        <input type="file" id="voiceSample" accept="audio/*" style="display:none">
        <input type="file" id="voiceProof" accept="image/*,application/pdf" style="display:none">
      </div>
      <div class="bar">
        <button class="chip active">我的音色</button><button class="chip">预置人声</button>
        <div class="sp"></div>
        <div class="msel" style="min-width:140px">语言：全部 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></div>
        <div class="msel" style="min-width:140px">性别：全部 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></div>
      </div>
      <div class="ss-body" id="voiceGrid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr));padding:0;display:grid;gap:12px;"></div>
    </main>
  </div>
</div>

<!-- 克隆音色 弹窗(替代 prompt+confirm 原生弹框)-->
<div class="ov" id="ov-cloneVoice"><div class="modal">
  <div class="mh"><h3>克隆新音色</h3><div class="mc" onclick="closeModal('cloneVoice')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></div></div>
  <div class="mb">
    <div class="iline"><label>音色名称</label><input id="cvName" placeholder="例如：我的克隆音色" maxlength="40" oninput="refreshCvBtn()" onkeydown="if(event.key==='Enter')submitClone()"></div>
    <div class="uzone" id="cvUzone" onclick="document.getElementById('voiceSample').click()">
      <div class="ubox" id="cvUboxEmpty"><div class="u" id="cvSampleLabel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg>上传 5–30s 语音样本</div></div>
      <div class="upreview" id="cvPreview" style="display:none"><div class="upreview-bar"><span id="cvSampleName"></span><button type="button" class="upreview-x" onclick="event.stopPropagation();clearCvUpload()">重新选择</button></div></div>
    </div>
    <div class="rtitle">样本要求</div><div class="rsub">单人清晰语音，5–30 秒，无背景音乐与噪声；格式 mp3 / wav / m4a。</div>
    <div class="consent" id="cvConsent" role="checkbox" aria-checked="false" tabindex="0" aria-label="确认已获本人授权并接受服务条款与隐私政策" onclick="toggleCvConsent()" onkeydown="if(event.key===' '||event.key==='Enter'){event.preventDefault();toggleCvConsent();}" style="cursor:pointer">
      <div class="ck" id="cvConsentBox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg></div>
      <div>我确认已获被克隆人<b style="color:var(--t1)">本人授权</b>(年满 18 岁,声音属本人或已书面授权),并接受 <a href="terms.html" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:var(--blue)">服务条款</a> 与 <a href="privacy.html" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:var(--blue)">隐私政策</a>。<a onclick="event.stopPropagation();document.getElementById('voiceProof').click()" style="color:var(--blue);cursor:pointer">上传授权凭证(可选)</a> <span id="cvProofName" style="color:var(--t4);font-size:11px"></span></div>
    </div>
    <button class="btn btn-white" id="cvSubmitBtn" style="width:100%;padding:15px;font-size:15px" onclick="submitClone()">克隆音色</button>
  </div>
</div></div>
<script src="shell.js"></script>
<script src="app.js"></script>
<script src="api.js"></script>
<script>
  const grid=document.getElementById('voiceGrid');
  let data={presets:[],clones:[]};
  function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

  document.querySelectorAll('.chip').forEach((b,i)=>b.addEventListener('click',function(){this.parentNode.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));this.classList.add('active');render(i===0?'clone':'preset');}));

  // 试听用共享 LJAudioPreview(shell.js);播放图标取其内置 SVG
  const PLAY_SVG=window.LJAudioPreview.PLAY_SVG;
  function togglePlay(btn){ window.LJAudioPreview.play(btn.dataset.src, btn); }
  function stopAudio(){ window.LJAudioPreview.stop(); }

  function card(v,isClone){
    const kindLabel = v.kind==='design' ? '设计音色' : '克隆音色';
    const status = v.status==='processing'?' · 复刻中':(v.status==='failed'?' · 失败':'');
    const tag = isClone?'':' <span class="hot">预置</span>';
    const desc = isClone?(kindLabel+status):(`${v.gender||''} · ${v.desc||''}`);
    // 自建(克隆/设计)卡:试听 + 删除 独立操作行
    let actions;
    if(isClone){
      const canPlay = v.status==='ready' && v.sample;
      const play = `<button class="vc-p vc-play" data-src="${v.sample||''}" ${canPlay?'':'disabled style="opacity:.4;cursor:not-allowed"'} onclick="event.stopPropagation();togglePlay(this)" aria-label="试听">${PLAY_SVG}</button>`;
      const del = `<button class="btn btn-dark" style="padding:8px 12px;font-size:12.5px" onclick="event.stopPropagation();delVoice('${v.id}','${esc(v.name)}')">删除</button>`;
      actions = `<div class="vc-actions">${play}${del}</div>`;
    } else {
      // 预置:有 sample 则可真试听(E9 预置试听样本库),否则置灰
      const canPlay = !!v.sample;
      actions = `<button class="vc-p vc-play" data-src="${v.sample||''}" ${canPlay?'':'disabled style="opacity:.4;cursor:not-allowed"'} onclick="event.stopPropagation();togglePlay(this)" aria-label="试听">${PLAY_SVG}</button>`;
    }
    return `<div class="vcard"><div class="vc-b"><div class="vc-n"><span class="flag">🇨🇳</span>${esc(v.name)}${tag}</div><div class="vc-d">${esc(desc)}</div></div>${actions}</div>`;
  }
  function render(which){
    stopAudio();
    const list = which==='preset'?data.presets:data.clones;
    grid.innerHTML = list.length?list.map(v=>card(v,which!=='preset')).join('')
      :`<div style="color:var(--t4);padding:40px">${which==='preset'?'暂无预置':'还没有自建音色,点右上角克隆或设计一个'}</div>`;
  }

  async function delVoice(id,name){
    const ok = await window.LJConfirm({title:'删除音色',body:`确认删除「<b style="color:var(--t1)">${esc(name)}</b>」?删除后不可恢复。`,confirmText:'删除',danger:true});
    if(!ok) return;
    try{ await LJ.del('/voices/'+id); await load(); window.LJToast('已删除音色'); }
    catch(e){ window.LJToast(e.message,'err'); }
  }

  // ── 克隆流程:设计系统弹窗(替代 prompt+confirm)──
  async function cloneVoiceFlow(){
    const me=await LJ.me().catch(()=>null);
    if(!me){ window.LJToast('请先登录','err'); return; }
    resetCvForm(); openModal('cloneVoice');
    setTimeout(()=>document.getElementById('cvName').focus(),60);
  }
  let cvConsented=false;
  function setCvConsent(v){
    cvConsented=v;
    document.getElementById('cvConsentBox').classList.toggle('on',v);
    document.getElementById('cvConsent').setAttribute('aria-checked',v?'true':'false');
    refreshCvBtn();
  }
  function toggleCvConsent(){ setCvConsent(!cvConsented); }
  function refreshCvBtn(){
    const btn=document.getElementById('cvSubmitBtn');
    const name=(document.getElementById('cvName').value||'').trim();
    const hasFile=!!document.getElementById('voiceSample').files[0];
    let txt='克隆音色', ok=true;
    if(!name){ txt='请输入音色名称'; ok=false; }
    else if(!hasFile){ txt='请上传语音样本'; ok=false; }
    else if(!cvConsented){ txt='请勾选已获授权'; ok=false; }
    btn.disabled=!ok; btn.textContent=txt;
  }
  function clearCvUpload(){
    document.getElementById('voiceSample').value='';
    document.getElementById('cvPreview').style.display='none';
    document.getElementById('cvUboxEmpty').style.display='';
    refreshCvBtn();
  }
  function resetCvForm(){
    document.getElementById('cvName').value='';
    document.getElementById('voiceProof').value=''; document.getElementById('cvProofName').textContent='';
    setCvConsent(false); clearCvUpload();
  }
  document.getElementById('voiceSample').addEventListener('change',function(){
    const f=this.files[0]; if(!f) return;
    document.getElementById('cvUboxEmpty').style.display='none';
    document.getElementById('cvPreview').style.display='block';
    document.getElementById('cvSampleName').textContent=f.name;
    refreshCvBtn();
  });
  document.getElementById('voiceProof').addEventListener('change',function(){
    const f=this.files[0]; if(f) document.getElementById('cvProofName').textContent='✓ '+f.name;
  });
  async function submitClone(){
    const btn=document.getElementById('cvSubmitBtn'); if(btn.disabled) return;
    const name=document.getElementById('cvName').value.trim();
    const sample=document.getElementById('voiceSample').files[0];
    const proof=document.getElementById('voiceProof').files[0];
    const fd=new FormData(); fd.append('name',name); fd.append('consent','true'); fd.append('sample',sample);
    if(proof) fd.append('proof',proof);
    btn.disabled=true; btn.textContent='克隆中…';
    try{
      const res=await fetch('/api/voices',{method:'POST',body:fd,credentials:'same-origin'});
      if(res.status===401){location.href='login.html';return;}
      const d=await res.json().catch(()=>({}));
      if(!res.ok) throw new Error(d.error||'克隆失败');
      closeModal('cloneVoice'); await load();
      window.LJToast('✓ 音色「'+name+'」已提交克隆');
    }catch(e){ window.LJToast(e.message,'err'); refreshCvBtn(); }
  }
  // Esc 关闭克隆弹窗
  document.addEventListener('keydown',e=>{ if(e.key==='Escape' && document.getElementById('ov-cloneVoice').classList.contains('show')) closeModal('cloneVoice'); });

  async function load(){
    try{
      data=await LJ.get('/voices');
      const chips=document.querySelectorAll('.chip');
      if(chips[0])chips[0].textContent='我的音色 · '+data.clones.length;
      if(chips[1])chips[1].textContent='预置人声 · '+data.presets.length;
      const active=document.querySelector('.chip.active');
      render(active===chips[1]?'preset':'clone');
    }catch(e){}
  }
  load();
</script>
</body>
</html>

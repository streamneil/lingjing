# 灵镜 — 生产部署:caddy(HTTPS 反代) + app。对象存储用阿里云 OSS(不再用 MinIO)。
# 决策来源:/plan-eng-review D11(去 Redis,DB 队列);2026-06 收口:生产只用 OSS,移除 MinIO 容器。
#
# 安全边界:
#   - 只有 caddy 对公网映射端口(80 ACME challenge + 443 HTTPS)。
#   - app(9372)不对外映射,只同 Docker 网络供 caddy 反代。
#     这样没人能绕过 caddy 直连 app 伪造 X-Forwarded-Proto。
# 私有化交付:把这份 compose + .env 丢进客户内网(域名换内网域名/自签证书)。
#   注意:私有化内网下 wan2.2-s2v 的公网素材 URL 问题需单独方案(见 TODOS.md T-PUBLIC-URL)。

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy   # 等 app healthy 再起反代,首启不打 502
    ports:
      - "80:80"   # ACME HTTP-01 challenge 必须(只映 443 证书申不下来)
      - "443:443" # HTTPS
    environment:
      LJ_DOMAIN: ${LJ_DOMAIN}            # 你的域名(A 记录须先指向本机)
      LJ_ACME_EMAIL: ${LJ_ACME_EMAIL:-}  # 证书到期通知邮箱
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data    # 证书持久化(别每次重启重申,防 Let's Encrypt 限流)
      - caddy-config:/config

  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 9372
      TZ: ${TZ:-Asia/Shanghai}        # 审计/积分时间戳按本地时区,别差 8 小时
      # 平台超管引导(缺 SUPERADMIN_PASS 拒启,这是设计)
      SUPERADMIN_USER: ${SUPERADMIN_USER:-admin}
      SUPERADMIN_PASS: ${SUPERADMIN_PASS:?需在 .env 设置 SUPERADMIN_PASS}
      # 生产经 caddy HTTPS,cookie 必须带 Secure
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # 主密钥:AES-256-GCM 加密厂商 key 存库。要在 /admin 配厂商 key 必须有它(缺则贴 key 失败)。
      MASTER_KEY: ${MASTER_KEY:?需在 .env 设置 MASTER_KEY(openssl rand -base64 32)}
      # 厂商 API Key(百炼/火山/Google)不经 .env,部署后在 /admin「厂商 / Key」配(加密入库)。
      # 阿里云 OSS(生产对象存储;wan2.2-s2v 需公网可达素材 URL)。
      # 四项缺一不可:region+bucket+key+secret 都非空 OSS 才启用,否则生成会失败。
      # AccessKey 可复用 DashScope 同账号 RAM 用户(授权 AliyunOSSFullAccess)。
      OSS_REGION: ${OSS_REGION:?需在 .env 设置 OSS_REGION(如 oss-cn-hangzhou)}
      OSS_BUCKET: ${OSS_BUCKET:?需在 .env 设置 OSS_BUCKET}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:?需在 .env 设置 OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:?需在 .env 设置 OSS_ACCESS_KEY_SECRET}
      # worker 并发池(默认 16)。4c8g 偏激进,如压不住可在 .env 调小,如 WORKER_POOL_SIZE=8。
      WORKER_POOL_SIZE: ${WORKER_POOL_SIZE:-16}
      DB_FILE: /data/lingjing.db
      # Gemini 出网代理(大陆 ECS 直连 Google 被墙时在 .env 填;仅 Gemini 走代理,百炼/火山直连)。
      # 容器内 127.0.0.1≠宿主机 → 用 host.docker.internal(见下方 extra_hosts);留空=直连。详见 README。
      GEMINI_PROXY: ${GEMINI_PROXY:-}
      # OpenAI(GPT Image 2)出网代理:同 GEMINI_PROXY,大陆 ECS 直连 api.openai.com 被墙时在 .env 填。
      # 缺这行 → .env 里的 OPENAI_PROXY 不会传进容器 → OpenAI 直连被墙 fetch failed。留空=直连。
      OPENAI_PROXY: ${OPENAI_PROXY:-}
      # 在线支付(微信/支付宝):公网基址 = 支付回调/返回页地址来源;不填则在线通道占位(对公不受影响)。
      # 缺这三行 → .env 配了也进不了容器(OPENAI_PROXY 漏转发同款事故,勿删)。
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      WECHAT_PROXY: ${WECHAT_PROXY:-}
      ALIPAY_PROXY: ${ALIPAY_PROXY:-}
      # 火山方舟私域素材库(Seedance 真人图被拦 → asset:// 化重试;默认关,.env 开)。
      # 缺这些行 → .env 配了也进不了容器(OPENAI_PROXY 漏转发同款事故,勿删)。
      # 注意:config.ts optional() 用 ??,空串不回落默认 → 有默认值的项这里必须复制代码默认值。
      ARK_ASSET_LIBRARY_ENABLED: ${ARK_ASSET_LIBRARY_ENABLED:-false}
      ARK_ASSET_AK: ${ARK_ASSET_AK:-}
      ARK_ASSET_SK: ${ARK_ASSET_SK:-}
      ARK_ASSET_PROJECT: ${ARK_ASSET_PROJECT:-}
      ARK_ASSET_GROUP: ${ARK_ASSET_GROUP:-lingjing-portraits}
      ARK_ASSET_REGISTER_TIMEOUT_MS: ${ARK_ASSET_REGISTER_TIMEOUT_MS:-90000}
      ARK_ASSET_POLL_INTERVAL_MS: ${ARK_ASSET_POLL_INTERVAL_MS:-3000}
      ARK_ASSET_RETRY_ON_CODES: ${ARK_ASSET_RETRY_ON_CODES:-InputImageSensitiveContentDetected}
      ARK_ASSET_DEBUG: ${ARK_ASSET_DEBUG:-}
      # MCP 请求体上限(upload_image 走 base64 内联,故 /mcp 需要远大于全局 1mb 的上限)。
      # 缺这行 → .env 配了也进不了容器,运营调不动上限(OPENAI_PROXY 漏转发同款事故,勿删)。
      # 默认值与 src/mcp/index.ts 保持一致;填非法值时代码会告警并回落 32mb。
      MCP_BODY_LIMIT: ${MCP_BODY_LIMIT:-32mb}
      # /mcp 并发在飞字节总预算(v0.9.2 起)。同上:缺这行 → .env 配了也进不了容器。
      # 默认值与 src/mcp/index.ts 保持一致;填非法值时代码会告警并回落 128mb。
      MCP_INFLIGHT_BYTES: ${MCP_INFLIGHT_BYTES:-128mb}
      # 开放 API / MCP 密钥限速(读写分级)。同时作用于 REST(auth/middleware.ts)与 /mcp。
      # 同上:缺这两行 → .env 配了也进不了容器。默认值与代码保持一致。
      API_RATE_WRITE_PER_MIN: ${API_RATE_WRITE_PER_MIN:-60}
      API_RATE_READ_PER_MIN: ${API_RATE_READ_PER_MIN:-300}
    # 让容器能解析宿主机(Gemini 走宿主机 clash 代理时:GEMINI_PROXY=http://host.docker.internal:7890)。
    # 无害:没配 GEMINI_PROXY 时没人解析它。需 Docker 20.10+。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 不对外映射端口:只 caddy 同网络反代 app:9372。
    volumes:
      - app-data:/data
    healthcheck:
      # node:22-slim 无 curl,用 node 原生 fetch 探测
      test: ["CMD", "node", "-e", "fetch('http://localhost:9372/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  app-data:
  caddy-data:
  caddy-config:

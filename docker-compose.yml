# 灵镜 — 生产部署:caddy(HTTPS 反代) + app。对象存储用阿里云 OSS(不再用 MinIO)。
# 决策来源:/plan-eng-review D11(去 Redis,DB 队列);2026-06 收口:生产只用 OSS,移除 MinIO 容器。
#
# 安全边界:
#   - 只有 caddy 对公网映射端口(80 ACME challenge + 443 HTTPS)。
#   - app(9372)不对外映射,只同 Docker 网络供 caddy 反代。
#     这样没人能绕过 caddy 直连 app 伪造 X-Forwarded-Proto。
# 私有化交付:把这份 compose + .env 丢进客户内网(域名换内网域名/自签证书)。
#   注意:私有化内网下 wan2.2-s2v 的公网素材 URL 问题需单独方案(见 TODOS.md T-PUBLIC-URL)。

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy   # 等 app healthy 再起反代,首启不打 502
    ports:
      - "80:80"   # ACME HTTP-01 challenge 必须(只映 443 证书申不下来)
      - "443:443" # HTTPS
    environment:
      LJ_DOMAIN: ${LJ_DOMAIN}            # 你的域名(A 记录须先指向本机)
      LJ_ACME_EMAIL: ${LJ_ACME_EMAIL:-}  # 证书到期通知邮箱
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data    # 证书持久化(别每次重启重申,防 Let's Encrypt 限流)
      - caddy-config:/config

  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 9372
      TZ: ${TZ:-Asia/Shanghai}        # 审计/积分时间戳按本地时区,别差 8 小时
      # 平台超管引导(缺 SUPERADMIN_PASS 拒启,这是设计)
      SUPERADMIN_USER: ${SUPERADMIN_USER:-admin}
      SUPERADMIN_PASS: ${SUPERADMIN_PASS:?需在 .env 设置 SUPERADMIN_PASS}
      # 生产经 caddy HTTPS,cookie 必须带 Secure
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?需在 .env 设置 DASHSCOPE_API_KEY}
      BAICHUAN_AVATAR_MODEL: ${BAICHUAN_AVATAR_MODEL:-}
      BAICHUAN_PRESET_AVATAR: ${BAICHUAN_PRESET_AVATAR:-}
      BAICHUAN_PRESET_VOICE: ${BAICHUAN_PRESET_VOICE:-cosyvoice-v1}
      # 阿里云 OSS(生产对象存储;wan2.2-s2v 需公网可达素材 URL)。
      # 四项缺一不可:region+bucket+key+secret 都非空 OSS 才启用,否则生成会失败。
      # AccessKey 可复用 DashScope 同账号 RAM 用户(授权 AliyunOSSFullAccess)。
      OSS_REGION: ${OSS_REGION:?需在 .env 设置 OSS_REGION(如 oss-cn-hangzhou)}
      OSS_BUCKET: ${OSS_BUCKET:?需在 .env 设置 OSS_BUCKET}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:?需在 .env 设置 OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:?需在 .env 设置 OSS_ACCESS_KEY_SECRET}
      # worker 并发池(默认 16)。4c8g 偏激进,如压不住可在 .env 调小,如 WORKER_POOL_SIZE=8。
      WORKER_POOL_SIZE: ${WORKER_POOL_SIZE:-16}
      DB_FILE: /data/lingjing.db
    # 不对外映射端口:只 caddy 同网络反代 app:9372。
    volumes:
      - app-data:/data
    healthcheck:
      # node:22-slim 无 curl,用 node 原生 fetch 探测
      test: ["CMD", "node", "-e", "fetch('http://localhost:9372/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  app-data:
  caddy-data:
  caddy-config:
